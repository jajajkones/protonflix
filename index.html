<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProtonFlix - Minimal Cinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://image.tmdb.org">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #737373;
            --text-dark: #333333;
            --radius-subtle: 4px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); /* Ensures text is always visible */
        }

        /* Header */
        header {
            padding: 60px 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .logo {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .search-wrapper {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-type-toggle {
            display: inline-flex;
            justify-content: center;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 50px;
            padding: 6px;
            margin: 0 auto;
        }

        .search-type-toggle label {
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 10px 24px;
            border-radius: 50px;
            transition: var(--transition);
        }
        .search-type-toggle input { display: none; }
        
        .search-type-toggle label:has(input:checked) {
            background: var(--text-main);
            color: #000;
            text-shadow: none;
        }
        .search-type-toggle label:hover:not(:has(input:checked)) { 
            color: var(--text-main); 
        }

        .search-container {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--text-dark);
            padding: 15px 0;
            transition: var(--transition);
        }
        .search-container:focus-within { border-color: var(--text-muted); }

        .search-container input {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 100%;
            font-size: 32px;
            font-weight: 300;
            outline: none;
            padding: 0;
        }
        .search-container input::placeholder { color: var(--text-dark); }
        
        .search-container button {
            background: transparent;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            font-size: 24px;
            transition: var(--transition);
        }
        .search-container button:hover { color: var(--text-main); }

        /* Main Content */
        main {
            flex: 1;
            padding: 0 40px 80px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Movie Grid */
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 60px 30px;
        }

        .movie-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0.8;
            transition: var(--transition);
        }
        .movie-card:hover { opacity: 1; }

        .poster-container {
            position: relative;
            width: 100%;
            padding-top: 150%;
            border-radius: var(--radius-subtle);
            overflow: hidden;
            background: #0a0a0a;
        }

        .movie-card img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .movie-card:hover img { transform: scale(1.03); }

        .movie-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .movie-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Details Section */
        #details-container {
            display: none;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto 80px;
            padding: 0 40px;
            animation: fadeIn 0.6s ease;
        }
        #details-container.active { display: block; }

        .details-hero {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 80px;
            position: relative;
        }

        .details-poster {
            width: 100%;
            border-radius: var(--radius-subtle);
        }

        .details-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 20px;
        }

        .details-title {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: -1.5px;
            margin-bottom: 24px;
            line-height: 1.1;
        }

        .details-meta-large {
            display: flex;
            gap: 24px;
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 40px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details-overview {
            font-size: 17px;
            line-height: 1.8;
            color: #a3a3a3;
            max-width: 800px;
            margin-bottom: 50px;
            font-weight: 300;
        }

        .play-btn {
            background: var(--text-main);
            color: var(--bg-color);
            border: none;
            padding: 16px 40px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            width: fit-content;
            transition: var(--transition);
            text-shadow: none; /* Remove shadow for dark text on light button */
        }
        .play-btn:hover { background: #d4d4d4; }

        .close-details {
            position: absolute;
            top: 0; right: 0;
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 28px;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
        }
        .close-details:hover { color: var(--text-main); }

        /* Minimal TV Episode Picker */
        .tv-episodes-section { margin-top: 80px; }
        
        .season-picker {
            display: flex;
            gap: 40px;
            margin-bottom: 50px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 20px;
            overflow-x: auto;
        }
        .season-picker::-webkit-scrollbar { display: none; }

        .season-pill {
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
            white-space: nowrap;
        }
        .season-pill:hover { color: var(--text-muted); }
        .season-pill.active {
            color: var(--text-main);
            font-weight: 500;
        }

        .episodes-carousel {
            display: flex;
            gap: 24px;
            overflow-x: auto;
            padding: 0 40px 30px;
            margin: 0 -40px;
            width: calc(100% + 80px);
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .episodes-carousel::-webkit-scrollbar {
            height: 6px;
        }
        .episodes-carousel::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        .episodes-carousel::-webkit-scrollbar-track {
            background: transparent;
        }

        .episode-card {
            flex: 0 0 260px; /* Fixed width for horizontal scrolling */
            scroll-snap-align: start;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0.7;
            transition: var(--transition);
        }
        .episode-card:hover { opacity: 1; }

        .episode-thumbnail {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #0a0a0a;
            border-radius: var(--radius-subtle);
            overflow: hidden;
        }
        .episode-thumbnail img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s;
        }
        .episode-card:hover .episode-thumbnail img { transform: scale(1.05); }

        .episode-number {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .episode-title {
            font-size: 16px;
            font-weight: 400;
        }

        /* Player Section */
        #player-container {
            display: none;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto 80px;
            padding: 0 40px;
            animation: fadeIn 0.8s ease;
        }
        #player-container.active { display: block; }

        .player-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            border-radius: var(--radius-subtle);
            overflow: hidden;
            background: #0a0a0a;
            margin-bottom: 24px;
        }
        .player-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .player-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 30px;
        }

        .now-playing-title {
            font-size: 24px;
            font-weight: 300;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .server-controls {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .server-btn {
            background: transparent;
            color: var(--text-dark);
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: var(--transition);
        }
        .server-btn:hover { color: var(--text-muted); }
        .server-btn.active { color: var(--text-main); }
        
        .close-player-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: var(--radius-subtle);
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: var(--transition);
            margin-left: auto;
        }
        .close-player-btn:hover { color: #fff; border-color: #fff; }

        /* Status */
        .status-message {
            text-align: center;
            padding: 120px 20px;
            color: var(--text-dark);
            font-size: 24px;
            font-weight: 300;
            grid-column: 1 / -1;
        }

        .ambient-bg {
            position: fixed;
            top: -15%;
            left: -15%;
            width: 130vw;
            height: 130vh;
            background-size: cover;
            background-position: center;
            filter: blur(140px) saturate(250%) brightness(1.3);
            opacity: 0;
            z-index: -1;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
            background-color: #000;
        }
        
        .ambient-bg.active {
            opacity: 0.35; /* Balanced for perfect text visibility */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            padding: 60px;
            color: #333;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            header, main, #details-container, #player-container { padding-left: 20px; padding-right: 20px; }
            .details-hero { grid-template-columns: 1fr; gap: 40px; }
            .details-poster { max-width: 240px; margin: 0 auto; }
            .details-content { align-items: center; text-align: center; }
            .search-container input { font-size: 24px; }
            .player-footer { flex-direction: column; align-items: flex-start; }
            .close-player-btn { margin-left: 0; }
            #results { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 40px 15px; }
            .episodes-carousel {
                padding: 0 20px 20px;
                margin: 0 -20px 40px;
                width: calc(100% + 40px);
            }
        }
    </style>
</head>
<body>

    <div id="ambient-bg-1" class="ambient-bg active"></div>
    <div id="ambient-bg-2" class="ambient-bg"></div>

    <header>
        <a href="#" class="logo" onclick="window.location.reload()">ProtonFlix</a>
        <div class="search-wrapper">
            <div class="search-type-toggle">
                <label>
                    <input type="radio" name="searchType" value="movie" checked onchange="handleSearchTypeChange()"> 
                    Movies
                </label>
                <label>
                    <input type="radio" name="searchType" value="tv" onchange="handleSearchTypeChange()"> 
                    Series
                </label>
            </div>
            <div class="search-container">
                <input type="text" id="searchBox" placeholder="Search...">
                <button onclick="searchContent()" aria-label="Search">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </header>

    <div id="details-container">
        <!-- Details injected via JS -->
    </div>

    <div id="player-container">
        <div class="player-wrapper">
            <iframe id="player" allowfullscreen></iframe>
        </div>
        
        <div class="player-footer">
            <div class="now-playing-title" id="now-playing-title">Playing</div>
            <div class="server-controls">
                <button class="server-btn active" onclick="changeServer('vidking', this)">Vidking</button>
                <button class="server-btn" onclick="changeServer('vidsrcto', this)">VidSrc.to</button>
                <button class="server-btn" onclick="changeServer('vidsrcme', this)">VidSrc.me</button>
                <button class="server-btn" onclick="changeServer('superembed', this)">SuperEmbed</button>
            </div>
            <button class="close-player-btn" onclick="hidePlayer()">Close Player</button>
        </div>
    </div>

    <main>
        <div id="results">
            <!-- Results injected here -->
        </div>
    </main>

    <footer>
        Data provided by TMDB. No files are hosted on this server.
    </footer>

    <script>
        const API_KEY = "43d8f772a79e81fa360691590cc5c7be";
        const resultsDiv = document.getElementById("results");
        const detailsContainer = document.getElementById("details-container");
        const playerContainer = document.getElementById("player-container");
        const playerIframe = document.getElementById("player");
        const searchInput = document.getElementById("searchBox");
        const nowPlayingTitle = document.getElementById("now-playing-title");

        let currentId = null;
        let currentType = 'movie'; 
        let currentServer = 'vidking';
        let currentItemTitle = '';
        let currentPoster = '';
        let currentBackdrop = '';
        let tvData = null;
        
        let activeSeason = 1;
        let activeEpisode = 1;

        document.addEventListener('DOMContentLoaded', () => {
            resultsDiv.innerHTML = `<div class="status-message">Begin typing to discover</div>`;
        });

        let activeAmbient = 1;

        function setAmbientBg(imageUrl) {
            const bg1 = document.getElementById('ambient-bg-1');
            const bg2 = document.getElementById('ambient-bg-2');
            
            if (!bg1 || !bg2) return;
            
            if (!imageUrl) {
                bg1.classList.remove('active');
                bg2.classList.remove('active');
                return;
            }

            // Crossfade logic
            if (activeAmbient === 1) {
                bg2.style.backgroundImage = `url('${imageUrl}')`;
                bg2.classList.add('active');
                bg1.classList.remove('active');
                activeAmbient = 2;
            } else {
                bg1.style.backgroundImage = `url('${imageUrl}')`;
                bg1.classList.add('active');
                bg2.classList.remove('active');
                activeAmbient = 1;
            }
        }

        function getSearchType() {
            return document.querySelector('input[name="searchType"]:checked').value;
        }

        function handleSearchTypeChange() {
            if (searchInput.value.trim()) searchContent();
        }

        async function searchContent() {
            const query = searchInput.value.trim();
            if (!query) return;

            hideDetails();
            hidePlayer();
            setAmbientBg(null); // Reset ambient bg to black on new search

            const type = getSearchType();
            const url = `https://api.themoviedb.org/3/search/${type}?api_key=${API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
            
            resultsDiv.innerHTML = `<div class="status-message">Searching...</div>`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                resultsDiv.innerHTML = "";

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = `<div class="status-message">No results found.</div>`;
                    return;
                }

                const validItems = data.results.filter(item => item.poster_path);

                resultsDiv.innerHTML = validItems.map(item => {
                    const poster = `https://image.tmdb.org/t/p/w500${item.poster_path}`;
                    const title = item.title || item.name;
                    const date = item.release_date || item.first_air_date;
                    const year = date ? date.split('-')[0] : '';
                    const rating = item.vote_average ? item.vote_average.toFixed(1) : 'NR';

                    // Using a single string concatenation for better DOM efficiency
                    return `
                        <div class="movie-card" onclick="fetchDetails(${item.id}, '${type}')">
                            <div class="poster-container">
                                <img src="${poster}" alt="${title.replace(/"/g, '&quot;')}" loading="lazy">
                            </div>
                            <div class="movie-info">
                                <div class="movie-title" title="${title.replace(/"/g, '&quot;')}">${title}</div>
                                <div class="movie-meta" style="display: flex; justify-content: space-between;">
                                    <span>${year}</span>
                                    <span style="display:flex; align-items:center; gap:4px; color:var(--text-main); font-weight:500;">
                                        <i class="fa-solid fa-star" style="font-size:10px; color:#f5c518;"></i> ${rating}
                                    </span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error("Fetch error:", error);
                resultsDiv.innerHTML = `<div class="status-message">Connection error.</div>`;
            }
        }

        async function fetchDetails(id, type, autoPlay = false) {
            hidePlayer();
            
            const url = `https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}`;
            
            detailsContainer.innerHTML = `<div class="status-message">Loading...</div>`;
            detailsContainer.classList.add("active");
            
            if (!autoPlay) {
                // Allow a tiny delay for the browser to render before scrolling
                setTimeout(() => {
                    detailsContainer.scrollIntoView({ behavior: "smooth", block: "start" });
                }, 50);
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                currentId = data.id;
                currentType = type;
                currentItemTitle = data.title || data.name;
                currentPoster = data.poster_path ? `https://image.tmdb.org/t/p/w500${data.poster_path}` : 'https://via.placeholder.com/500x750/111/333?text=No+Poster';
                currentBackdrop = data.backdrop_path ? `https://image.tmdb.org/t/p/w780${data.backdrop_path}` : '';
                
                const title = currentItemTitle;
                const date = data.release_date || data.first_air_date;
                const year = date ? date.split('-')[0] : '';
                const rating = data.vote_average ? data.vote_average.toFixed(1) : 'NR';
                const runtime = data.runtime ? `${data.runtime}m` : (data.episode_run_time && data.episode_run_time[0] ? `${data.episode_run_time[0]}m` : '');
                const poster = currentPoster;
                
                setAmbientBg(data.backdrop_path ? `https://image.tmdb.org/t/p/w1280${data.backdrop_path}` : poster);
                
                if (type === 'movie') {
                    detailsContainer.innerHTML = `
                        <div class="details-hero">
                            <button class="close-details" onclick="hideDetails()"><i class="fa-solid fa-xmark"></i></button>
                            ${poster ? `<img src="${poster}" class="details-poster" alt="${title}">` : ''}
                            
                            <div class="details-content">
                                <h1 class="details-title">${title}</h1>
                                <div class="details-meta-large">
                                    <span>${year}</span>
                                    ${runtime ? `<span>${runtime}</span>` : ''}
                                    <span style="color:var(--text-main); font-weight:500;"><i class="fa-solid fa-star" style="color:#f5c518; margin-right:6px;"></i>${rating}</span>
                                </div>
                                <p class="details-overview">${data.overview || ''}</p>
                                <button class="play-btn" onclick="startPlayback()">Play Movie</button>
                            </div>
                        </div>
                    `;
                } else if (type === 'tv') {
                    tvData = data;
                    detailsContainer.innerHTML = `
                        <div class="details-hero">
                            <button class="close-details" onclick="hideDetails()"><i class="fa-solid fa-xmark"></i></button>
                            ${poster ? `<img src="${poster}" class="details-poster" alt="${title}">` : ''}
                            
                            <div class="details-content">
                                <h1 class="details-title">${title}</h1>
                                <div class="details-meta-large">
                                    <span>${year}</span>
                                    <span>Series</span>
                                    <span style="color:var(--text-main); font-weight:500;"><i class="fa-solid fa-star" style="color:#f5c518; margin-right:6px;"></i>${rating}</span>
                                </div>
                                <p class="details-overview">${data.overview || ''}</p>
                            </div>
                        </div>
                        
                        <div class="tv-episodes-section" id="tv-episodes-section">
                            <div class="season-picker" id="season-picker"></div>
                            <div class="episodes-carousel" id="episodes-grid"></div>
                        </div>
                    `;
                    renderSeasons(data.seasons);
                }

                if (autoPlay) {
                    if (type === 'tv') {
                        // Select the correct season pill to load the right episode grid in the background
                        const pills = document.querySelectorAll('.season-pill');
                        pills.forEach(pill => {
                            if (pill.innerText.includes(`Season ${activeSeason}`)) pill.click();
                        });
                        setTimeout(() => startPlayback(activeSeason, activeEpisode), 100);
                    } else {
                        startPlayback();
                    }
                }

            } catch (error) {
                console.error("Details fetch error:", error);
                detailsContainer.innerHTML = `<div class="status-message" onclick="hideDetails()">Error loading details. Close.</div>`;
            }
        }

        function renderSeasons(seasons) {
            const picker = document.getElementById('season-picker');
            if (!picker) return;
            
            const validSeasons = seasons.filter(s => s.season_number > 0);
            
            picker.innerHTML = validSeasons.map((s, index) => `
                <div class="season-pill ${index === 0 ? 'active' : ''}" 
                     onclick="selectSeason(${s.season_number}, this)">
                    Season ${s.season_number}
                </div>
            `).join('');
            
            if (validSeasons.length > 0) {
                selectSeason(validSeasons[0].season_number, picker.firstElementChild);
            }
        }

        function selectSeason(seasonNumber, element) {
            if (element) {
                document.querySelectorAll('.season-pill').forEach(pill => pill.classList.remove('active'));
                element.classList.add('active');
            }
            fetchAndRenderEpisodes(seasonNumber);
        }

        async function fetchAndRenderEpisodes(seasonNumber) {
            const grid = document.getElementById('episodes-grid');
            if (!grid) return;
            
            grid.innerHTML = `<div class="status-message" style="padding:40px; grid-column:1/-1;">Loading...</div>`;
            
            try {
                const url = `https://api.themoviedb.org/3/tv/${currentId}/season/${seasonNumber}?api_key=${API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (!data.episodes || data.episodes.length === 0) {
                    grid.innerHTML = `<div style="grid-column:1/-1; color:#555;">No episodes available.</div>`;
                    return;
                }
                
                grid.innerHTML = data.episodes.map(ep => {
                    const thumb = ep.still_path ? `https://image.tmdb.org/t/p/w500${ep.still_path}` : 'https://via.placeholder.com/500x281/111111/333333?text=...';
                    const epName = ep.name || `Episode ${ep.episode_number}`;
                    return `
                        <div class="episode-card" onclick="startPlayback(${seasonNumber}, ${ep.episode_number}, '${epName.replace(/'/g, "\\'")}')">
                            <div class="episode-thumbnail">
                                <img src="${thumb}" alt="${epName}" loading="lazy">
                            </div>
                            <div style="display:flex; flex-direction:column; gap:4px;">
                                <div class="episode-number">Episode ${ep.episode_number}</div>
                                <div class="episode-title" title="${epName}">${epName}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (err) {
                console.error("Error fetching episodes:", err);
                grid.innerHTML = `<div style="grid-column:1/-1; color:#555;">Failed to load.</div>`;
            }
        }

        function startPlayback(season = 1, episode = 1, epName = "") {
            activeSeason = season;
            activeEpisode = episode;
            
            if (currentType === 'movie') {
                nowPlayingTitle.textContent = currentItemTitle;
            } else {
                nowPlayingTitle.textContent = `${currentItemTitle} — S${season} E${episode}`;
            }

            playerContainer.classList.add("active");
            updatePlayerSource(activeSeason, activeEpisode);
            
            playerContainer.scrollIntoView({ behavior: "smooth" });
        }

        function hideDetails() {
            detailsContainer.classList.remove("active");
            detailsContainer.innerHTML = "";
        }

        function changeServer(serverName, btnElement) {
            currentServer = serverName;
            
            document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            
            if (playerContainer.classList.contains("active")) {
                updatePlayerSource(activeSeason, activeEpisode);
            }
        }

        function updatePlayerSource(season, episode) {
            if (!currentId) return;
            
            // Check for saved progress
            let progressParam = '';
            try {
                const history = JSON.parse(localStorage.getItem('protonflix_history') || '{}');
                const saved = history[currentId];
                if (saved && saved.progress < 99) {
                    if (currentType === 'movie' || (currentType === 'tv' && saved.season === season && saved.episode === episode)) {
                        progressParam = `&progress=${Math.floor(saved.currentTime)}`;
                    }
                }
            } catch (e) {}

            let url = "";
            
            if (currentType === 'movie') {
                switch(currentServer) {
                    case 'vidking':
                        url = `https://www.vidking.net/embed/movie/${currentId}?color=ffffff&autoPlay=true${progressParam}`;
                        break;
                    case 'vidsrcto':
                        url = `https://vidsrc.to/embed/movie/${currentId}`;
                        break;
                    case 'vidsrcme':
                        url = `https://vidsrc.me/embed/movie?tmdb=${currentId}`;
                        break;
                    case 'superembed':
                        url = `https://multiembed.mov/directstream.php?video_id=${currentId}&tmdb=1`;
                        break;
                }
            } else {
                switch(currentServer) {
                    case 'vidking':
                        url = `https://www.vidking.net/embed/tv/${currentId}/${season}/${episode}?color=ffffff&autoPlay=true&nextEpisode=true&episodeSelector=true${progressParam}`;
                        break;
                    case 'vidsrcto':
                        url = `https://vidsrc.to/embed/tv/${currentId}/${season}/${episode}`;
                        break;
                    case 'vidsrcme':
                        url = `https://vidsrc.me/embed/tv?tmdb=${currentId}&season=${season}&episode=${episode}`;
                        break;
                    case 'superembed':
                        url = `https://multiembed.mov/directstream.php?video_id=${currentId}&tmdb=1&s=${season}&e=${episode}`;
                        break;
                }
            }
            
            playerIframe.src = url;
        }
        
        function hidePlayer() {
            playerContainer.classList.remove("active");
            playerIframe.src = "";
        }

        searchInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") searchContent();
        });

        // Listen for player events (Vidking API) for progress tracking and autoplay
        window.addEventListener("message", function(event) {
            try {
                const payload = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                
                if (payload && payload.type === 'PLAYER_EVENT' && payload.data) {
                    const data = payload.data;
                    
                    // Sync our UI if the player internally switches episodes
                    if (data.season && data.episode && currentType === 'tv') {
                        if (data.season != activeSeason || data.episode != activeEpisode) {
                            activeSeason = data.season;
                            activeEpisode = data.episode;
                            
                            // Update the "Playing" title text
                            nowPlayingTitle.textContent = `${currentItemTitle} — S${activeSeason} E${activeEpisode}`;
                            
                            // Auto-select the right season pill so the carousel shows the new episode
                            const pills = document.querySelectorAll('.season-pill');
                            pills.forEach(pill => {
                                if (pill.innerText.includes(`Season ${activeSeason}`) && !pill.classList.contains('active')) {
                                    pill.click();
                                }
                            });
                        }
                    }
                    
                    // Track progress
                    if (data.event === 'timeupdate' || data.event === 'pause' || data.event === 'ended') {
                        saveWatchProgress(data);
                    }
                    
                    // Autoplay Next Episode if the player doesn't handle it or we want to force our own logic
                    if (data.event === 'ended' && currentType === 'tv') {
                        playNextEpisode();
                    }
                }
            } catch (err) {}
        });

        function saveWatchProgress(data) {
            if (!currentId || !currentItemTitle) return;
            
            const history = JSON.parse(localStorage.getItem('protonflix_history') || '{}');
            
            history[currentId] = {
                id: currentId,
                title: currentItemTitle,
                type: currentType,
                poster: currentPoster,
                backdrop: currentBackdrop,
                season: activeSeason,
                episode: activeEpisode,
                progress: data.progress || 0, // Percentage
                currentTime: data.currentTime || 0,
                duration: data.duration || 0,
                timestamp: Date.now()
            };

            localStorage.setItem('protonflix_history', JSON.stringify(history));
        }

        function playNextEpisode() {
            if (!tvData || !tvData.seasons) return;
            
            const currentSeasonData = tvData.seasons.find(s => s.season_number == activeSeason);
            if (!currentSeasonData) return;
            
            if (activeEpisode < currentSeasonData.episode_count) {
                // Next episode in the same season
                const nextEp = activeEpisode + 1;
                startPlayback(activeSeason, nextEp);
            } else {
                // Try next season
                const nextSeasonNum = activeSeason + 1;
                const nextSeasonData = tvData.seasons.find(s => s.season_number == nextSeasonNum);
                
                if (nextSeasonData && nextSeasonData.episode_count > 0) {
                    // Switch season tab and play first episode
                    const pills = document.querySelectorAll('.season-pill');
                    pills.forEach(pill => {
                        if (pill.innerText.includes(`Season ${nextSeasonNum}`)) pill.click();
                    });
                    setTimeout(() => startPlayback(nextSeasonNum, 1), 800);
                }
            }
        }
    </script>
</body>
</html>
