<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#3b82f6;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}header h1{font-size:20px;font-weight:500}header a{color:var(--muted);text-decoration:none;font-size:13px}header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:1000px;width:100%;margin:0 auto}
.preview{width:100%;height:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;padding:10px;display:flex;overflow:auto}
.item{background:var(--accent);color:#fff;border-radius:var(--radius);padding:12px 16px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;min-width:60px;min-height:40px}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.control{display:flex;flex-direction:column;gap:4px}
.control label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.control select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px;font-size:12px;font-family:inherit;outline:none}
.btn-row{display:flex;gap:8px;margin-bottom:16px}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:var(--radius);font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444}
.css-output{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:'SF Mono',monospace;font-size:13px;white-space:pre-wrap;cursor:pointer;transition:border-color .2s;line-height:1.8}
.css-output:hover{border-color:#444}
.item-count{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.item-count span{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>Flexbox Generator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="item-count">
<button class="btn" onclick="changeItems(-1)">- Item</button>
<span id="itemCount">4</span>
<button class="btn" onclick="changeItems(1)">+ Item</button>
</div>
<div class="preview" id="preview"></div>
<div class="controls">
<div class="control"><label>display</label><select id="display" onchange="update()"><option value="flex">flex</option><option value="inline-flex">inline-flex</option></select></div>
<div class="control"><label>flex-direction</label><select id="direction" onchange="update()"><option value="row">row</option><option value="row-reverse">row-reverse</option><option value="column">column</option><option value="column-reverse">column-reverse</option></select></div>
<div class="control"><label>justify-content</label><select id="justify" onchange="update()"><option value="flex-start">flex-start</option><option value="flex-end">flex-end</option><option value="center">center</option><option value="space-between">space-between</option><option value="space-around">space-around</option><option value="space-evenly">space-evenly</option></select></div>
<div class="control"><label>align-items</label><select id="align" onchange="update()"><option value="stretch">stretch</option><option value="flex-start">flex-start</option><option value="flex-end">flex-end</option><option value="center">center</option><option value="baseline">baseline</option></select></div>
<div class="control"><label>flex-wrap</label><select id="wrap" onchange="update()"><option value="nowrap">nowrap</option><option value="wrap">wrap</option><option value="wrap-reverse">wrap-reverse</option></select></div>
<div class="control"><label>gap</label><select id="gap" onchange="update()"><option value="0">0</option><option value="4">4px</option><option value="8">8px</option><option value="12">12px</option><option value="16" selected>16px</option><option value="24">24px</option><option value="32">32px</option></select></div>
</div>
<div class="btn-row"><button class="btn" onclick="randomItems()">Random Colors</button></div>
<div class="css-output" id="cssOutput" onclick="navigator.clipboard.writeText(this.textContent)"></div>
</div>
<script>
let items=4;const colors=['#3b82f6','#8b5cf6','#ec4899','#f59e0b','#06b6d4','#22c55e','#ef4444','#f97316'];
let itemColors=colors.slice(0,4);
function render(){
const el=document.getElementById('preview');el.innerHTML='';
for(let i=0;i<items;i++){const d=document.createElement('div');d.className='item';d.style.background=itemColors[i%itemColors.length];d.textContent=i+1;el.appendChild(d)}
document.getElementById('itemCount').textContent=items;
}
function changeItems(d){items=Math.max(1,Math.min(12,items+d));while(itemColors.length<items)itemColors.push(colors[itemColors.length%colors.length]);render();update()}
function randomItems(){itemColors=Array.from({length:items},()=>colors[Math.floor(Math.random()*colors.length)]);render()}
function update(){
const s=(id)=>document.getElementById(id).value;
const style={display:s('display'),'flex-direction':s('direction'),'justify-content':s('justify'),'align-items':s('align'),'flex-wrap':s('wrap'),gap:s('gap')};
document.getElementById('preview').style.cssText=Object.entries(style).map(([k,v])=>`${k}:${v}`).join(';');
const css=`.container {\n  display: ${style.display};\n  flex-direction: ${style['flex-direction']};\n  justify-content: ${style['justify-content']};\n  align-items: ${style['align-items']};\n  flex-wrap: ${style['flex-wrap']};\n  gap: ${style.gap}px;\n}`;
document.getElementById('cssOutput').textContent=css;
}
render();update();
</script>
</body>
</html>
