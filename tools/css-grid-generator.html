<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#8b5cf6;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}header h1{font-size:20px;font-weight:500}header a{color:var(--muted);text-decoration:none;font-size:13px}header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:1000px;width:100%;margin:0 auto}
.preview{width:100%;min-height:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;padding:10px;display:grid;gap:8px}
.item{background:var(--accent);color:#fff;border-radius:var(--radius);padding:12px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.control{display:flex;flex-direction:column;gap:4px}
.control label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.control select,.control input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px;font-size:12px;font-family:inherit;outline:none}
.btn-row{display:flex;gap:8px;margin-bottom:16px}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:var(--radius);font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444}
.css-output{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:'SF Mono',monospace;font-size:13px;white-space:pre-wrap;cursor:pointer;transition:border-color .2s;line-height:1.8}
.css-output:hover{border-color:#444}
</style>
</head>
<body>
<header><h1>CSS Grid Generator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="btn-row">
<button class="btn" onclick="changeItems(-1)">- Item</button>
<span style="color:var(--muted);font-size:13px" id="itemCount">6</span>
<button class="btn" onclick="changeItems(1)">+ Item</button>
</div>
<div class="preview" id="preview"></div>
<div class="controls">
<div class="control"><label>Columns</label><select id="cols" onchange="update()"><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></div>
<div class="control"><label>Rows</label><select id="rows" onchange="update()"><option value="auto" selected>auto</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
<div class="control"><label>column-gap</label><select id="cgap" onchange="update()"><option value="0">0</option><option value="8">8px</option><option value="12" selected>12px</option><option value="16">16px</option><option value="24">24px</option></select></div>
<div class="control"><label>row-gap</label><select id="rgap" onchange="update()"><option value="0">0</option><option value="8">8px</option><option value="12" selected>12px</option><option value="16">16px</option><option value="24">24px</option></select></div>
<div class="control"><label>justify-items</label><select id="jitems" onchange="update()"><option value="stretch" selected>stretch</option><option value="start">start</option><option value="end">end</option><option value="center">center</option></select></div>
<div class="control"><label>align-items</label><select id="aitems" onchange="update()"><option value="stretch" selected>stretch</option><option value="start">start</option><option value="end">end</option><option value="center">center</option></select></div>
</div>
<div class="css-output" id="cssOutput" onclick="navigator.clipboard.writeText(this.textContent)"></div>
</div>
<script>
let items=6;const colors=['#8b5cf6','#3b82f6','#ec4899','#22c55e','#f59e0b','#06b6d4','#ef4444','#f97316'];
function render(){
const el=document.getElementById('preview');el.innerHTML='';
for(let i=0;i<items;i++){const d=document.createElement('div');d.className='item';d.style.background=colors[i%colors.length];d.textContent=i+1;el.appendChild(d)}
document.getElementById('itemCount').textContent=items;
}
function changeItems(d){items=Math.max(1,Math.min(24,items+d));render();update()}
function update(){
const cols=document.getElementById('cols').value;
const rows=document.getElementById('rows').value;
const cgap=document.getElementById('cgap').value;
const rgap=document.getElementById('rgap').value;
const jitems=document.getElementById('jitems').value;
const aitems=document.getElementById('aitems').value;
document.getElementById('preview').style.cssText=`grid-template-columns:repeat(${cols},1fr);grid-auto-rows:${rows==='auto'?'minmax(60px,auto)':rows+'px'};column-gap:${cgap}px;row-gap:${rgap}px;justify-items:${jitems};align-items:${aitems}`;
const css=`.grid {\n  display: grid;\n  grid-template-columns: repeat(${cols}, 1fr);\n  grid-auto-rows: ${rows==='auto'?'minmax(60px, auto)':rows+'px'};\n  column-gap: ${cgap}px;\n  row-gap: ${rgap}px;\n  justify-items: ${jitems};\n  align-items: ${aitems};\n}`;
document.getElementById('cssOutput').textContent=css;
}
render();update();
</script>
</body>
</html>
