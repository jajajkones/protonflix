<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Pattern Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #222}
.header h1{font-size:1.5rem;font-weight:600}
.header a{color:#737373;text-decoration:none;font-size:.9rem;transition:color .2s}
.header a:hover{color:#fff}
.main{max-width:900px;margin:0 auto}
.section{background:#111;border:1px solid #222;border-radius:10px;padding:20px;margin-bottom:20px}
.section-title{font-size:.85rem;font-weight:500;color:#737373;text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.preset{background:#222;border:1px solid #333;color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;transition:all .2s}
.preset:hover{background:#333;border-color:#444}
.preset.active{background:#3b82f6;border-color:#3b82f6}
.segments{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.segment{display:flex;gap:10px;align-items:center;background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:12px}
.segment select,.segment input{background:#111;border:1px solid #222;border-radius:6px;padding:8px 12px;color:#fff;font-family:'Outfit',sans-serif;font-size:.9rem;outline:none}
.segment select:focus,.segment input:focus{border-color:#444}
.segment select{min-width:140px}
.segment input[type=number]{width:80px}
.remove-seg{background:none;border:none;color:#ef4444;cursor:pointer;font-size:1.2rem;padding:4px 8px;transition:color .2s}
.remove-seg:hover{color:#f87171}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.btn{background:#222;border:1px solid #333;color:#fff;padding:10px 18px;border-radius:8px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.9rem;transition:all .2s}
.btn:hover{background:#333}
.btn.primary{background:#3b82f6;border-color:#3b82f6}
.btn.primary:hover{background:#2563eb}
.btn.copied{background:#166534;border-color:#22c55e}
.count-group{display:flex;align-items:center;gap:8px}
.count-group label{font-size:.85rem;color:#737373}
.count-group input{background:#111;border:1px solid #222;border-radius:6px;padding:8px 12px;color:#fff;font-family:'Outfit',sans-serif;font-size:.9rem;width:80px;outline:none}
.output-area{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:16px;max-height:400px;overflow:auto;font-family:monospace;font-size:.9rem;line-height:1.8}
.output-area::-webkit-scrollbar{width:6px}
.output-area::-webkit-scrollbar-track{background:transparent}
.output-area::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.password-line{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1a1a1a}
.password-line:last-child{border-bottom:none}
.pw-text{color:#4ade80;word-break:break-all}
.toast{position:fixed;bottom:20px;right:20px;background:#222;border:1px solid #333;color:#fff;padding:12px 20px;border-radius:8px;font-size:.9rem;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateY(0)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media(max-width:768px){.main{padding:0}.segment{flex-wrap:wrap}.controls{flex-direction:column;align-items:stretch}.presets{flex-direction:column}.count-group{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="header">
<h1>Password Pattern Generator</h1>
<a href="index.html">← Back to Tools</a>
</div>
<div class="main">
<div class="section">
<div class="section-title">Preset Patterns</div>
<div class="presets">
<div class="preset" onclick="applyPreset('standard')">Standard (Upper2-Lower3-Num2-Sym1)</div>
<div class="preset" onclick="applyPreset('pin')">PIN (Digit4)</div>
<div class="preset" onclick="applyPreset('strong')">Strong (Upper2-Lower4-Num3-Sym2)</div>
<div class="preset" onclick="applyPreset('pronounceable')">Pronounceable (Upper1-Lower2-Upper2-Lower2)</div>
<div class="preset" onclick="applyPreset('hex')">Hex Color (#Upper6)</div>
<div class="preset" onclick="applyPreset('alphanumeric')">Alphanumeric (Upper3-Lower3-Num4)</div>
</div>
</div>
<div class="section">
<div class="section-title">Pattern Segments</div>
<div class="segments" id="segments"></div>
<button class="btn" onclick="addSegment()">+ Add Segment</button>
</div>
<div class="section">
<div class="controls">
<div class="count-group">
<label for="count">Count:</label>
<input type="number" id="count" value="10" min="1" max="100">
</div>
<button class="btn primary" onclick="generate()">Generate</button>
<button class="btn" onclick="copyAll()">Copy All</button>
</div>
<div class="output-area" id="output">Click Generate to create passwords...</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const CHARS={
uppercase:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
lowercase:'abcdefghijklmnopqrstuvwxyz',
digit:'0123456789',
symbol:'!@#$%^&*()_+-=[]{}|;:,.<>?',
hex:'0123456789ABCDEF',
octal:'01234567',
binary:'01'
};
const PRESETS={
standard:[{type:'uppercase',count:2},{type:'lowercase',count:3},{type:'digit',count:2},{type:'symbol',count:1}],
pin:[{type:'digit',count:4}],
strong:[{type:'uppercase',count:2},{type:'lowercase',count:4},{type:'digit',count:3},{type:'symbol',count:2}],
pronounceable:[{type:'uppercase',count:1},{type:'lowercase',count:2},{type:'uppercase',count:2},{type:'lowercase',count:2}],
hex:[{type:'hex',count:6}],
alphanumeric:[{type:'uppercase',count:3},{type:'lowercase',count:3},{type:'digit',count:4}]
};
let segments=[];

function init(){
segments=[{type:'uppercase',count:2},{type:'lowercase',count:3},{type:'digit',count:2},{type:'symbol',count:1}];
renderSegments();
}

function renderSegments(){
const el=document.getElementById('segments');
el.innerHTML=segments.map((s,i)=>`
<div class="segment">
<select onchange="segments[${i}].type=this.value">
<option value="uppercase" ${s.type==='uppercase'?'selected':''}>Uppercase (A-Z)</option>
<option value="lowercase" ${s.type==='lowercase'?'selected':''}>Lowercase (a-z)</option>
<option value="digit" ${s.type==='digit'?'selected':''}>Digit (0-9)</option>
<option value="symbol" ${s.type==='symbol'?'selected':''}>Symbol (!@#...)</option>
<option value="hex" ${s.type==='hex'?'selected':''}>Hex (0-9A-F)</option>
<option value="octal" ${s.type==='octal'?'selected':''}>Octal (0-7)</option>
<option value="binary" ${s.type==='binary'?'selected':''}>Binary (0-1)</option>
</select>
<input type="number" value="${s.count}" min="1" max="20" onchange="segments[${i}].count=parseInt(this.value)">
<button class="remove-seg" onclick="removeSegment(${i})">✕</button>
</div>
`).join('');
}

function addSegment(){segments.push({type:'lowercase',count:2});renderSegments()}
function removeSegment(i){segments.splice(i,1);renderSegments()}

function applyPreset(name){segments=[...PRESETS[name]].map(s=>({...s}));renderSegments()}

function generate(){
const count=parseInt(document.getElementById('count').value)||10;
let passwords=[];
for(let p=0;p<count;p++){
let pw='';
segments.forEach(seg=>{
const chars=CHARS[seg.type]||CHARS.lowercase;
for(let i=0;i<seg.count;i++) pw+=chars[Math.floor(Math.random()*chars.length)];
});
passwords.push(pw);
}
const el=document.getElementById('output');
el.innerHTML=passwords.map((pw,i)=>`<div class="password-line"><span style="color:#737373">${String(i+1).padStart(3,'0')}.</span> <span class="pw-text">${esc(pw)}</span></div>`).join('');
}

function copyAll(){
const text=document.getElementById('output').innerText;
navigator.clipboard.writeText(text);
showToast('All passwords copied!');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function showToast(msg){
const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2000);
}

init();
</script>
</body>
</html>
