<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Blend Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
a{color:#fff;text-decoration:none}
.header{background:#111;border-bottom:1px solid #222;padding:16px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:1.2rem;font-weight:600}
.back{padding:6px 12px;border:1px solid #222;border-radius:6px;font-size:.85rem;transition:.2s}
.back:hover{background:#222}
.container{max-width:900px;margin:24px auto;padding:0 20px}
.panel{background:#111;border:1px solid #222;border-radius:10px;padding:20px;margin-bottom:24px}
.panel h2{font-size:1rem;font-weight:500;margin-bottom:16px;color:#737373}
.pickers{display:flex;gap:20px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.picker-group{display:flex;flex-direction:column;align-items:center;gap:6px}
.picker-group label{font-size:.8rem;color:#737373}
input[type="color"]{width:60px;height:60px;border:2px solid #222;border-radius:8px;cursor:pointer;background:none;padding:2px}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
input[type="color"]::-webkit-color-swatch{border:none;border-radius:4px}
.modes{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.mode-btn{padding:6px 12px;background:#0a0a0a;border:1px solid #222;border-radius:6px;color:#fff;cursor:pointer;font-family:inherit;font-size:.8rem;transition:.2s}
.mode-btn.active{background:#fff;color:#0a0a0a;border-color:#fff}
.blend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:20px}
.blend-swatch{text-align:center;border-radius:8px;overflow:hidden;border:1px solid #222}
.blend-color{height:60px}
.blend-label{font-size:.7rem;padding:4px;background:#111}
.gradient-bar{height:40px;border-radius:8px;border:1px solid #222;margin-bottom:16px}
.code-box{position:relative}
.code-box pre{background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:14px;font-size:.75rem;overflow-x:auto;line-height:1.6}
.copy-btn{position:absolute;top:8px;right:8px;padding:5px 10px;background:#222;border:1px solid #333;border-radius:4px;color:#fff;font-size:.7rem;cursor:pointer;font-family:inherit}
.copy-btn:hover{background:#333}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back">← Back</a>
<h1>Color Blend Tool</h1>
</div>
<div class="container">
<div class="panel">
<div class="pickers">
<div class="picker-group"><label>Color A</label><input type="color" id="c1" value="#7c3aed" oninput="update()"></div>
<div class="picker-group" style="font-size:1.5rem;color:#737373">+</div>
<div class="picker-group"><label>Color B</label><input type="color" id="c2" value="#f59e0b" oninput="update()"></div>
</div>
<div class="modes" id="modes">
<button class="mode-btn active" onclick="setMode('normal',this)">Normal</button>
<button class="mode-btn" onclick="setMode('multiply',this)">Multiply</button>
<button class="mode-btn" onclick="setMode('screen',this)">Screen</button>
<button class="mode-btn" onclick="setMode('overlay',this)">Overlay</button>
</div>
<div class="gradient-bar" id="gradientBar"></div>
<div class="blend-grid" id="blendGrid"></div>
</div>
<div class="panel">
<h2>CSS Output</h2>
<div class="code-box">
<button class="copy-btn" onclick="copyCode()">Copy</button>
<pre id="code"></pre>
</div>
</div>
</div>
<script>
let currentMode='normal';
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return[r,g,b]}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('')}
function blend(a,b,t,mode){
const[ar,ag,ab]=hexToRgb(a),[br,bg,bb]=hexToRgb(b);
const r=ar+(br-ar)*t,g=ag+(bg-ag)*t,b2=ab+(bb-ab)*t;
if(mode==='normal')return rgbToHex(r,g,b2);
const mix=(x,y)=>x*y/255;
if(mode==='multiply')return rgbToHex(ar+(br-ar)*t*mix(1,1),ag+(bg-ag)*t*mix(1,1),ab+(bb-ab)*t*mix(1,1));
if(mode==='screen')return rgbToHex(ar+(255-(255-ar)*(255-br)/255-ar)*t,ag+(255-(255-ag)*(255-bg)/255-ag)*t,ab+(255-(255-ab)*(255-bb)/255-ab)*t);
if(mode==='overlay'){
const f=(x,y)=>x<128?2*x*y/255:255-2*(255-x)*(255-y)/255;
return rgbToHex(ar+(f(ar,br)-ar)*t,ag+(f(ag,bg)-ag)*t,ab+(f(ab,bb)-ab)*t);
}
return rgbToHex(r,g,b2);
}
function setMode(m,el){
currentMode=m;
document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');
update();
}
function update(){
const c1=document.getElementById('c1').value,c2=document.getElementById('c2').value;
const grid=document.getElementById('blendGrid');
let html='';
for(let i=0;i<=10;i++){
const t=i/10;const color=blend(c1,c2,t,currentMode);
html+=`<div class="blend-swatch"><div class="blend-color" style="background:${color}"></div><div class="blend-label">${Math.round(t*100)}%<br>${color}</div></div>`;
}
grid.innerHTML=html;
document.getElementById('gradientBar').style.background=`linear-gradient(to right,${c1},${c2})`;
document.getElementById('code').textContent=`/* Blend: ${currentMode} */\nlinear-gradient(to right, ${c1}, ${c2});\n\n/* Individual colors */\n${Array.from({length:11},(_,i)=>{const t=i/10;return `/* ${Math.round(t*100)}% */ ${blend(c1,c2,t,currentMode)}`;}).join('\n')}`;
}
function copyCode(){
navigator.clipboard.writeText(document.getElementById('code').textContent);
const b=document.querySelector('.copy-btn');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500);
}
update();
</script>
</body>
</html>
