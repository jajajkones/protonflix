<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Diff Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#22c55e;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.toolbar{padding:16px 40px;display:flex;gap:12px;border-bottom:1px solid var(--border)}
.btn{background:var(--accent);color:#000;border:none;padding:8px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-outline{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:#444}
.container{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0}
.pane{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.pane:last-child{border-right:none}
.pane-header{padding:12px 20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
textarea{flex:1;background:var(--bg);color:var(--text);border:none;padding:20px;font-family:var(--mono);font-size:13px;line-height:1.6;resize:none;outline:none}
.diff-output{flex:1;padding:20px;font-family:var(--mono);font-size:13px;line-height:1.8;overflow:auto;white-space:pre-wrap}
.diff-add{background:rgba(34,197,94,0.15);color:#22c55e}
.diff-remove{background:rgba(239,68,68,0.15);color:#ef4444}
.diff-same{color:var(--muted)}
.stats{padding:10px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;gap:20px}
.stats .add{color:#22c55e}
.stats .remove{color:#ef4444}
@media(max-width:768px){.container{grid-template-columns:1fr}.pane{min-height:35vh}.pane:last-child{border-top:1px solid var(--border)}}
.copy-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:8px 16px;border-radius:var(--radius);font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:101}
.copy-toast.show{opacity:1}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<header><h1>Text Diff Checker</h1><a href="index.html">← Back to Tools</a></header>
<div class="toolbar">
<button class="btn" onclick="compare()">Compare</button>
<button class="btn-outline" onclick="swap()">Swap</button>
<button class="btn-outline" onclick="clearAll()">Clear</button>
<button class="btn-outline" onclick="copyDiff()">Copy</button>
</div>
<div class="container">
<div class="pane">
<div class="pane-header">Original</div>
<label class="sr-only" for="left">Original text</label>
<textarea id="left" placeholder="Paste original text..."></textarea>
</div>
<div class="pane">
<div class="pane-header">Modified</div>
<label class="sr-only" for="right">Modified text</label>
<textarea id="right" placeholder="Paste modified text..."></textarea>
</div>
</div>
<div class="diff-output" id="diffOutput" style="border-top:1px solid var(--border)"></div>
<div class="stats" id="stats"></div>
<div class="copy-toast" id="copyToast">Copied!</div>
<script>
function compare(){
const a=document.getElementById('left').value.split('\n');
const b=document.getElementById('right').value.split('\n');
const dp=Array(a.length+1).fill(null).map(()=>Array(b.length+1).fill(0));
for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){
dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
}
const lcs=[];
let i=a.length,j=b.length;
while(i>0&&j>0){
if(a[i-1]===b[j-1]){lcs.unshift({type:'same',text:a[i-1]});i--;j--}
else if(dp[i-1][j]>dp[i][j-1]){lcs.unshift({type:'remove',text:a[i-1]});i--}
else{lcs.unshift({type:'add',text:b[j-1]});j--}
}
while(i>0){lcs.unshift({type:'remove',text:a[i-1]});i--}
while(j>0){lcs.unshift({type:'add',text:b[j-1]});j--}
let html='';let adds=0,removes=0;
lcs.forEach(d=>{
if(d.type==='add'){html+=`<div class="diff-add">+ ${esc(d.text)}</div>`;adds++}
else if(d.type==='remove'){html+=`<div class="diff-remove">- ${esc(d.text)}</div>`;removes++}
else{html+=`<div class="diff-same">  ${esc(d.text)}</div>`}
});
document.getElementById('diffOutput').innerHTML=html||'<div style="color:var(--muted);padding:20px;text-align:center">No differences found</div>';
document.getElementById('stats').innerHTML=`<span class="add">+${adds} added</span><span class="remove">-${removes} removed</span><span>${lcs.length} total lines</span>`;
}
function swap(){const l=document.getElementById('left'),r=document.getElementById('right');[l.value,r.value]=[r.value,l.value]}
function clearAll(){document.getElementById('left').value='';document.getElementById('right').value='';document.getElementById('diffOutput').innerHTML='';document.getElementById('stats').innerHTML=''}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function copyDiff(){navigator.clipboard.writeText(document.getElementById('diffOutput').textContent);const t=document.getElementById('copyToast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
</script>
</body>
</html>
