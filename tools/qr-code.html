<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#a855f7;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:700px;width:100%;margin:0 auto;display:flex;flex-direction:column;align-items:center}
textarea{width:100%;height:120px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-size:14px;line-height:1.6;resize:vertical;outline:none}
textarea:focus{border-color:#444}
.settings{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.setting{display:flex;flex-direction:column;gap:6px}
.setting label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.setting select,.setting input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:13px;font-family:inherit;outline:none}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 24px;border-radius:var(--radius);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;width:100%;margin-top:20px;transition:opacity .2s}
.btn:hover{opacity:.8}
.qr-container{margin-top:30px;background:#fff;padding:20px;border-radius:12px;display:inline-block}
#qr canvas,#qr img{display:block}
.actions{display:flex;gap:12px;margin-top:20px}
.actions button{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.actions button:hover{border-color:#444}
</style>
</head>
<body>
<header><h1>QR Code Generator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<textarea id="input" placeholder="Enter text, URL, or anything..." oninput="generate()">https://github.com</textarea>
<div class="settings">
<div class="setting"><label>Size</label><select id="size" onchange="generate()"><option value="128">128x128</option><option value="256" selected>256x256</option><option value="512">512x512</option><option value="1024">1024x1024</option></select></div>
<div class="setting"><label>Error Correction</label><select id="ec" onchange="generate()"><option value="L">Low (7%)</option><option value="M" selected>Medium (15%)</option><option value="Q">Quartile (25%)</option><option value="H">High (30%)</option></select></div>
<div class="setting"><label>Dark Color</label><input type="color" id="darkColor" value="#000000" onchange="generate()"></div>
<div class="setting"><label>Light Color</label><input type="color" id="lightColor" value="#ffffff" onchange="generate()"></div>
</div>
<button class="btn" onclick="generate()">Generate QR Code</button>
<div class="qr-container"><div id="qr"></div></div>
<div class="actions">
<button onclick="downloadPNG()">Download PNG</button>
<button onclick="downloadSVG()">Download SVG</button>
<button onclick="copyQR()">Copy Image</button>
</div>
</div>
<script>
let qr=null;
function generate(){
const text=document.getElementById('input').value;
const size=+document.getElementById('size').value;
const ec={L:1,M:0,Q:3,H:2}[document.getElementById('ec').value];
const dark=document.getElementById('darkColor').value;
const light=document.getElementById('lightColor').value;
const el=document.getElementById('qr');
el.innerHTML='';
if(!text)return;
qr=new QRCode(el,{text,width:size,height:size,colorDark:dark,colorLight:light,correctLevel:ec});
}
function downloadPNG(){const canvas=document.querySelector('#qr canvas');if(!canvas)return;const a=document.createElement('a');a.download='qr-code.png';a.href=canvas.toDataURL('image/png');a.click()}
function downloadSVG(){const img=document.querySelector('#qr img');if(!img)return;const a=document.createElement('a');a.download='qr-code.svg';a.href=img.src;a.click()}
function copyQR(){const canvas=document.querySelector('#qr canvas');if(canvas)canvas.toBlob(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})]))}
generate();
</script>
</body>
</html>
