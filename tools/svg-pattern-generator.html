<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVG Pattern Generator | ProtonFlix</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh}
a{color:#6cf;text-decoration:none}a:hover{text-decoration:underline}
.header{background:#111;border-bottom:1px solid #222;padding:16px 32px;display:flex;align-items:center;gap:16px}
.header h1{font-size:1.2rem;font-weight:600}
.container{max-width:1200px;margin:0 auto;padding:24px}
.tools-grid{display:grid;grid-template-columns:350px 1fr;gap:20px}
@media(max-width:900px){.tools-grid{grid-template-columns:1fr}}
.panel{background:#111;border:1px solid #222;border-radius:12px;padding:20px}
.panel h2{font-size:1rem;font-weight:500;margin-bottom:12px;color:#aaa}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#888;font-weight:500;margin-bottom:6px}
.form-group input,.form-group select{width:100%;background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:10px 14px;color:#e0e0e0;font-family:'Outfit',sans-serif;font-size:14px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#6cf}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
input[type="color"]{width:100%;height:40px;padding:4px;cursor:pointer}
input[type="range"]{width:100%;accent-color:#6cf}
.controls{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
button{background:#6cf;color:#0a0a0a;border:none;padding:10px 20px;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:500;font-size:14px;cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
button.secondary{background:#222;color:#e0e0e0}
.pattern-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pattern-type{padding:10px;background:#1a1a1a;border:2px solid #222;border-radius:8px;cursor:pointer;text-align:center;font-size:13px;color:#aaa;transition:all .2s}
.pattern-type:hover{border-color:#444}
.pattern-type.active{border-color:#6cf;color:#6cf;background:#1a1a2a}
.pattern-type svg{display:block;margin:0 auto 6px;width:36px;height:36px}
.preview-box{width:100%;height:400px;border-radius:12px;border:1px solid #222;overflow:hidden;position:relative}
.preview-box .pattern-bg{width:100%;height:100%}
.output-section{margin-top:20px}
.output-section h3{font-size:14px;color:#888;margin-bottom:8px}
.output-box{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:14px;min-height:80px;font-family:'Fira Code',monospace;font-size:12px;color:#6cf;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.toast{position:fixed;bottom:24px;right:24px;background:#6cf;color:#0a0a0a;padding:12px 24px;border-radius:8px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.size-preview{font-size:12px;color:#666;margin-top:4px}
</style>
</head>
<body>
<div class="header">
  <a href="index.html">&larr; Back</a>
  <h1>SVG Pattern Generator</h1>
</div>
<div class="container">
  <div class="tools-grid">
    <div>
      <div class="panel">
        <h2>Pattern Type</h2>
        <div class="pattern-types" id="patternTypes"></div>
      </div>
      <div class="panel" style="margin-top:16px">
        <h2>Customize</h2>
        <div class="form-group">
          <label>Pattern Size</label>
          <input type="range" id="patternSize" min="10" max="100" value="20" oninput="updatePreview()">
          <div class="size-preview" id="sizeLabel">20px</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Primary Color</label>
            <input type="color" id="color1" value="#ffffff" oninput="updatePreview()">
          </div>
          <div class="form-group">
            <label>Secondary Color</label>
            <input type="color" id="color2" value="#333333" oninput="updatePreview()">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Rotation (deg)</label>
            <input type="range" id="rotation" min="0" max="360" value="0" oninput="updatePreview()">
            <div class="size-preview" id="rotationLabel">0deg</div>
          </div>
          <div class="form-group">
            <label>Opacity</label>
            <input type="range" id="opacity" min="0" max="100" value="100" oninput="updatePreview()">
            <div class="size-preview" id="opacityLabel">100%</div>
          </div>
        </div>
        <div class="form-group">
          <label>Stroke Width</label>
          <input type="range" id="strokeWidth" min="0" max="5" value="1" step="0.5" oninput="updatePreview()">
          <div class="size-preview" id="strokeLabel">1px</div>
        </div>
        <div class="form-group">
          <label>Gap / Spacing</label>
          <input type="range" id="gap" min="0" max="30" value="0" oninput="updatePreview()">
          <div class="size-preview" id="gapLabel">0px</div>
        </div>
      </div>
      <div class="panel" style="margin-top:16px">
        <h2>Export</h2>
        <div class="controls">
          <button onclick="copySvgCode()">Copy SVG Code</button>
          <button class="secondary" onclick="copyCssCode()">Copy CSS</button>
          <button class="secondary" onclick="downloadSvg()">Download SVG</button>
        </div>
        <div class="output-section">
          <h3>SVG Code</h3>
          <div class="output-box" id="svgOutput"></div>
        </div>
        <div class="output-section" style="margin-top:12px">
          <h3>CSS Background</h3>
          <div class="output-box" id="cssOutput"></div>
        </div>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>Live Preview</h2>
        <div class="preview-box" id="preview"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const patterns=[
  {id:'dots',name:'Dots',icon:'<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="4" fill="#888"/></svg>'},
  {id:'stripes',name:'Stripes',icon:'<svg viewBox="0 0 36 36"><line x1="6" y1="0" x2="6" y2="36" stroke="#888" stroke-width="3"/><line x1="18" y1="0" x2="18" y2="36" stroke="#888" stroke-width="3"/><line x1="30" y1="0" x2="30" y2="36" stroke="#888" stroke-width="3"/></svg>'},
  {id:'diagonal',name:'Diagonal',icon:'<svg viewBox="0 0 36 36"><line x1="0" y1="36" x2="36" y2="0" stroke="#888" stroke-width="2"/></svg>'},
  {id:'checks',name:'Checks',icon:'<svg viewBox="0 0 36 36"><rect x="0" y="0" width="18" height="18" fill="#888"/><rect x="18" y="18" width="18" height="18" fill="#888"/></svg>'},
  {id:'triangles',name:'Triangles',icon:'<svg viewBox="0 0 36 36"><polygon points="18,4 32,32 4,32" fill="none" stroke="#888" stroke-width="2"/></svg>'},
  {id:'waves',name:'Waves',icon:'<svg viewBox="0 0 36 36"><path d="M0,18 Q9,8 18,18 Q27,28 36,18" fill="none" stroke="#888" stroke-width="2"/></svg>'},
  {id:'hexagons',name:'Hexagons',icon:'<svg viewBox="0 0 36 36"><polygon points="18,4 30,11 30,25 18,32 6,25 6,11" fill="none" stroke="#888" stroke-width="2"/></svg>'},
  {id:'crosshatch',name:'Cross-hatch',icon:'<svg viewBox="0 0 36 36"><line x1="0" y1="0" x2="36" y2="36" stroke="#888" stroke-width="2"/><line x1="36" y1="0" x2="0" y2="36" stroke="#888" stroke-width="2"/></svg>'},
  {id:'zigzag',name:'Zigzag',icon:'<svg viewBox="0 0 36 36"><polyline points="0,28 9,8 18,28 27,8 36,28" fill="none" stroke="#888" stroke-width="2"/></svg>'},
  {id:'circles',name:'Circles',icon:'<svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="12" fill="none" stroke="#888" stroke-width="2"/></svg>'},
  {id:'diamonds',name:'Diamonds',icon:'<svg viewBox="0 0 36 36"><polygon points="18,2 34,18 18,34 2,18" fill="none" stroke="#888" stroke-width="2"/></svg>'},
  {id:'grid',name:'Grid',icon:'<svg viewBox="0 0 36 36"><line x1="12" y1="0" x2="12" y2="36" stroke="#888" stroke-width="1.5"/><line x1="24" y1="0" x2="24" y2="36" stroke="#888" stroke-width="1.5"/><line x1="0" y1="12" x2="36" y2="12" stroke="#888" stroke-width="1.5"/><line x1="0" y1="24" x2="36" y2="24" stroke="#888" stroke-width="1.5"/></svg>'}
];
let selectedPattern='dots';
function initPatternTypes(){
  const container=document.getElementById('patternTypes');
  container.innerHTML=patterns.map(p=>`
    <div class="pattern-type ${p.id===selectedPattern?'active':''}" onclick="selectPattern('${p.id}')">
      ${p.icon}
      <div>${p.name}</div>
    </div>
  `).join('');
}
function selectPattern(id){
  selectedPattern=id;
  document.querySelectorAll('.pattern-type').forEach(el=>el.classList.remove('active'));
  event.target.closest('.pattern-type').classList.add('active');
  updatePreview();
}
function getValues(){
  return{
    size:parseInt(document.getElementById('patternSize').value),
    color1:document.getElementById('color1').value,
    color2:document.getElementById('color2').value,
    rotation:parseInt(document.getElementById('rotation').value),
    opacity:parseInt(document.getElementById('opacity').value)/100,
    strokeWidth:parseFloat(document.getElementById('strokeWidth').value),
    gap:parseInt(document.getElementById('gap').value)
  };
}
function generatePatternDef(id,v){
  const s=v.size;
  const g=v.gap;
  switch(id){
    case'dots':return`<circle cx="${s/2}" cy="${s/2}" r="${s/5}" fill="${v.color1}" opacity="${v.opacity}"/>`;
    case'stripes':return`<line x1="${s/2}" y1="0" x2="${s/2}" y2="${s}" stroke="${v.color1}" stroke-width="${Math.max(1,s/4)}" opacity="${v.opacity}"/>`;
    case'diagonal':return`<line x1="0" y1="${s}" x2="${s}" y2="0" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`;
    case'checks':return`<rect x="0" y="0" width="${s/2}" height="${s/2}" fill="${v.color1}" opacity="${v.opacity}"/><rect x="${s/2}" y="${s/2}" width="${s/2}" height="${s/2}" fill="${v.color1}" opacity="${v.opacity}"/>`;
    case'triangles':return`<polygon points="${s/2},${s*0.15} ${s*0.85},${s*0.85} ${s*0.15},${s*0.85}" fill="none" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`;
    case'waves':return`<path d="M0,${s/2} Q${s/4},${s*0.2} ${s/2},${s/2} Q${s*3/4},${s*0.8} ${s},${s/2}" fill="none" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`;
    case'hexagons':{const cx=s/2,cy=s/2,r=s*0.4;const pts=[];for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;pts.push(`${cx+r*Math.cos(a)},${cy+r*Math.sin(a)}`);}return`<polygon points="${pts.join(' ')}" fill="none" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`}
    case'crosshatch':return`<line x1="0" y1="0" x2="${s}" y2="${s}" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/><line x1="${s}" y1="0" x2="0" y2="${s}" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`;
    case'zigzag':{const step=s/4;let pts=[];for(let i=0;i<=4;i++){pts.push(`${i*step},${i%2===0?s*0.8:s*0.2}`);}return`<polyline points="${pts.join(' ')}" fill="none" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`}
    case'circles':return`<circle cx="${s/2}" cy="${s/2}" r="${s*0.4}" fill="none" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`;
    case'diamonds':return`<polygon points="${s/2},${s*0.1} ${s*0.9},${s/2} ${s/2},${s*0.9} ${s*0.1},${s/2}" fill="none" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`;
    case'grid':return`<line x1="${s/3}" y1="0" x2="${s/3}" y2="${s}" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/><line x1="${s*2/3}" y1="0" x2="${s*2/3}" y2="${s}" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/><line x1="0" y1="${s/3}" x2="${s}" y2="${s/3}" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/><line x1="0" y1="${s*2/3}" x2="${s}" y2="${s*2/3}" stroke="${v.color1}" stroke-width="${v.strokeWidth}" opacity="${v.opacity}"/>`;
    default:return'';
  }
}
function buildSvg(){
  const v=getValues();
  const patSize=v.size+v.gap;
  const content=generatePatternDef(selectedPattern,v);
  const transform=v.rotation?` transform="rotate(${v.rotation} ${patSize/2} ${patSize/2})"`:'';
  return`<svg xmlns="http://www.w3.org/2000/svg" width="${patSize}" height="${patSize}"><defs><pattern id="pattern" x="0" y="0" width="${patSize}" height="${patSize}" patternUnits="userSpaceOnUse"${transform}>${content}</pattern></defs><rect width="100%" height="100%" fill="${v.color2}"/><rect width="100%" height="100%" fill="url(#pattern)"/></svg>`;
}
function buildDataUri(){
  const v=getValues();
  const patSize=v.size+v.gap;
  const content=generatePatternDef(selectedPattern,v);
  const transform=v.rotation?` transform="rotate(${v.rotation} ${patSize/2} ${patSize/2})"`:'';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${patSize}" height="${patSize}"><defs><pattern id="p" x="0" y="0" width="${patSize}" height="${patSize}" patternUnits="userSpaceOnUse"${transform}>${content}</pattern></defs><rect width="100%" height="100%" fill="${v.color2}"/><rect width="100%" height="100%" fill="url(#p)"/></svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
function updatePreview(){
  const v=getValues();
  document.getElementById('sizeLabel').textContent=v.size+'px';
  document.getElementById('rotationLabel').textContent=v.rotation+'deg';
  document.getElementById('opacityLabel').textContent=Math.round(v.opacity*100)+'%';
  document.getElementById('strokeLabel').textContent=v.strokeWidth+'px';
  document.getElementById('gapLabel').textContent=v.gap+'px';
  const dataUri=buildDataUri();
  document.getElementById('preview').innerHTML=`<div class="pattern-bg" style="background-image:url('${dataUri}');background-repeat:repeat"></div>`;
  document.getElementById('svgOutput').textContent=buildSvg();
  const css=`background-image: url("${dataUri}");\nbackground-repeat: repeat;\nbackground-size: ${v.size+v.gap}px ${v.size+v.gap}px;`;
  document.getElementById('cssOutput').textContent=css;
}
function copySvgCode(){
  const code=document.getElementById('svgOutput').textContent;
  navigator.clipboard.writeText(code).then(()=>showToast('SVG code copied!'));
}
function copyCssCode(){
  const code=document.getElementById('cssOutput').textContent;
  navigator.clipboard.writeText(code).then(()=>showToast('CSS code copied!'));
}
function downloadSvg(){
  const code=document.getElementById('svgOutput').textContent;
  const blob=new Blob([code],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='pattern.svg';a.click();
  URL.revokeObjectURL(url);
  showToast('Downloaded pattern.svg');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
initPatternTypes();
updatePreview();
</script>
</body>
</html>
