*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;padding:20px}
.header{max-width:800px;margin:0 auto 20px;display:flex;align-items:center;gap:15px}
.header a{color:#60a5fa;text-decoration:none;font-size:14px;font-weight:500;transition:color .2s}
.header a:hover{color:#93c5fd}
.header h1{font-size:22px;font-weight:600;color:#fff}
.container{max-width:800px;margin:0 auto}
.panel{background:#111;border:1px solid #222;border-radius:12px;padding:20px;margin-bottom:20px}
.panel h2{font-size:16px;font-weight:600;margin-bottom:15px;color:#fff}
label{display:block;font-size:13px;color:#999;margin-bottom:5px;font-weight:500}

input:focus,select:focus{border-color:#60a5fa}
.btn{padding:8px 16px;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:500;font-size:13px;cursor:pointer;transition:all .2s}
.btn-primary{background:#60a5fa;color:#000}.btn-primary:hover{background:#93c5fd}
.btn-secondary{background:#333;color:#fff}.btn-secondary:hover{background:#444}
.btn-success{background:#22c55e;color:#000}.btn-success:hover{background:#4ade80}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.result-card{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:15px;margin-bottom:10px}
.result-card h3{font-size:13px;color:#999;margin-bottom:8px;font-weight:500}
.result-card .value{font-size:22px;font-weight:600;color:#fff}
.result-card .sub{font-size:13px;color:#666;margin-top:6px}
.mac-display{font-family:'Fira Code',monospace;font-size:32px;font-weight:600;text-align:center;padding:20px;color:#60a5fa;letter-spacing:2px}
.valid-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.valid-true{background:#22c55e20;color:#22c55e}.valid-false{background:#ef444420;color:#ef4444}
.format-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.format-item{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center}
.format-item .label{font-size:12px;color:#999}.format-item .val{font-family:'Fira Code',monospace;font-size:13px;color:#60a5fa}
.search-input{position:relative}
.search-input input{padding-right:100px}
.form-group{margin-bottom:12px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
</style>

function normalizeMAC(mac) {
  let cleaned = mac.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
  if (cleaned.length !== 12) return null;
  return cleaned;
}

function formatMAC(normalized, format) {
  const hex = normalized;
  switch (format) {
    case 'colon': return hex.match(/.{2}/g).join(':');
    case 'dash': return hex.match(/.{2}/g).join('-');
    case 'dot': return hex.match(/.{4}/g).join('.');
    case 'none': return hex;
    case 'upper': return hex.match(/.{2}/g).join(':').toUpperCase();
    case 'lower': return hex.match(/.{2}/g).join(':').toLowerCase();
    case 'cisco': return hex.match(/.{4}/g).join('.');
    case 'microsoft': return hex.match(/.{2}/g).join('-').toUpperCase();
    default: return hex.match(/.{2}/g).join(':');
  }
}

function validateMAC(normalized) {
  if (!normalized || normalized.length !== 12) return false;
  if (!/^[0-9A-F]{12}$/.test(normalized)) return false;
  const firstByte = parseInt(normalized.substring(0, 2), 16);
  const isMulticast = (firstByte & 0x01) === 1;
  const isUnicast = !isMulticast;
  const isLocal = (firstByte & 0x02) === 0x02;
  return { valid: true, isMulticast, isUnicast, isLocal };
}

function lookupMAC() {
  const input = document.getElementById('macInput').value.trim();
  if (!input) return;

  const normalized = normalizeMAC(input);
  if (!normalized) {
    document.getElementById('resultsContent').innerHTML = `
      <div class="result-card"><div class="value" style="color:#ef4444">Invalid MAC Address</div><div class="sub">Please enter a valid 12-character hexadecimal MAC address.</div></div>`;
    document.getElementById('resultsPanel').style.display = 'block';
    return;
  }

  const validation = validateMAC(normalized);
  const oui = normalized.substring(0, 6);
  const ouiFormatted = oui.match(/.{2}/g).join(':').toUpperCase();
  const vendor = ouiDB[ouiFormatted] || 'Unknown Vendor';

  const display = formatMAC(normalized, 'colon');

  const formats = [
    { label: 'Colon (XX:XX:XX:XX:XX:XX)', value: formatMAC(normalized, 'colon') },
    { label: 'Dash (XX-XX-XX-XX-XX-XX)', value: formatMAC(normalized, 'dash') },
    { label: 'Dot (XXXX.XXXX.XXXX)', value: formatMAC(normalized, 'dot') },
    { label: 'No Separator', value: formatMAC(normalized, 'none') },
    { label: 'Upper Case', value: formatMAC(normalized, 'upper') },
    { label: 'Lower Case', value: formatMAC(normalized, 'lower') },
    { label: 'Cisco Format', value: formatMAC(normalized, 'cisco') },
    { label: 'Microsoft Format', value: formatMAC(normalized, 'microsoft') }
  ];

  lastResult = JSON.stringify({
    mac: display,
    normalized,
    vendor,
    oui: ouiFormatted,
    validation
  }, null, 2);

  document.getElementById('resultsContent').innerHTML = `
    <div class="mac-display">${display}</div>
    <div style="text-align:center;margin-bottom:15px">
      <span class="valid-badge ${validation.valid ? 'valid-true' : 'valid-false'}">${validation.valid ? '✓ Valid' : '✗ Invalid'}</span>
      ${validation.valid && validation.isLocal ? '<span class="valid-badge" style="background:#f59e0b20;color:#f59e0b;margin-left:6px">Locally Administered</span>' : ''}
      ${validation.valid && validation.isMulticast ? '<span class="valid-badge" style="background:#ef444420;color:#ef4444;margin-left:6px">Multicast</span>' : ''}
    </div>
    <div class="result-card"><h3>Vendor / Manufacturer</h3><div class="value">${vendor}</div><div class="sub">OUI: ${ouiFormatted}</div></div>
    <h2 style="font-size:14px;color:#999;margin:15px 0 10px">All Formats</h2>
    <div class="format-grid">
      ${formats.map(f => `
        <div class="format-item">
          <span class="label">${f.label}</span>
          <span class="val">${f.value}</span>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('resultsPanel').style.display = 'block';
}

function generateRandom() {
  let oui = '';
  const ouiKeys = Object.keys(ouiDB);
  oui = ouiKeys[Math.floor(Math.random() * ouiKeys.length)].replace(/[^0-9A-F]/gi, '').toUpperCase();
  if (oui.length < 6) oui = oui.padEnd(6, '0');
  let rest = '';
  for (let i = 0; i < 3; i++) rest += Math.floor(Math.random() * 256).toString(16).toUpperCase().padStart(2, '0');
  const mac = (oui + rest).substring(0, 12);
  document.getElementById('macInput').value = formatMAC(mac, 'colon');
  lookupMAC();
}

function copyResult() {
  if (lastResult) {
    navigator.clipboard.writeText(lastResult);
    const btn = event.target; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy Result', 1500);
  }
}

function clearAll() {
  document.getElementById('macInput').value = '';
  document.getElementById('resultsPanel').style.display = 'none';
  lastResult = '';
}
</script>
</body>
</html>
