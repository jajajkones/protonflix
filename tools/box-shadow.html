<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Shadow Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#8b5cf6;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:900px;width:100%;margin:0 auto}
.preview-area{display:flex;justify-content:center;align-items:center;min-height:300px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:24px}
.preview-box{width:200px;height:200px;background:var(--text);border-radius:var(--radius);transition:box-shadow .2s}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.control{display:flex;flex-direction:column;gap:6px}
.control label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.control input[type=range]{width:100%;accent-color:var(--accent)}
.control .val{font-family:'SF Mono',monospace;font-size:12px;color:var(--accent)}
.color-row{display:flex;gap:10px;align-items:center}
.color-row input[type=color]{width:40px;height:40px;border:none;border-radius:4px;cursor:pointer}
.color-row input[type=text]{flex:1;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-family:'SF Mono',monospace;font-size:13px;outline:none}
.output-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:20px;font-family:'SF Mono',monospace;font-size:13px;cursor:pointer;transition:border-color .2s;position:relative}
.output-box:hover{border-color:#444}
.output-box .hint{position:absolute;right:12px;top:12px;font-size:11px;color:var(--muted);opacity:0;transition:opacity .2s}
.output-box:hover .hint{opacity:1}
.multiple{margin-top:20px}
.multiple h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px}
.shadow-layer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.shadow-layer button{background:none;color:#ef4444;border:none;cursor:pointer}
</style>
</head>
<body>
<header><h1>Box Shadow Generator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="preview-area"><div class="preview-box" id="box"></div></div>
<div class="controls">
<div class="control"><label>X Offset</label><input type="range" id="x" min="-100" max="100" value="0" oninput="update()"><span class="val" id="xVal">0px</span></div>
<div class="control"><label>Y Offset</label><input type="range" id="y" min="-100" max="100" value="4" oninput="update()"><span class="val" id="yVal">4px</span></div>
<div class="control"><label>Blur</label><input type="range" id="blur" min="0" max="200" value="20" oninput="update()"><span class="val" id="blurVal">20px</span></div>
<div class="control"><label>Spread</label><input type="range" id="spread" min="-100" max="100" value="0" oninput="update()"><span class="val" id="spreadVal">0px</span></div>
<div class="control"><label>Opacity</label><input type="range" id="opacity" min="0" max="100" value="30" oninput="update()"><span class="val" id="opacityVal">30%</span></div>
<div class="control"><label>Inset</label><div id="insetToggle" class="toggle" onclick="this.classList.toggle('on');update()" style="width:44px;height:24px;background:#222;border-radius:12px;position:relative;cursor:pointer;transition:background .2s"><div style="width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:transform .2s"></div></div></div>
<div class="control"><label>Color</label><div class="color-row"><input type="color" id="shadowColor" value="#000000" onchange="update()"><input type="text" id="colorHex" value="#000000" onchange="document.getElementById('shadowColor').value=this.value;update()"></div></div>
<div class="control"><label>Border Radius</label><input type="range" id="radius" min="0" max="50" value="8" oninput="update()"><span class="val" id="radiusVal">8px</span></div>
<div class="control"><label>Box Color</label><input type="color" id="boxColor" value="#ffffff" onchange="document.getElementById('box').style.background=this.value"></div>
</div>
<div class="output-box" id="output" onclick="copyCss()"><span class="hint">Click to copy</span><div id="cssOutput"></div></div>
</div>
<script>
function update(){
const x=document.getElementById('x').value,y=document.getElementById('y').value,blur=document.getElementById('blur').value,spread=document.getElementById('spread').value,opacity=document.getElementById('opacity').value;
const hex=document.getElementById('shadowColor').value;
const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
const inset=document.getElementById('insetToggle').classList.contains('on');
const radius=document.getElementById('radius').value;
document.getElementById('xVal').textContent=x+'px';document.getElementById('yVal').textContent=y+'px';
document.getElementById('blurVal').textContent=blur+'px';document.getElementById('spreadVal').textContent=spread+'px';
document.getElementById('opacityVal').textContent=opacity+'%';document.getElementById('radiusVal').textContent=radius+'px';
document.getElementById('colorHex').value=hex;
const shadow=`${inset?'inset ':''}${x}px ${y}px ${blur}px ${spread}px rgba(${r},${g},${b},${opacity/100})`;
document.getElementById('box').style.boxShadow=shadow;
document.getElementById('box').style.borderRadius=radius+'px';
const css=`box-shadow: ${shadow};\nborder-radius: ${radius}px;`;
document.getElementById('cssOutput').textContent=css;
}
function copyCss(){navigator.clipboard.writeText(document.getElementById('cssOutput').textContent)}
document.getElementById('insetToggle').onclick=function(){this.classList.toggle('on');const d=this.querySelector('div');if(this.classList.contains('on'))d.style.transform='translateX(20px)';else d.style.transform='';update()};
update();
</script>
</body>
</html>
