<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Shades Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:900px;width:100%;margin:0 auto}
.picker-row{display:flex;gap:16px;align-items:center;margin-bottom:24px}
.picker-row input[type=color]{width:60px;height:60px;border:none;border-radius:8px;cursor:pointer}
.picker-row input[type=text]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-family:var(--mono);font-size:16px;outline:none;width:140px}
.shades-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:0;border-radius:12px;overflow:hidden;margin-bottom:24px}
.shade{height:100px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;cursor:pointer;transition:transform .2s;position:relative}
.shade:hover{transform:scale(1.05);z-index:1}
.shade .weight{font-size:10px;font-weight:600}
.shade .hex{font-family:var(--mono);font-size:10px}
.copied-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
.copied-toast.show{opacity:1}
.css-output{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;cursor:pointer;transition:border-color .2s;line-height:1.8}
.css-output:hover{border-color:#444}

@media(max-width:768px){header{padding:20px 16px}header h1{font-size:16px}.content{padding:20px 16px}.container{padding:16px}}
</style>
</head>
<body>
<header><h1>Color Shades Generator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="picker-row">
<input type="color" id="picker" value="#3b82f6" oninput="generate()">
<input type="text" id="hex" value="#3b82f6" oninput="document.getElementById('picker').value=this.value;generate()">
</div>
<div class="shades-grid" id="shades"></div>
<div class="css-output" id="cssOutput" onclick="copyCss()"></div>
<div class="copied-toast" id="toast">Copied!</div>
</div>
<script>
function hexToHsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b),l=(max+min)/2;let h,s;if(max===min){h=s=0}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}return[h*360,s*100,l*100]}
function hslToHex(h,s,l){h/=360;s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)};return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function textColor(h,l){return l>55?'#000000':'#ffffff'}
function generate(){
const hex=document.getElementById('hex').value;
if(!/^#[0-9a-f]{6}$/i.test(hex))return;
const[h,s,l]=hexToHsl(hex);
const weights=[50,100,200,300,400,500,600,700,800,900,950];
const shadesEl=document.getElementById('shades');
shadesEl.innerHTML=weights.map((w,i)=>{
const lightness=97-(i*8);
const saturation=Math.max(10,s-Math.abs(50-lightness)*0.3);
const shade=hslToHex(h,saturation,lightness);
const tc=textColor(h,lightness);
return`<div class="shade" style="background:${shade};color:${tc}" onclick="copyColor('${shade}')"><span class="weight">${w}</span><span class="hex">${shade}</span></div>`;
}).join('');
const css=weights.map((w,i)=>{
const lightness=97-(i*8);
const saturation=Math.max(10,s-Math.abs(50-lightness)*0.3);
return`  --color-${w}: ${hslToHex(h,saturation,lightness)};`;
}).join('\n');
document.getElementById('cssOutput').textContent=`:root {\n${css}\n}`;
}
function copyColor(hex){navigator.clipboard.writeText(hex);const t=document.getElementById('toast');t.textContent='Copied '+hex;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function copyCss(){navigator.clipboard.writeText(document.getElementById('cssOutput').textContent)}
generate();
</script>
</body>
</html>
