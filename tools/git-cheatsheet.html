<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Git Commands Cheat Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#f59e0b;--radius:6px;--mono:'SF Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}header h1{font-size:20px;font-weight:500}header a{color:var(--muted);text-decoration:none;font-size:13px}header a:hover{color:var(--text)}
.content{padding:40px;max-width:1000px;margin:0 auto}
.search{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:14px;font-family:inherit;outline:none;margin-bottom:24px}
.search:focus{border-color:var(--accent)}
.section{margin-bottom:24px}
.section h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.cmd{padding:8px 12px;border-bottom:1px solid #1a1a1a;display:flex;gap:16px;align-items:baseline;cursor:pointer;transition:background .2s}
.cmd:hover{background:rgba(255,255,255,.02)}
.cmd .code{font-family:var(--mono);font-size:13px;color:var(--accent);min-width:280px;white-space:nowrap}
.cmd .desc{font-size:13px;color:var(--muted)}
.hidden{display:none}
.copied{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:8px 16px;border-radius:var(--radius);font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;z-index:100}
.copied.show{opacity:1}
</style>
</head>
<body>
<header><h1>Git Commands</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<input class="search" id="search" placeholder="Search commands..." oninput="filter()">
<div id="sections"></div>
</div>
<div class="copied" id="toast">Copied!</div>
<script>
const data=[
{title:'Setup & Config',cmds:[{c:'git config --global user.name "Name"',d:'Set global username'},{c:'git config --global user.email "email"',d:'Set global email'},{c:'git config --list',d:'Show all config'},{c:'git config --global core.editor "code"',d:'Set default editor'}]},
{title:'Creating Projects',cmds:[{c:'git init',d:'Initialize new repo'},{c:'git clone <url>',d:'Clone a repository'},{c:'git clone --depth 1 <url>',d:'Shallow clone (latest only)'}]},
{title:'Staging & Committing',cmds:[{c:'git add <file>',d:'Stage file'},{c:'git add .',d:'Stage all changes'},{c:'git add -p',d:'Stage interactively (hunks)'},{c:'git commit -m "message"',d:'Commit staged changes'},{c:'git commit --amend',d:'Amend last commit'},{c:'git commit --amend --no-edit',d:'Amend commit message silently'}]},
{title:'Branching',cmds:[{c:'git branch',d:'List branches'},{c:'git branch <name>',d:'Create branch'},{c:'git branch -d <name>',d:'Delete branch'},{c:'git branch -D <name>',d:'Force delete branch'},{c:'git checkout <branch>',d:'Switch branch'},{c:'git checkout -b <branch>',d:'Create and switch'},{c:'git switch <branch>',d:'Switch branch (modern)'},{c:'git switch -c <branch>',d:'Create and switch (modern)'}]},
{title:'Merging & Rebasing',cmds:[{c:'git merge <branch>',d:'Merge branch into current'},{c:'git rebase <branch>',d:'Rebase onto branch'},{c:'git rebase --abort',d:'Abort rebase'},{c:'git merge --squash <branch>',d:'Squash merge'},{c:'git cherry-pick <hash>',d:'Cherry-pick a commit'}]},
{title:'Remote',cmds:[{c:'git remote -v',d:'List remotes'},{c:'git remote add origin <url>',d:'Add remote'},{c:'git push origin <branch>',d:'Push branch'},{c:'git push -u origin <branch>',d:'Push and set upstream'},{c:'git push --force',d:'Force push (dangerous)'},{c:'git fetch',d:'Fetch all remotes'},{c:'git pull',d:'Pull and merge'}]},
{title:'Inspecting',cmds:[{c:'git status',d:'Show working tree status'},{c:'git log',d:'Show commit log'},{c:'git log --oneline',d:'Compact log'},{c:'git log --graph --oneline',d:'Graph log'},{c:'git log -5',d:'Last 5 commits'},{c:'git diff',d:'Show unstaged changes'},{c:'git diff --staged',d:'Show staged changes'},{c:'git show <hash>',d:'Show commit details'},{c:'git blame <file>',d:'Show who changed each line'}]},
{title:'Undoing Changes',cmds:[{c:'git restore <file>',d:'Discard changes in file'},{c:'git restore --staged <file>',d:'Unstage file'},{c:'git reset HEAD~1',d:'Undo last commit (keep changes)'},{c:'git reset --hard HEAD~1',d:'Undo last commit (discard changes)'},{c:'git revert <hash>',d:'Revert a commit (safe)'},{c:'git stash',d:'Stash changes'},{c:'git stash pop',d:'Apply and remove stash'},{c:'git stash list',d:'List stashes'}]},
{title:'Cleaning',cmds:[{c:'git clean -fd',d:'Remove untracked files/dirs'},{c:'git clean -fdn',d:'Dry run clean'},{c:'git gc',d:'Garbage collection'},{c:'git reflog',d:'Show reference log (recovery)'}]},
{title:'Tags',cmds:[{c:'git tag v1.0.0',d:'Create lightweight tag'},{c:'git tag -a v1.0.0 -m "msg"',d:'Create annotated tag'},{c:'git push origin v1.0.0',d:'Push specific tag'},{c:'git push origin --tags',d:'Push all tags'}]},
{title:'Advanced',cmds:[{c:'git bisect start',d:'Start binary search for bugs'},{c:'git bisect good',d:'Mark current as good'},{c:'git bisect bad',d:'Mark current as bad'},{c:'git submodule add <url>',d:'Add submodule'},{c:'git worktree add ../dir <branch>',d:'Create worktree'},{c:'git archive --format=zip HEAD',d:'Export as zip'}]}
];
function render(filter=''){
document.getElementById('sections').innerHTML=data.map(s=>{
const cmds=s.cmds.filter(c=>!filter||c.c.toLowerCase().includes(filter)||c.d.toLowerCase().includes(filter));
if(!cmds.length)return'';
return`<div class="section"><h2>${s.title}</h2>${cmds.map(c=>`<div class="cmd" onclick="copyCmd(this,'${c.c.replace(/'/g,"\\'")}')"><span class="code">${esc(c.c)}</span><span class="desc">${esc(c.d)}</span></div>`).join('')}</div>`;
}).join('');
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function copyCmd(el,cmd){navigator.clipboard.writeText(cmd);const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function filter(){render(document.getElementById('search').value.toLowerCase())}
render();
</script>
</body>
</html>
