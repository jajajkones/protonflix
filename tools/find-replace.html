<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find & Replace</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#3b82f6;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:900px;width:100%;margin:0 auto}
.controls{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.controls input{flex:1;min-width:200px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-family:inherit;font-size:14px;outline:none}
.controls input:focus{border-color:#444}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-outline{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:10px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:#444}
.checkbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
textarea{width:100%;height:300px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:var(--mono);font-size:14px;line-height:1.6;resize:vertical;outline:none}
textarea:focus{border-color:#444}
.info{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<header><h1>Find & Replace</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="controls">
<input type="text" id="find" placeholder="Find...">
<input type="text" id="replace" placeholder="Replace with...">
<button class="btn" onclick="replace(false)">Replace</button>
<button class="btn" onclick="replace(true)">Replace All</button>
</div>
<div class="controls">
<label class="checkbox"><input type="checkbox" id="regex"> Regex</label>
<label class="checkbox"><input type="checkbox" id="caseSensitive"> Case Sensitive</label>
<label class="checkbox"><input type="checkbox" id="wholeWord"> Whole Word</label>
<button class="btn-outline" onclick="highlight()">Highlight</button>
<button class="btn-outline" onclick="clearHighlights()">Clear</button>
<span class="info" id="info"></span>
</div>
<textarea id="input" placeholder="Enter text to search through..." oninput="highlight()"></textarea>
</div>
<script>
function replace(all){
const input=document.getElementById('input');
const find=document.getElementById('find').value;
const repl=document.getElementById('replace').value;
if(!find)return;
const flags=document.getElementById('caseSensitive').checked?'g':'gi';
let pattern=find;
if(document.getElementById('regex').checked){}
else{pattern=find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
if(document.getElementById('wholeWord').checked)pattern='\\b'+pattern+'\\b';
const re=new RegExp(pattern,flags);
if(all){input.value=input.value.replace(re,repl);document.getElementById('info').textContent='All replaced'}
else{const m=re.exec(input.value);if(m){input.value=input.value.substring(0,m.index)+repl+input.value.substring(m.index+m[0].length);document.getElementById('info').textContent='Replaced first match'}}
highlight();
}
function highlight(){
clearHighlights();
const text=document.getElementById('input');
const find=document.getElementById('find').value;
if(!find)return;
const flags=document.getElementById('caseSensitive').checked?'g':'gi';
let pattern=document.getElementById('regex').checked?find:find.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
if(document.getElementById('wholeWord').checked)pattern='\\b'+pattern+'\\b';
const re=new RegExp(pattern,flags);
const matches=text.value.match(re);
document.getElementById('info').textContent=matches?`${matches.length} match${matches.length!==1?'es':''}`:'No matches';
}
function clearHighlights(){document.getElementById('info').textContent=''}
</script>
</body>
</html>
