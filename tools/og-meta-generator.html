<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Graph / Meta Tag Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
a{color:#fff;text-decoration:none}
.header{background:#111;border-bottom:1px solid #222;padding:16px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:1.2rem;font-weight:600}
.back{padding:6px 12px;border:1px solid #222;border-radius:6px;font-size:.85rem;transition:.2s}
.back:hover{background:#222}
.container{max-width:1000px;margin:24px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
.panel{background:#111;border:1px solid #222;border-radius:10px;padding:20px;margin-bottom:24px}
.panel h2{font-size:1rem;font-weight:500;margin-bottom:12px;color:#737373}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;color:#737373;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:8px 10px;background:#0a0a0a;border:1px solid #222;border-radius:6px;color:#fff;font-family:inherit;font-size:.85rem;outline:none}
.field textarea{height:60px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#555}
.btn{padding:8px 16px;background:#fff;color:#0a0a0a;border:none;border-radius:6px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.85rem}
.btn:hover{background:#e0e0e0}
.copy-btn{padding:8px 16px;background:#222;border:1px solid #333;border-radius:6px;color:#fff;font-family:inherit;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:#333}
.code-box{position:relative;margin-bottom:16px}
.code-box pre{background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:14px;font-size:.75rem;overflow-x:auto;line-height:1.6;max-height:300px;overflow-y:auto}
.preview-card{border:1px solid #222;border-radius:10px;overflow:hidden;background:#111;max-width:500px}
.preview-card-img{height:200px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#737373;font-size:.85rem;background-size:cover;background-position:center}
.preview-card-body{padding:16px}
.preview-card-body h3{font-size:1rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview-card-body p{font-size:.8rem;color:#737373;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.preview-card-body .url{font-size:.75rem;color:#555;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back">← Back</a>
<h1>Open Graph / Meta Tag Generator</h1>
</div>
<div class="container">
<div class="grid">
<div class="panel">
<h2>Input</h2>
<div class="field"><label>Page Title</label><input id="title" oninput="update()" placeholder="My Awesome Page"></div>
<div class="field"><label>Description</label><textarea id="desc" oninput="update()" placeholder="A great description of your page"></textarea></div>
<div class="field"><label>Image URL</label><input id="image" oninput="update()" placeholder="https://example.com/image.png"></div>
<div class="field"><label>Page URL</label><input id="url" oninput="update()" placeholder="https://example.com/page"></div>
<div class="field"><label>Type</label><select id="type" onchange="update()">
<option value="website">website</option><option value="article">article</option><option value="product">product</option><option value="profile">profile</option>
</select></div>
<div class="field"><label>Site Name</label><input id="siteName" oninput="update()" placeholder="My Site"></div>
<div class="field"><label>Twitter Handle</label><input id="twitter" oninput="update()" placeholder="@username"></div>
<button class="copy-btn" onclick="copyAll()">Copy All Tags</button>
</div>
<div>
<div class="panel">
<h2>Preview Card</h2>
<div class="preview-card">
<div class="preview-card-img" id="previewImg">No image</div>
<div class="preview-card-body">
<h3 id="previewTitle">Page Title</h3>
<p id="previewDesc">Description goes here</p>
<div class="url" id="previewUrl">example.com</div>
</div>
</div>
</div>
<div class="panel">
<h2>Generated Tags</h2>
<div class="code-box"><pre><code id="code"></code></pre></div>
</div>
</div>
</div>
</div>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function update(){
const t=document.getElementById('title').value;
const d=document.getElementById('desc').value;
const img=document.getElementById('image').value;
const u=document.getElementById('url').value;
const tp=document.getElementById('type').value;
const sn=document.getElementById('siteName').value;
const tw=document.getElementById('twitter').value;
document.getElementById('previewTitle').textContent=t||'Page Title';
document.getElementById('previewDesc').textContent=d||'Description goes here';
if(img){document.getElementById('previewImg').style.backgroundImage=`url(${img})`;document.getElementById('previewImg').textContent='';}
else{document.getElementById('previewImg').style.backgroundImage='';document.getElementById('previewImg').textContent='No image';}
try{document.getElementById('previewUrl').textContent=new URL(u||'https://example.com').hostname;}catch{document.getElementById('previewUrl').textContent=u||'example.com';}
let tags=[];
if(t)tags.push(`&lt;title&gt;${esc(t)}&lt;/title&gt;`);
if(t)tags.push(`&lt;meta property="og:title" content="${esc(t)}"&gt;`);
if(d)tags.push(`&lt;meta name="description" content="${esc(d)}"&gt;`);
if(d)tags.push(`&lt;meta property="og:description" content="${esc(d)}"&gt;`);
if(img)tags.push(`&lt;meta property="og:image" content="${esc(img)}"&gt;`);
if(u)tags.push(`&lt;meta property="og:url" content="${esc(u)}"&gt;`);
if(tp)tags.push(`&lt;meta property="og:type" content="${esc(tp)}"&gt;`);
if(sn)tags.push(`&lt;meta property="og:site_name" content="${esc(sn)}"&gt;`);
if(tw)tags.push(`&lt;meta name="twitter:site" content="${esc(tw)}"&gt;`);
if(t)tags.push(`&lt;meta name="twitter:title" content="${esc(t)}"&gt;`);
if(d)tags.push(`&lt;meta name="twitter:description" content="${esc(d)}"&gt;`);
if(img)tags.push(`&lt;meta name="twitter:image" content="${esc(img)}"&gt;`);
tags.push(`&lt;meta name="twitter:card" content="summary_large_image"&gt;`);
document.getElementById('code').innerHTML=tags.join('\n');
}
function copyAll(){
const code=document.getElementById('code').textContent;
navigator.clipboard.writeText(code);
const b=document.querySelector('.copy-btn');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy All Tags',1500);
}
update();
</script>
</body>
</html>
