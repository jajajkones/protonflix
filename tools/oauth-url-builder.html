<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OAuth URL Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
.header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #222}
.header h1{font-size:1.5rem;font-weight:600}
.header a{color:#737373;text-decoration:none;font-size:.875rem;transition:color .2s}
.header a:hover{color:#fff}
.container{max-width:900px;margin:0 auto}
.surface{background:#111;border:1px solid #222;border-radius:8px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.75rem;color:#737373;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input,select{width:100%;background:#0a0a0a;border:1px solid #222;border-radius:6px;color:#fff;padding:10px 12px;font-family:'Outfit',sans-serif;font-size:.875rem;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:#444}
select{cursor:pointer}
.btn{background:#fff;color:#0a0a0a;border:none;border-radius:6px;padding:10px 20px;font-family:'Outfit',sans-serif;font-size:.875rem;font-weight:500;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-secondary{background:transparent;color:#fff;border:1px solid #222}
.btn-secondary:hover{border-color:#444}
.row{display:flex;gap:12px;align-items:flex-end}
.row>*{flex:1}
.provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.provider-btn{background:#0a0a0a;border:2px solid #222;border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif;color:#fff;font-size:.8rem}
.provider-btn:hover{border-color:#444}
.provider-btn.active{border-color:#fff;background:#1a1a1a}
.provider-btn .icon{font-size:1.5rem;margin-bottom:4px}
.url-output{background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:12px;font-family:monospace;font-size:.8rem;word-break:break-all;color:#ccc;max-height:200px;overflow:auto}
.pkce-section{border-top:1px solid #222;padding-top:16px;margin-top:16px}
.hash-result{background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:10px;margin-bottom:8px;font-family:monospace;font-size:.8rem;color:#ccc;word-break:break-all;cursor:pointer;transition:background .2s}
.hash-result:hover{background:#1a1a1a}
.hash-label{font-family:'Outfit',sans-serif;font-size:.7rem;color:#737373;margin-bottom:4px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<a href="index.html">&larr; Back</a>
<h1>OAuth URL Builder</h1>
</div>

<div class="surface">
<label>Provider Preset</label>
<div class="provider-grid" id="providers"></div>
</div>

<div class="surface">
<div class="row" style="margin-bottom:12px">
<div>
<label>Client ID</label>
<input type="text" id="clientId" placeholder="your-client-id" aria-label="OAuth Client ID">
</div>
<div>
<label>Redirect URI</label>
<input type="text" id="redirectUri" placeholder="https://yourapp.com/callback" aria-label="OAuth Redirect URI">
</div>
</div>
<div class="row" style="margin-bottom:12px">
<div>
<label>Scope</label>
<input type="text" id="scope" placeholder="openid profile email" aria-label="OAuth scopes">
</div>
<div>
<label>State (optional)</label>
<input type="text" id="state" placeholder="random-state-value" aria-label="OAuth state parameter">
</div>
</div>
<div class="row">
<div>
<label>Response Type</label>
<select id="responseType">
<option value="code">code</option>
<option value="token">token</option>
<option value="id_token">id_token</option>
</select>
</div>
<div>
<label>&nbsp;</label>
<button class="btn" onclick="buildURL()">Build URL</button>
</div>
</div>
</div>

<div id="resultSection" class="surface" style="display:none">
<label>Authorization URL</label>
<div class="url-output" id="urlOutput" onclick="copyURL()"></div>
<div style="margin-top:8px">
<button class="btn-secondary btn" onclick="copyURL()">Copy URL</button>
<button class="btn-secondary btn" onclick="openURL()">Open in New Tab</button>
</div>
</div>

<div class="surface pkce-section">
<label>PKCE Generator (S256)</label>
<button class="btn-secondary btn" style="margin-bottom:12px" onclick="generatePKCE()">Generate code_verifier & code_challenge</button>
<div id="pkceOutput" style="display:none">
<div class="hash-result">
<div class="hash-label">code_verifier</div>
<div id="verifier" onclick="navigator.clipboard.writeText(this.textContent)"></div>
</div>
<div class="hash-result">
<div class="hash-label">code_challenge (S256)</div>
<div id="challenge" onclick="navigator.clipboard.writeText(this.textContent)"></div>
</div>
</div>
</div>
</div>

<script>
const PROVIDERS=[
{id:'google',name:'Google',auth:'https://accounts.google.com/o/oauth2/v2/auth',scope:'openid profile email',icon:'G'},
{id:'github',name:'GitHub',auth:'https://github.com/login/oauth/authorize',scope:'read:user user:email',icon:'<svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>'},
{id:'facebook',name:'Facebook',auth:'https://www.facebook.com/v18.0/dialog/oauth',scope:'public_profile email',icon:'f'},
{id:'discord',name:'Discord',auth:'https://discord.com/api/oauth2/authorize',scope:'identify email',icon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03z"/></svg>'},
{id:'slack',name:'Slack',auth:'https://slack.com/oauth/v2/authorize',scope:'openid profile email',icon:'#'},
{id:'microsoft',name:'Microsoft',auth:'https://login.microsoftonline.com/common/oauth2/v2.0/authorize',scope:'openid profile email',icon:'<svg width="20" height="20" viewBox="0 0 21 21" fill="currentColor"><rect x="1" y="1" width="9" height="9"/><rect x="11" y="1" width="9" height="9"/><rect x="1" y="11" width="9" height="9"/><rect x="11" y="11" width="9" height="9"/></svg>'}
];

let selectedProvider=null;
let builtURL='';

function renderProviders(){
const el=document.getElementById('providers');
el.innerHTML=PROVIDERS.map(p=>`
<div class="provider-btn" onclick="selectProvider('${p.id}')" id="p-${p.id}">
<div class="icon">${p.icon}</div>
<div>${p.name}</div>
</div>`).join('');
}

function selectProvider(id){
const p=PROVIDERS.find(x=>x.id===id);
if(selectedProvider===id){selectedProvider=null;document.querySelectorAll('.provider-btn').forEach(b=>b.classList.remove('active'));return}
selectedProvider=id;
document.querySelectorAll('.provider-btn').forEach(b=>b.classList.remove('active'));
document.getElementById('p-'+id).classList.add('active');
document.getElementById('scope').value=p.scope;
}

function buildURL(){
if(!selectedProvider){alert('Select a provider');return;}
const p=PROVIDERS.find(x=>x.id===selectedProvider);
const clientId=document.getElementById('clientId').value.trim();
const redirect=document.getElementById('redirectUri').value.trim();
const scope=document.getElementById('scope').value.trim();
const state=document.getElementById('state').value.trim();
const responseType=document.getElementById('responseType').value;
if(!clientId||!redirect){alert('Enter Client ID and Redirect URI');return;}
const params=new URLSearchParams({client_id:clientId,redirect_uri:redirect,response_type:responseType});
if(scope)params.set('scope',scope);
if(state)params.set('state',state);
builtURL=p.auth+'?'+params.toString();
document.getElementById('urlOutput').textContent=builtURL;
document.getElementById('resultSection').style.display='block';
}

function copyURL(){navigator.clipboard.writeText(builtURL)}
function openURL(){window.open(builtURL,'_blank')}

function base64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

async function generatePKCE(){
const arr=crypto.getRandomValues(new Uint8Array(32));
const verifier=base64url(arr);
const data=new TextEncoder().encode(verifier);
const digest=await crypto.subtle.digest('SHA-256',data);
const challenge=base64url(new Uint8Array(digest));
document.getElementById('verifier').textContent=verifier;
document.getElementById('challenge').textContent=challenge;
document.getElementById('pkceOutput').style.display='block';
}

renderProviders();
</script>
</body>
</html>
