<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Cursor Generator - ProtonFlix Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;padding:20px}
a{color:#fff;text-decoration:none}
.container{max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#111;border:1px solid #222;border-radius:12px;margin-bottom:24px}
header h1{font-size:1.3rem;font-weight:600}
header a{font-size:.9rem;color:#737373;transition:color .2s}
header a:hover{color:#fff}
.cursor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:24px}
.cursor-card{background:#111;border:1px solid #222;border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:10px}
.cursor-card:hover{background:#1a1a1a;border-color:#444}
.cursor-card.active{background:#1a1a1a;border-color:#fff}
.cursor-icon{width:40px;height:40px;background:#0a0a0a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.cursor-name{font-size:.8rem;color:#737373;font-weight:400}
.preview-area{background:#111;border:1px solid #222;border-radius:12px;padding:40px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;margin-bottom:24px}
.preview-box{background:#0a0a0a;border:1px solid #222;border-radius:10px;padding:30px 60px;font-size:1.1rem;font-weight:500}
.css-output{position:relative;background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:16px;font-family:'Courier New',monospace;font-size:.85rem;color:#a8ff60;white-space:pre-wrap;word-break:break-all;cursor:pointer;transition:border-color .2s}
.css-output:hover{border-color:#444}
.css-output .copy-hint{position:absolute;top:8px;right:12px;font-size:.7rem;color:#737373;font-family:'Outfit',sans-serif}
.css-output.copied{border-color:#a8ff60}
.css-output.copied .copy-hint{color:#a8ff60}
.section-title{font-size:1.1rem;font-weight:500;color:#737373;margin-bottom:16px}
.search-box{width:100%;padding:12px 16px;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#fff;font-family:'Outfit',sans-serif;font-size:.95rem;outline:none;margin-bottom:20px}
.search-box:focus{border-color:#444}
.search-box::placeholder{color:#555}
</style>
</head>
<body>
<div class="container">
<header>
<h1>CSS Cursor Generator</h1>
<a href="index.html">← Back to Tools</a>
</header>
<input type="text" class="search-box" id="search" placeholder="Search cursors..." oninput="filterCursors()">
<div class="section-title">Available Cursors</div>
<div class="cursor-grid" id="cursorGrid"></div>
<div class="preview-area">
<div class="section-title">Preview</div>
<div class="preview-box" id="previewBox">Hover over this box</div>
</div>
<div class="section-title">CSS Output</div>
<div class="css-output" id="cssOutput" onclick="copyCSS()"><span class="copy-hint">Click to copy</span>cursor: pointer;</div>
</div>
<script>
const cursors=[
{name:'auto',icon:'⬆',css:'auto'},
{name:'default',icon:'⬆',css:'default'},
{name:'none',icon:'—',css:'none'},
{name:'context-menu',icon:'📋',css:'context-menu'},
{name:'help',icon:'❓',css:'help'},
{name:'pointer',icon:'👆',css:'pointer'},
{name:'progress',icon:'⏳',css:'progress'},
{name:'wait',icon:'⌛',css:'wait'},
{name:'cell',icon:'⊞',css:'cell'},
{name:'crosshair',icon:'✚',css:'crosshair'},
{name:'text',icon:'I',css:'text'},
{name:'vertical-text',icon:'⊥',css:'vertical-text'},
{name:'alias',icon:'🔗',css:'alias'},
{name:'copy',icon:'📋',css:'copy'},
{name:'move',icon:'✥',css:'move'},
{name:'no-drop',icon:'🚫',css:'no-drop'},
{name:'not-allowed',icon:'⊘',css:'not-allowed'},
{name:'grab',icon:'✋',css:'grab'},
{name:'grabbing',icon:'✊',css:'grabbing'},
{name:'e-resize',icon:'→',css:'e-resize'},
{name:'n-resize',icon:'↑',css:'n-resize'},
{name:'ne-resize',icon:'↗',css:'ne-resize'},
{name:'nw-resize',icon:'↖',css:'nw-resize'},
{name:'s-resize',icon:'↓',css:'s-resize'},
{name:'se-resize',icon:'↘',css:'se-resize'},
{name:'sw-resize',icon:'↙',css:'sw-resize'},
{name:'w-resize',icon:'←',css:'w-resize'},
{name:'ew-resize',icon:'↔',css:'ew-resize'},
{name:'ns-resize',icon:'↕',css:'ns-resize'},
{name:'nesw-resize',icon:'↗↙',css:'nesw-resize'},
{name:'nwse-resize',icon:'↖↘',css:'nwse-resize'},
{name:'col-resize',icon:'⇔',css:'col-resize'},
{name:'row-resize',icon:'⇕',css:'row-resize'},
{name:'all-scroll',icon:'✥',css:'all-scroll'},
{name:'zoom-in',icon:'🔍+',css:'zoom-in'},
{name:'zoom-out',icon:'🔍−',css:'zoom-out'}
];

let selected='pointer';

function renderCursors(filter=''){
const grid=document.getElementById('cursorGrid');
const f=filter.toLowerCase();
grid.innerHTML=cursors.filter(c=>c.name.includes(f)).map(c=>`
<div class="cursor-card ${c.css===selected?'active':''}" onclick="selectCursor('${c.css}')" onmouseenter="previewCursor('${c.css}')" onmouseleave="resetPreview()">
<div class="cursor-icon">${c.icon}</div>
<div class="cursor-name">${c.name}</div>
</div>
`).join('');
}

function selectCursor(css){
selected=css;
renderCursors(document.getElementById('search').value);
updateOutput();
}

function previewCursor(css){
document.getElementById('previewBox').style.cursor=css;
}

function resetPreview(){
document.getElementById('previewBox').style.cursor=selected;
}

function updateOutput(){
document.getElementById('cssOutput').innerHTML=`<span class="copy-hint">Click to copy</span>cursor: ${selected};`;
}

function copyCSS(){
const css=`cursor: ${selected};`;
navigator.clipboard.writeText(css).then(()=>{
const el=document.getElementById('cssOutput');
el.classList.add('copied');
el.querySelector('.copy-hint').textContent='Copied!';
setTimeout(()=>{el.classList.remove('copied');el.querySelector('.copy-hint').textContent='Click to copy';},1500);
});
}

function filterCursors(){
renderCursors(document.getElementById('search').value);
}

renderCursors();
document.getElementById('previewBox').style.cursor='pointer';
</script>
</body>
</html>
