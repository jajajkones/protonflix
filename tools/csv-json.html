<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV to JSON Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#22c55e;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.toolbar{padding:16px 40px;display:flex;gap:12px;border-bottom:1px solid var(--border)}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000}
.container{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0}
.pane{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.pane:last-child{border-right:none}
.pane-header{padding:12px 20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
textarea{flex:1;background:var(--bg);color:var(--text);border:none;padding:20px;font-family:var(--mono);font-size:14px;line-height:1.6;resize:none;outline:none}
.output{flex:1;padding:20px;font-family:var(--mono);font-size:13px;line-height:1.6;overflow:auto;white-space:pre-wrap;word-break:break-word}
.status{padding:10px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
@media(max-width:768px){.container{grid-template-columns:1fr}.pane{min-height:40vh}.pane:last-child{border-top:1px solid var(--border)}}
</style>
</head>
<body>
<header><h1>CSV to JSON Converter</h1><a href="index.html">← Back to Tools</a></header>
<div class="toolbar">
<button class="btn primary" onclick="csvToJson()">CSV → JSON</button>
<button class="btn primary" onclick="jsonToCsv()">JSON → CSV</button>
<button class="btn" onclick="copyOutput()">Copy</button>
<button class="btn" onclick="downloadOutput()">Download</button>
<button class="btn" onclick="clearAll()">Clear</button>
</div>
<div class="container">
<div class="pane">
<div class="pane-header">Input</div>
<textarea id="input" placeholder="Paste CSV or JSON here..." spellcheck="false"></textarea>
</div>
<div class="pane">
<div class="pane-header">Output</div>
<div class="output" id="output"></div>
</div>
</div>
<div class="status" id="status">Ready</div>
<script>
function csvToJson(){
const csv=document.getElementById('input').value.trim();
if(!csv)return;
const lines=csv.split('\n');
const headers=parseCSVLine(lines[0]);
const data=[];
for(let i=1;i<lines.length;i++){
if(!lines[i].trim())continue;
const vals=parseCSVLine(lines[i]);
const obj={};
headers.forEach((h,j)=>{obj[h.trim()]=vals[j]?vals[j].trim():''});
data.push(obj);
}
const json=JSON.stringify(data,null,2);
document.getElementById('output').textContent=json;
document.getElementById('status').textContent=`Converted ${data.length} rows`;
}
function jsonToCsv(){
const json=document.getElementById('input').value.trim();
if(!json)return;
try{
const data=JSON.parse(json);
if(!Array.isArray(data)){document.getElementById('output').textContent='Error: JSON must be an array of objects';return}
const headers=[...new Set(data.flatMap(Object.keys))];
let csv=headers.join(',')+'\n';
data.forEach(row=>{
csv+=headers.map(h=>{const v=String(row[h]||'');return v.includes(',')||v.includes('"')||v.includes('\n')?'"'+v.replace(/"/g,'""')+'"':v}).join(',')+'\n';
});
document.getElementById('output').textContent=csv;
document.getElementById('status').textContent=`Converted ${data.length} rows to CSV`;
}catch(e){document.getElementById('output').textContent='Error: '+e.message}
}
function parseCSVLine(line){const result=[];let current='';let inQuotes=false;for(let i=0;i<line.length;i++){const c=line[i];if(inQuotes){if(c==='"'){if(line[i+1]==='"'){current+='"';i++}else{inQuotes=false}}else{current+=c}}else{if(c==='"'){inQuotes=true}else if(c===','){result.push(current);current=''}else{current+=c}}}result.push(current);return result}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent)}
function downloadOutput(){const b=new Blob([document.getElementById('output').textContent],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='output.txt';a.click()}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').textContent='';document.getElementById('status').textContent='Ready'}
</script>
</body>
</html>
