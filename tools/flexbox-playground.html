<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Playground</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#3b82f6;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}header h1{font-size:20px;font-weight:500}header a{color:var(--muted);text-decoration:none;font-size:13px}header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:1200px;width:100%;margin:0 auto}
.layout{display:grid;grid-template-columns:1fr 320px;gap:24px}
.preview{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;min-height:400px}
.controls{display:flex;flex-direction:column;gap:16px}
.ctrl{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.ctrl label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:6px}
.ctrl select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px;font-size:13px;font-family:inherit;outline:none}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:var(--radius);font-size:12px;font-family:inherit;cursor:pointer}
.btn-outline{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:var(--radius);font-size:12px;font-family:inherit;cursor:pointer}
.items{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.item{width:60px;height:60px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;cursor:pointer;transition:all .2s}
.item:nth-child(1){background:#3b82f6}.item:nth-child(2){background:#8b5cf6}.item:nth-child(3){background:#ec4899}.item:nth-child(4){background:#f59e0b}.item:nth-child(5){background:#22c55e}
.item.selected{outline:2px solid var(--text);outline-offset:2px}
.item-ctrl{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:12px}
.css-output{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:var(--mono);font-size:12px;line-height:1.8;cursor:pointer;transition:border-color .2s;max-height:200px;overflow:auto;white-space:pre}
.css-output:hover{border-color:#444}
@media(max-width:768px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Flexbox Playground</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="layout">
<div>
<div class="preview" id="preview">
<div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div>
</div>
<div class="css-output" id="cssOut" onclick="navigator.clipboard.writeText(this.textContent)"></div>
</div>
<div class="controls">
<div class="ctrl"><label>display</label><select id="display" onchange="update()"><option value="flex">flex</option><option value="inline-flex">inline-flex</option></select></div>
<div class="ctrl"><label>flex-direction</label><select id="direction" onchange="update()"><option value="row">row</option><option value="row-reverse">row-reverse</option><option value="column">column</option><option value="column-reverse">column-reverse</option></select></div>
<div class="ctrl"><label>flex-wrap</label><select id="wrap" onchange="update()"><option value="nowrap">nowrap</option><option value="wrap">wrap</option><option value="wrap-reverse">wrap-reverse</option></select></div>
<div class="ctrl"><label>justify-content</label><select id="justify" onchange="update()"><option value="flex-start">flex-start</option><option value="flex-end">flex-end</option><option value="center">center</option><option value="space-between">space-between</option><option value="space-around">space-around</option><option value="space-evenly">space-evenly</option></select></div>
<div class="ctrl"><label>align-items</label><select id="align" onchange="update()"><option value="stretch">stretch</option><option value="flex-start">flex-start</option><option value="flex-end">flex-end</option><option value="center">center</option><option value="baseline">baseline</option></select></div>
<div class="ctrl"><label>align-content</label><select id="alignContent" onchange="update()"><option value="stretch">stretch</option><option value="flex-start">flex-start</option><option value="flex-end">flex-end</option><option value="center">center</option><option value="space-between">space-between</option><option value="space-around">space-around</option></select></div>
<div class="ctrl"><label>gap</label><select id="gap" onchange="update()"><option value="0">0px</option><option value="8">8px</option><option value="12" selected>12px</option><option value="16">16px</option><option value="24">24px</option><option value="32">32px</option></select></div>
<div class="item-ctrl" id="itemCtrl" style="display:none">
<label>Selected Item Properties</label>
<div class="ctrl" style="margin-top:8px"><label>flex-grow</label><select id="grow" onchange="updateItem()"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
<div class="ctrl"><label>flex-shrink</label><select id="shrink" onchange="updateItem()"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option></select></div>
<div class="ctrl"><label>flex-basis</label><select id="basis" onchange="updateItem()"><option value="auto">auto</option><option value="0">0</option><option value="50px">50px</option><option value="100px">100px</option><option value="150px">150px</option></select></div>
<div class="ctrl"><label>align-self</label><select id="self" onchange="updateItem()"><option value="auto">auto</option><option value="flex-start">flex-start</option><option value="flex-end">flex-end</option><option value="center">center</option><option value="stretch">stretch</option></select></div>
<div class="ctrl"><label>order</label><select id="order" onchange="updateItem()"><option value="0">0</option><option value="-1">-1</option><option value="1">1</option><option value="2">2</option></select></div>
</div>
<div class="btn-row"><button class="btn" onclick="addItem()">+ Add Item</button><button class="btn-outline" onclick="removeItem()">- Remove</button></div>
</div>
</div>
</div>
<script>
let selectedIdx=-1;
function update(){const p=document.getElementById('preview');p.style.display=document.getElementById('display').value;p.style.flexDirection=document.getElementById('direction').value;p.style.flexWrap=document.getElementById('wrap').value;p.style.justifyContent=document.getElementById('justify').value;p.style.alignItems=document.getElementById('align').value;p.style.alignContent=document.getElementById('alignContent').value;p.style.gap=document.getElementById('gap').value+'px';updateCSS()}
function updateCSS(){const s=document.getElementById('preview').style;document.getElementById('cssOut').textContent=`.container {\n  display: ${s.display};\n  flex-direction: ${s.flexDirection};\n  flex-wrap: ${s.flexWrap};\n  justify-content: ${s.justifyContent};\  align-items: ${s.alignItems};\n  align-content: ${s.alignContent};\n  gap: ${s.gap};\n}`}
function updateItem(){if(selectedIdx<0)return;const items=document.querySelectorAll('#preview .item');if(!items[selectedIdx])return;const it=items[selectedIdx].style;it.flexGrow=document.getElementById('grow').value;it.flexShrink=document.getElementById('shrink').value;it.flexBasis=document.getElementById('basis').value;it.alignSelf=document.getElementById('self').value;it.order=document.getElementById('order').value}
function addItem(){const p=document.getElementById('preview');const n=p.children.length+1;const d=document.createElement('div');d.className='item';d.textContent=n;d.onclick=function(){selectItem(n-1)};p.appendChild(d)}
function removeItem(){const p=document.getElementById('preview');if(p.children.length>1)p.removeChild(p.lastChild);selectedIdx=-1;document.getElementById('itemCtrl').style.display='none'}
document.querySelectorAll('#preview .item').forEach((it,i)=>{it.onclick=()=>selectItem(i)});
function selectItem(i){selectedIdx=i;document.getElementById('itemCtrl').style.display='';document.querySelectorAll('#preview .item').forEach((it,j)=>it.classList.toggle('selected',j===i));const it=document.querySelectorAll('#preview .item')[i].style;document.getElementById('grow').value=it.flexGrow||'0';document.getElementById('shrink').value=it.flexShrink||'1';document.getElementById('basis').value=it.flexBasis||'auto';document.getElementById('self').value=it.alignSelf||'auto';document.getElementById('order').value=it.order||'0'}
update();updateCSS();
</script>
</body>
</html>
