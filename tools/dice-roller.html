<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Roller</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#f59e0b;--radius:6px;--mono:'SF Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.dice-area{display:flex;gap:20px;margin:40px 0;flex-wrap:wrap;justify-content:center}
.die{width:100px;height:100px;background:var(--surface);border:2px solid var(--border);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:48px;font-family:var(--mono);font-weight:300;transition:all .3s;cursor:pointer;user-select:none}
.die:hover{border-color:var(--accent)}
.die.rolling{animation:roll 0.1s infinite}
@keyframes roll{0%{transform:rotate(0deg) scale(1)}25%{transform:rotate(5deg) scale(1.05)}50%{transform:rotate(0deg) scale(1)}75%{transform:rotate(-5deg) scale(1.05)}100%{transform:rotate(0deg) scale(1)}}
.die.rolled{border-color:var(--accent);background:rgba(245,158,11,0.1)}
.total{font-size:32px;font-family:var(--mono);margin:20px 0;min-height:40px}
.total .sum{color:var(--accent)}
.controls{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.control{display:flex;align-items:center;gap:6px}
.control label{font-size:13px;color:var(--muted)}
.control select,.control input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.btn{padding:14px 32px;border-radius:var(--radius);font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;border:none;transition:all .2s}
.btn-roll{background:var(--accent);color:#000;font-size:18px;padding:16px 48px}
.btn-roll:hover{opacity:.8}
.history{margin-top:30px;width:100%;max-width:500px}
.history h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;text-align:center}
.history-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #1a1a1a;font-family:var(--mono);font-size:13px;justify-content:space-between}
.history-row .dice-vals{color:var(--muted)}
.history-row .sum{color:var(--accent)}
</style>
</head>
<body>
<div class="controls">
<div class="control"><label>Count</label><input type="number" id="diceCount" value="2" min="1" max="20"></div>
<div class="control"><label>Sides</label><select id="sides"><option value="4">d4</option><option value="6" selected>d6</option><option value="8">d8</option><option value="10">d10</option><option value="12">d12</option><option value="20">d20</option><option value="100">d100</option></select></div>
<div class="control"><label>Modifier</label><input type="number" id="modifier" value="0" style="width:60px"></div>
</div>
<div class="dice-area" id="diceArea"></div>
<div class="total" id="total"></div>
<button class="btn btn-roll" onclick="roll()">Roll</button>
<div class="history"><h3>Roll History</h3><div id="history"></div></div>
<script>
let hist=[];let rolling=false;
function roll(){
if(rolling)return;rolling=true;
const count=+document.getElementById('diceCount').value;
const sides=+document.getElementById('sides').value;
const mod=+document.getElementById('modifier').value;
const area=document.getElementById('diceArea');
area.innerHTML='';
for(let i=0;i<count;i++){const d=document.createElement('div');d.className='die rolling';d.textContent='?';area.appendChild(d)}
setTimeout(()=>{
const dice=[];
area.querySelectorAll('.die').forEach((d,i)=>{
const val=Math.floor(Math.random()*sides)+1;dice.push(val);
d.textContent=val;d.classList.remove('rolling');d.classList.add('rolled');
d.style.animationDelay=i*0.05+'s';
});
const sum=dice.reduce((a,b)=>a+b,0)+mod;
document.getElementById('total').innerHTML=`<span class="sum">${sum}</span>${mod?` (${dice.join(' + ')}${mod>0?' + '+mod:' - '+Math.abs(mod)})`:' ('+dice.join(' + ')+')'}`;
hist.unshift({dice,sum});
if(hist.length>30)hist.pop();
renderHistory();rolling=false;
},600);
}
function renderHistory(){document.getElementById('history').innerHTML=hist.map(h=>`<div class="history-row"><span class="dice-vals">[${h.dice.join(', ')}]</span><span class="sum">= ${h.sum}</span></div>`).join('')}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.matches('input,select')){e.preventDefault();roll()}});
roll();
</script>
</body>
</html>
