<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Analyzer - ProtonFlix Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c0c0c;color:#e5e5e5;min-height:100vh;padding:20px}
.container{max-width:700px;margin:0 auto}
a{color:#e5e5e5;text-decoration:none;opacity:.6;transition:opacity .2s}
a:hover{opacity:1}
.header{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.header h1{font-size:1.5rem;font-weight:600}
.card{background:#141414;border:1px solid #262626;border-radius:12px;padding:24px;margin-bottom:16px}
label{display:block;font-size:.875rem;color:#737373;margin-bottom:6px}
.pw-wrap{position:relative}
input[type="text"],input[type="password"]{width:100%;background:#1a1a1a;border:1px solid #262626;border-radius:8px;padding:10px 44px 10px 14px;color:#e5e5e5;font-size:.95rem;outline:none;transition:border-color .2s;font-family:monospace}
input:focus{border-color:#555}
.toggle-pw{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#737373;cursor:pointer;font-size:1.1rem;padding:4px}
.meter{height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin:12px 0}
.meter .fill{height:100%;border-radius:3px;transition:width .4s,background .4s}
.score-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.score-num{font-size:1.8rem;font-weight:700}
.score-text{font-size:.85rem;color:#737373}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:#1a1a1a;border:1px solid #262626;border-radius:8px;padding:12px}
.stat .label{font-size:.75rem;color:#737373;text-transform:uppercase;letter-spacing:.5px}
.stat .value{font-size:1.1rem;font-weight:600;margin-top:4px}
.stat .value.mono{font-family:monospace}
.crack-scenarios{margin-top:16px}
.crack-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1a1a1a;font-size:.85rem}
.crack-row:last-child{border:none}
.crack-row .scenario{color:#737373}
.crack-row .time{font-weight:600;font-family:monospace}
.pattern-list{margin-top:16px}
.pattern-tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:.8rem;margin:3px 4px 3px 0}
.pattern-tag.warn{background:#78350f;color:#fbbf24}
.pattern-tag.ok{background:#166534;color:#4ade80}
.suggestions{margin-top:16px}
.suggestion{padding:8px 12px;background:#1a1a1a;border-left:3px solid #262626;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:.85rem;color:#737373}
.suggestion::before{content:"→ ";color:#e5e5e5}
.empty{text-align:center;color:#737373;padding:30px;font-size:.9rem}
</style>
</head>
<body>
<div class="container">
<a href="index.html" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:16px">&larr; Back</a>
<div class="header"><h1>Password Strength Analyzer</h1></div>
<div class="card">
<label for="password">Enter Password</label>
<div class="pw-wrap">
<input type="password" id="password" placeholder="Type a password to analyze..." autocomplete="off">
<button class="toggle-pw" onclick="togglePw()" title="Toggle visibility">&#128065;</button>
</div>
</div>
<div class="card" id="results">
<div class="empty">Enter a password to see analysis</div>
</div>
</div>
<script>
function togglePw(){
const i=document.getElementById("password");
i.type=i.type==="password"?"text":"password";
}
const SEQUENTIAL="abcdefghijklmnopqrstuvwxyz0123456789";
const KEYBOARD_ROWS=["qwertyuiop","asdfghjkl","zxcvbnm","1234567890"];
const REPEATED=/(.)\1{2,}/g;
function analyze(pw){
if(!pw)return null;
let score=0;
const len=pw.length;
const hasLower=/[a-z]/.test(pw);
const hasUpper=/[A-Z]/.test(pw);
const hasDigit=/[0-9]/.test(pw);
const hasSpecial=/[^a-zA-Z0-9]/.test(pw);
const charsets=[hasLower,hasUpper,hasDigit,hasSpecial].filter(Boolean).length;
score+=Math.min(len*4,40);
score+=charsets*15;
if(len>=12)score+=10;
if(len>=16)score+=10;
if(hasLower&&hasUpper&&hasDigit&&hasSpecial)score+=15;
let entropy=0;
const poolSize=(hasLower?26:0)+(hasUpper?26:0)+(hasDigit?10:0)+(hasSpecial?33:0);
if(poolSize>0)entropy=Math.log2(poolSize)*len;
const patterns=[];
if(REPEATED.test(pw)){patterns.push({text:"Repeated characters",type:"warn"});}
for(const row of KEYBOARD_ROWS){
for(let i=0;i<=pw.length-3;i++){
const sub=pw.substring(i,i+3).toLowerCase();
if(row.includes(sub)&&sub.length===3){patterns.push({text:"Keyboard pattern: "+sub,type:"warn"});break;}
}
}
for(let i=0;i<=pw.length-3;i++){
const sub=pw.toLowerCase().substring(i,i+3);
if(SEQUENTIAL.includes(sub)){patterns.push({text:"Sequential: "+sub,type:"warn"});break;}
}
if(pw.toLowerCase().includes("password")||pw.toLowerCase().includes("123456")||pw.toLowerCase().includes("qwerty")){patterns.push({text:"Common password pattern",type:"warn"});}
if(!patterns.length)patterns.push({text:"No patterns detected",type:"ok"});
const dist={lower:0,upper:0,digit:0,special:0};
for(const c of pw){
if(/[a-z]/.test(c))dist.lower++;
else if(/[A-Z]/.test(c))dist.upper++;
else if(/[0-9]/.test(c))dist.digit++;
else dist.special++;
}
score=Math.max(0,Math.min(100,score));
let label,color;
if(score<25){label="Very Weak";color="#ef4444";}
else if(score<50){label="Weak";color="#f97316";}
else if(score<70){label="Fair";color="#f59e0b";}
else if(score<90){label="Strong";color="#22c55e";}
else{label="Very Strong";color="#10b981";}
const crackTimes=[
{scenario:"Online (100/s)",time:formatTime(poolSize>0?Math.pow(poolSize,len)/100:0)},
{scenario:"Offline (1B/s)",time:formatTime(poolSize>0?Math.pow(poolSize,len)/1e9:0)},
{scenario:"Offline (10B/s)",time:formatTime(poolSize>0?Math.pow(poolSize,len)/1e10:0)},
{scenario:"Offline (100B/s)",time:formatTime(poolSize>0?Math.pow(poolSize,len)/1e11:0)}
];
const suggestions=[];
if(!hasUpper)suggestions.push("Add uppercase letters");
if(!hasLower)suggestions.push("Add lowercase letters");
if(!hasDigit)suggestions.push("Add numbers");
if(!hasSpecial)suggestions.push("Add special characters (!@#$%^&*)");
if(len<12)suggestions.push("Make password at least 12 characters");
if(patterns.some(p=>p.type==="warn"))suggestions.push("Avoid keyboard patterns and repeated characters");
return{score,label,color,entropy,dist,patterns,crackTimes,suggestions};
}
function formatTime(s){
if(s>1e15)return"> billion years";
if(s>1e12)return"~"+(s/3.15e10).toFixed(0)+"k years";
if(s>1e9)return"~"+(s/3.15e7).toFixed(0)+" years";
if(s>3.15e7)return"~"+(s/3.15e7).toFixed(1)+" years";
if(s>86400)return"~"+(s/86400).toFixed(0)+" days";
if(s>3600)return"~"+(s/3600).toFixed(1)+" hours";
if(s>60)return"~"+(s/60).toFixed(1)+" minutes";
return"~"+s.toFixed(1)+" seconds";
}
function render(result){
const r=document.getElementById("results");
if(!result){r.innerHTML='<div class="empty">Enter a password to see analysis</div>';return;}
r.innerHTML=`
<div class="score-label"><div><div class="score-num" style="color:${r&&r.querySelector?result.color:""}">${result.score}</div></div><div class="score-text">${result.label}</div></div>
<div class="meter"><div class="fill" style="width:${result.score}%;background:${result.color}"></div></div>
<div class="stats-grid">
<div class="stat"><div class="label">Entropy</div><div class="value mono">${result.entropy.toFixed(1)} bits</div></div>
<div class="stat"><div class="label">Length</div><div class="value mono">${result.entropy>0?document.getElementById("password").value.length:0} chars</div></div>
<div class="stat"><div class="label">Lowercase</div><div class="value">${result.dist.lower}</div></div>
<div class="stat"><div class="label">Uppercase</div><div class="value">${result.dist.upper}</div></div>
<div class="stat"><div class="label">Digits</div><div class="value">${result.dist.digit}</div></div>
<div class="stat"><div class="label">Special</div><div class="value">${result.dist.special}</div></div>
</div>
<div class="crack-scenarios"><div class="field-label" style="margin-bottom:8px">Crack Time Estimates</div>
${result.crackTimes.map(c=>`<div class="crack-row"><span class="scenario">${c.scenario}</span><span class="time">${c.time}</span></div>`).join("")}
</div>
<div class="pattern-list"><div class="field-label" style="margin-bottom:6px">Pattern Detection</div>
${result.patterns.map(p=>`<span class="pattern-tag ${p.type}">${p.text}</span>`).join("")}
</div>
${result.suggestions.length?`<div class="suggestions"><div class="field-label" style="margin-bottom:6px">Suggestions</div>
${result.suggestions.map(s=>`<div class="suggestion">${s}</div>`).join("")}</div>`:""}
`;
document.querySelector(".score-num").style.color=result.color;
}
document.getElementById("password").addEventListener("input",e=>render(analyze(e.target.value)));
</script>
</body>
</html>
