*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
.header{text-align:center;padding:30px 0;border-bottom:1px solid #222;margin-bottom:30px}
.header h1{font-size:2rem;font-weight:600;margin-bottom:10px}
.header a{color:#737373;text-decoration:none;font-size:0.9rem;transition:color .2s}
.header a:hover{color:#fff}
.search-wrap{max-width:600px;margin:0 auto 30px}
.search{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;font-family:'Outfit',sans-serif;font-size:1rem;outline:none;transition:border .2s}
.search:focus{border-color:#444}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.tab{padding:6px 12px;border-radius:6px;border:1px solid #222;background:#111;color:#737373;cursor:pointer;font-size:1.2rem;transition:all .2s}
.tab.active,.tab:hover{background:#222;color:#fff;border-color:#444}
.cat-title{font-size:1.1rem;font-weight:600;padding:10px 16px;background:#111;border:1px solid #222;border-radius:8px 8px 0 0;margin-bottom:0}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;padding:16px;background:#111;border:1px solid #222;border-top:none;border-radius:0 0 8px 8px;margin-bottom:20px}
.emoji-cell{background:#1a1a1a;border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:all .2s;border:1px solid transparent}
.emoji-cell:hover{background:#252525;border-color:#333;transform:scale(1.05)}
.emoji-cell.copied{background:#1a3a1a;border-color:#81c784}
.emoji{font-size:2rem;line-height:1.2;display:block}
.emoji-name{font-size:0.65rem;color:#737373;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emoji-code{font-size:0.6rem;color:#555;font-family:monospace;margin-top:2px}
.toast{position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:12px 20px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000}
.toast.show{opacity:1}
.count{text-align:center;color:#737373;font-size:0.85rem;margin-bottom:20px}
@media(max-width:600px){.emoji-grid{grid-template-columns:repeat(auto-fill,minmax(65px,1fr))}.emoji{font-size:1.6rem}}
</style>

let activeTab='Smileys';
function renderTabs(){
const t=document.getElementById('tabs');t.innerHTML='';
data.forEach(g=>{const b=document.createElement('button');b.className=`tab ${activeTab===g.cat?'active':''}`;b.textContent=g.icon;b.title=g.cat;b.onclick=()=>{activeTab=g.cat;renderTabs();render()};t.appendChild(b)});
}
function render(filter=''){
const c=document.getElementById('container');c.innerHTML='';
const cats=activeTab?data.filter(g=>g.cat===activeTab):data;
let total=0;
cats.forEach(g=>{
const f=g.emojis.filter(i=>!filter||i.n.toLowerCase().includes(filter.toLowerCase())||i.e.includes(filter));
if(!f.length)return;total+=f.length;
const sec=document.createElement('div');
sec.innerHTML=`<div class="cat-title">${g.icon} ${g.cat} <span style="color:#737373;font-size:0.8rem">${f.length}</span></div><div class="emoji-grid"></div>`;
c.appendChild(sec);
const grid=sec.querySelector('.emoji-grid');
f.forEach(i=>{
const el=document.createElement('div');el.className='emoji-cell';
el.innerHTML=`<span class="emoji">${i.e}</span><div class="emoji-name">${i.n}</div><div class="emoji-code">${i.c}</div>`;
el.onclick=()=>{navigator.clipboard.writeText(i.e);el.classList.add('copied');showToast('Copied '+i.e+' '+i.n);setTimeout(()=>el.classList.remove('copied'),500)};
grid.appendChild(el);
});
});
document.getElementById('count').textContent=total+' emojis';
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
document.getElementById('search').oninput=e=>render(e.target.value);
renderTabs();render();
</script>
