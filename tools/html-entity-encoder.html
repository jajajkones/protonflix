<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Entity Encoder / Decoder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#ec4899;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.toolbar{padding:16px 40px;display:flex;gap:12px;border-bottom:1px solid var(--border)}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.container{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0}
.pane{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.pane:last-child{border-right:none}
.pane-header{padding:12px 20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
textarea{flex:1;background:var(--bg);color:var(--text);border:none;padding:20px;font-family:var(--mono);font-size:14px;line-height:1.6;resize:none;outline:none}
.output{flex:1;padding:20px;font-family:var(--mono);font-size:14px;line-height:1.6;overflow:auto;white-space:pre-wrap;word-break:break-word}
.entities-table{width:100%;margin-top:20px;border-collapse:collapse}
.entities-table td{padding:6px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12px;cursor:pointer;transition:background .2s}
.entities-table td:hover{background:var(--surface)}
@media(max-width:768px){.container{grid-template-columns:1fr}.pane{min-height:40vh}.pane:last-child{border-top:1px solid var(--border)}}
</style>
</head>
<body>
<header><h1>HTML Entity Encoder / Decoder</h1><a href="index.html">← Back to Tools</a></header>
<div class="toolbar">
<button class="btn primary" onclick="encode()" aria-label="Encode text to HTML entities">Encode</button>
<button class="btn primary" onclick="decode()" aria-label="Decode HTML entities to text">Decode</button>
<button class="btn" onclick="encodeAll()" aria-label="Encode all characters including non-ASCII">Encode All</button>
<button class="btn" onclick="copyOutput()" aria-label="Copy output to clipboard">Copy</button>
<button class="btn" onclick="clearAll()" aria-label="Clear input and output">Clear</button>
</div>
<div class="container">
<div class="pane">
<div class="pane-header">Input</div>
<textarea id="input" placeholder="Enter text or HTML entities..." spellcheck="false" aria-label="Input text for HTML entity encoding or decoding"></textarea>
</div>
<div class="pane">
<div class="pane-header">Output</div>
<div class="output" id="output"></div>
</div>
</div>
<script>
const entities={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;',' ':'&nbsp;','©':'&copy;','®':'&reg;','™':'&trade;','€':'&euro;','£':'&pound;','¥':'&yen;','°':'&deg;','±':'&plusmn;','×':'&times;','÷':'&divide;','µ':'&micro;','¶':'&para;','§':'&sect;','†':'&dagger;','‡':'&Dagger;','•':'&bull;','…':'&hellip;','→':'&rarr;','←':'&larr;','↔':'&harr;'};
const reverseEntities=Object.fromEntries(Object.entries(entities).map(([k,v])=>[v,k]));
function encode(){const t=document.getElementById('input').value;let r='';for(const c of t){r+=entities[c]||c}document.getElementById('output').textContent=r}
function encodeAll(){const t=document.getElementById('input').value;let r='';for(const c of t){const code=c.charCodeAt(0);r+=code>127?`&#${code};`:(entities[c]||c)}document.getElementById('output').textContent=r}
function decode(){const t=document.getElementById('input').value;let r=t;for(const[entity,char]of Object.entries(reverseEntities).sort((a,b)=>b[0].length-a[0].length)){r=r.split(entity).join(char)}r=r.replace(/&#(\d+);/g,(m,c)=>String.fromCharCode(+c));r=r.replace(/&#x([0-9a-f]+);/gi,(m,c)=>String.fromCharCode(parseInt(c,16)));document.getElementById('output').textContent=r}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent).then(()=>{const b=document.querySelector('[onclick="copyOutput()"]');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1500)})}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').textContent=''}
</script>
</body>
</html>
