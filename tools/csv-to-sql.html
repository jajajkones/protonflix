<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV to SQL Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;padding:20px}
.header{max-width:1100px;margin:0 auto 24px;display:flex;align-items:center;gap:12px}
.header a{color:#6ee7b7;text-decoration:none;font-weight:500;font-size:14px}
.header a:hover{text-decoration:underline}
.header h1{font-size:22px;font-weight:600;color:#fff}
.container{max-width:1100px;margin:0 auto}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:24px;margin-bottom:20px}
.card h2{font-size:16px;font-weight:600;margin-bottom:16px;color:#6ee7b7}
label{display:block;font-size:13px;color:#999;margin-bottom:6px;font-weight:500}
textarea,input[type="text"]{width:100%;padding:12px 14px;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#e0e0e0;font-family:'Outfit',monospace;font-size:13px;outline:none;resize:vertical;transition:border-color .2s;line-height:1.6}
textarea:focus,input:focus{border-color:#6ee7b7}
textarea{min-height:200px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:#6ee7b7;color:#0a0a0a;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:600;font-size:14px;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:6px}
.btn-outline{background:transparent;color:#6ee7b7;border:1px solid #6ee7b7}
.btn-outline:hover{background:rgba(110,231,183,.1)}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 16px;background:#0a0a0a;border:1px solid #222;border-radius:6px;color:#999;font-size:13px;font-family:'Outfit',sans-serif;cursor:pointer;font-weight:500;transition:all .2s}
.tab.active{background:#6ee7b7;color:#0a0a0a;border-color:#6ee7b7}
.tab:hover:not(.active){border-color:#444;color:#fff}
.output-wrap{position:relative}
.output-actions{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.preview-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.preview-table th,.preview-table td{padding:8px 12px;border:1px solid #222;text-align:left}
.preview-table th{background:#1a1a1a;color:#6ee7b7;font-weight:600}
.preview-table td{color:#ccc}
.preview-table tr:nth-child(even){background:#0d0d0d}
.copied{position:fixed;top:20px;right:20px;background:#6ee7b7;color:#0a0a0a;padding:10px 20px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;transition:opacity .3s;z-index:999}
.copied.show{opacity:1}
.table-name-input{display:inline-block;width:200px;margin-left:10px}
@media(max-width:600px){.table-name-input{width:140px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<a href="index.html">&larr; Back</a>
<h1>CSV to SQL Converter</h1>
</div>

<div class="card">
<h2>Paste CSV Data</h2>
<textarea id="csvInput" placeholder="name,email,age&#10;John,john@example.com,30&#10;Jane,jane@example.com,25"></textarea>
<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
<button class="btn" onclick="parseCSV()">Convert</button>
<label>Table Name:</label>
<input type="text" id="tableName" value="my_table" class="table-name-input" style="width:200px;padding:8px 12px;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#fff;font-family:'Outfit',sans-serif;font-size:13px">
</div>
</div>

<div class="card" id="previewCard" style="display:none">
<h2>CSV Preview</h2>
<div style="overflow-x:auto" id="previewTable"></div>
</div>

<div class="card" id="outputCard" style="display:none">
<h2>Output</h2>
<div class="tabs" id="tabs">
<div class="tab active" data-tab="mysql" onclick="switchTab('mysql')">MySQL INSERT</div>
<div class="tab" data-tab="postgres" onclick="switchTab('postgres')">PostgreSQL</div>
<div class="tab" data-tab="sqlite" onclick="switchTab('sqlite')">SQLite</div>
<div class="tab" data-tab="create" onclick="switchTab('create')">CREATE TABLE</div>
<div class="tab" data-tab="update" onclick="switchTab('update')">UPDATE</div>
<div class="tab" data-tab="json" onclick="switchTab('json')">CSV to JSON</div>
</div>
<div class="output-actions">
<button class="btn btn-sm" onclick="copyOutput()">Copy</button>
<button class="btn btn-sm btn-outline" onclick="downloadOutput()">Download</button>
</div>
<div class="output-wrap">
<textarea id="outputArea" rows="20" readonly></textarea>
</div>
</div>
</div>

<div class="copied" id="copiedMsg">Copied!</div>

<script>
let parsedHeaders=[];
let parsedRows=[];
let currentTab='mysql';

function parseCSVLine(line){
const result=[];let current='';let inQuotes=false;
for(let i=0;i<line.length;i++){
const c=line[i];
if(inQuotes){
if(c==='"'){if(i+1<line.length&&line[i+1]==='"'){current+='"';i++}else{inQuotes=false}}
else{current+=c}
}else{
if(c==='"'){inQuotes=true}
else if(c===','){result.push(current);current=''}
else{current+=c}
}
}
result.push(current);
return result;
}

function parseCSV(){
const raw=document.getElementById('csvInput').value.trim();
if(!raw){alert('Paste CSV data first');return}
const lines=raw.split('\n');
parsedHeaders=parseCSVLine(lines[0]);
parsedRows=[];
for(let i=1;i<lines.length;i++){
const l=lines[i].trim();
if(l)parsedRows.push(parseCSVLine(l));
}
let tableHTML='<table class="preview-table"><thead><tr>';
parsedHeaders.forEach(h=>{tableHTML+=`<th>${h}</th>`});
tableHTML+='</tr></thead><tbody>';
parsedRows.forEach(row=>{
tableHTML+='<tr>';
row.forEach(cell=>{tableHTML+=`<td>${cell}</td>`});
tableHTML+='</tr>';
});
tableHTML+='</tbody></table>';
document.getElementById('previewTable').innerHTML=tableHTML;
document.getElementById('previewCard').style.display='block';
document.getElementById('outputCard').style.display='block';
generateOutput();
}

function detectType(values){
let isNum=true;let isInt=true;let isDate=true;
for(const v of values){
const t=v.trim();
if(t===''||t==='NULL')continue;
if(isNaN(Number(t)))isNum=false;
if(isInt&&(t!==String(parseInt(t))||t.includes('.')))isInt=false;
if(!/^\d{4}-\d{2}-\d{2}/.test(t))isDate=false;
}
if(isInt)return'INT';if(isNum)return'DECIMAL';if(isDate)return'DATE';return'VARCHAR(255)';
}

function escapeMySQL(v){return v==='NULL'||v===''?'NULL':`'${v.replace(/'/g,"''")}'`}
function escapePG(v){return v==='NULL'||v===''?'NULL':`'${v.replace(/'/g,"''")}'`}
function escapeSQLite(v){return v==='NULL'||v===''?'NULL':`'${v.replace(/'/g,"''")}'`}

function generateCreateTable(){
const tn=document.getElementById('tableName').value||'my_table';
let sql=`CREATE TABLE ${tn} (\n`;
parsedHeaders.forEach((h,i)=>{
const vals=parsedRows.map(r=>r[i]||'');
sql+=`  ${h.replace(/[^a-zA-Z0-9_]/g,'_')} ${detectType(vals)}`;
if(i<parsedHeaders.length-1)sql+=',';
sql+='\n';
});
sql+=');';return sql;
}

function generateInsert(dialect){
const tn=document.getElementById('tableName').value||'my_table';
const esc=dialect==='mysql'?escapeMySQL:dialect==='postgres'?escapePG:escapeSQLite;
let sql='';
parsedRows.forEach(row=>{
const vals=row.map(c=>esc(c));
sql+=`INSERT INTO ${tn} (${parsedHeaders.join(', ')}) VALUES (${vals.join(', ')});\n`;
});
return sql.trim();
}

function generateUpdate(){
const tn=document.getElementById('tableName').value||'my_table';
let sql='';
parsedRows.forEach((row,idx)=>{
sql+=`UPDATE ${tn} SET `;
sql+=parsedHeaders.map((h,ci)=>`${h}=${escapeMySQL(row[ci]||'')}`).join(', ');
sql+=` WHERE id=${idx+1};\n`;
});
return sql.trim();
}

function generateJSON(){
return JSON.stringify(parsedRows.map(row=>{
const obj={};parsedHeaders.forEach((h,i)=>{obj[h]=row[i]||''});return obj;
}),null,2);
}

function switchTab(tab){
currentTab=tab;
document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t.dataset.tab===tab)});
generateOutput();
}

function generateOutput(){
const outputs={mysql:generateInsert('mysql'),postgres:generateInsert('postgres'),sqlite:generateInsert('sqlite'),create:generateCreateTable(),update:generateUpdate(),json:generateJSON()};
document.getElementById('outputArea').value=outputs[currentTab]||'';
}

function copyOutput(){
navigator.clipboard.writeText(document.getElementById('outputArea').value).then(()=>{const m=document.getElementById('copiedMsg');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),1500)});
}

function downloadOutput(){
const ext={mysql:'.sql',postgres:'.sql',sqlite:'.sql',create:'.sql',update:'.sql',json:'.json'};
const blob=new Blob([document.getElementById('outputArea').value],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download=`${document.getElementById('tableName').value||'output'}${ext[currentTab]||'.txt'}`;
a.click();URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
