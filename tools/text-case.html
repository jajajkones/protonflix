<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Case Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#8b5cf6;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:800px;width:100%;margin:0 auto}
textarea{width:100%;height:200px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-size:15px;line-height:1.6;resize:vertical;outline:none}
textarea:focus{border-color:#444}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:16px}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:10px;border-radius:var(--radius);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s;text-align:center}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.output{margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;font-size:15px;line-height:1.6;min-height:100px;white-space:pre-wrap;word-break:break-word;position:relative}
.copy-btn{position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:var(--radius);font-size:11px;cursor:pointer;opacity:0;transition:opacity .2s}
.output:hover .copy-btn{opacity:1}
</style>
</head>
<body>
<header><h1>Text Case Converter</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<textarea id="input" placeholder="Enter text to transform..." oninput="autoConvert()">hello world this is a SAMPLE TEXT for testing case conversions.</textarea>
<div class="btn-grid">
<button class="btn" onclick="convert('upper')">UPPERCASE</button>
<button class="btn" onclick="convert('lower')">lowercase</button>
<button class="btn" onclick="convert('title')">Title Case</button>
<button class="btn" onclick="convert('sentence')">Sentence case</button>
<button class="btn" onclick="convert('toggle')">tOGGLE cASE</button>
<button class="btn" onclick="convert('camel')">camelCase</button>
<button class="btn" onclick="convert('pascal')">PascalCase</button>
<button class="btn" onclick="convert('snake')">snake_case</button>
<button class="btn" onclick="convert('kebab')">kebab-case</button>
<button class="btn" onclick="convert('dot')">dot.case</button>
<button class="btn" onclick="convert('path')">path/case</button>
<button class="btn" onclick="convert('constant')">CONSTANT_CASE</button>
<button class="btn" onclick="convert('reverse')">reverse text</button>
<button class="btn" onclick="convert('slug')">slugify</button>
<button class="btn" onclick="convert('trim')">trim whitespace</button>
<button class="btn" onclick="convert('dedup')">remove duplicates</button>
<button class="btn" onclick="convert('sort')">sort lines</button>
<button class="btn" onclick="convert('reverseLines')">reverse lines</button>
</div>
<div class="output" id="output"><button class="copy-btn" onclick="copyOutput()">Copy</button><span id="outputText"></span></div>
</div>
<script>
function convert(type){
const t=document.getElementById('input').value;
let r='';
switch(type){
case'upper':r=t.toUpperCase();break;
case'lower':r=t.toLowerCase();break;
case'title':r=t.replace(/\w\S*/g,w=>w[0].toUpperCase()+w.slice(1).toLowerCase());break;
case'sentence':r=t.toLowerCase().replace(/(^\s*|[.!?]\s+)(\w)/g,(m,p,c)=>p+c.toUpperCase());break;
case'toggle':r=[...t].map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('');break;
case'camel':r=t.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(_,c)=>c.toUpperCase());break;
case'pascal':r=t.toLowerCase().replace(/(^|[^a-zA-Z0-9]+)(.)/g,(_,p,c)=>c.toUpperCase());break;
case'snake':r=t.toLowerCase().replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'');break;
case'kebab':r=t.toLowerCase().replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'');break;
case'dot':r=t.toLowerCase().replace(/[^a-zA-Z0-9]+/g,'.').replace(/^\.|\.$/g,'');break;
case'path':r=t.toLowerCase().replace(/[^a-zA-Z0-9]+/g,'/').replace(/^\/|\/$/g,'');break;
case'constant':r=t.toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'');break;
case'reverse':r=[...t].reverse().join('');break;
case'slug':r=t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');break;
case'trim':r=t.replace(/\s+/g,' ').trim();break;
case'dedup':r=[...new Set(t.split('\n'))].join('\n');break;
case'sort':r=t.split('\n').sort().join('\n');break;
case'reverseLines':r=t.split('\n').reverse().join('\n');break;
}
document.getElementById('outputText').textContent=r;
}
function autoConvert(){convert('lower')}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('outputText').textContent)}
convert('lower');
</script>
</body>
</html>
