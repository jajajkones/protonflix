<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#ef4444;--radius:6px;--mono:'SF Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tabs{display:flex;gap:4px;margin-bottom:40px}
.tab{background:var(--surface);color:var(--muted);border:1px solid var(--border);padding:8px 20px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.tab.active{color:var(--text);border-color:var(--accent)}
.clock{position:relative;width:300px;height:300px;margin-bottom:40px}
.clock svg{transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:4}
.clock .bg{stroke:var(--border)}
.clock .progress{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.time-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:56px;font-weight:300;letter-spacing:4px}
.label-display{position:absolute;top:50%;left:50%;transform:translate(-50%,20px);font-size:13px;color:var(--muted)}
.controls{display:flex;gap:16px}
.btn{padding:14px 32px;border-radius:var(--radius);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:none;transition:all .2s}
.btn-start{background:var(--accent);color:#fff}
.btn-reset{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.btn:hover{opacity:.8}
.sessions{margin-top:30px;display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--border);transition:background .3s}
.dot.done{background:var(--accent)}
.dot.active{background:var(--text)}
.settings{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.setting{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.setting input{width:50px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:4px 8px;font-family:var(--mono);font-size:12px;text-align:center;outline:none}

@media(max-width:768px){header{padding:20px 16px}header h1{font-size:16px}.content{padding:20px 16px}.container{padding:16px}}
</style>
</head>
<body>
<header style="position:fixed;top:0;left:0;right:0;padding:16px 24px;background:#0a0a0a;border-bottom:1px solid #222;display:flex;align-items:center;gap:16px;z-index:100">
<a href="index.html" style="color:#737373;text-decoration:none;font-size:13px;transition:color .2s">← Back to Tools</a>
<h1 style="font-size:16px;font-weight:500">Pomodoro Timer</h1>
</header>
<div class="tabs" style="margin-top:60px">
<div class="tab active" onclick="setMode('work')">Focus (25m)</div>
<div class="tab" onclick="setMode('short')">Short Break (5m)</div>
<div class="tab" onclick="setMode('long')">Long Break (15m)</div>
</div>
<div class="clock">
<svg width="300" height="300"><circle class="bg" cx="150" cy="150" r="140"/><circle class="progress" id="progress" cx="150" cy="150" r="140" stroke-dasharray="879.6" stroke-dashoffset="0"/></svg>
<div class="time-display" id="display">25:00</div>
<div class="label-display" id="modeLabel">Focus</div>
</div>
<div class="controls">
<button class="btn btn-start" id="startBtn" onclick="toggle()">Start</button>
<button class="btn btn-reset" onclick="reset()">Reset</button>
</div>
<div class="sessions" id="sessions"></div>
<div class="settings">
<div class="setting">Focus: <input type="number" id="workMin" value="25" min="1" max="60" onchange="reset()"></div>
<div class="setting">Short: <input type="number" id="shortMin" value="5" min="1" max="30" onchange="reset()"></div>
<div class="setting">Long: <input type="number" id="longMin" value="15" min="1" max="60" onchange="reset()"></div>
</div>
<script>
let mode='work',running=false,interval=null,time=25*60,total=25*60,sessions=0,completed=0;
const circumference=2*Math.PI*140;
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i==={work:0,short:1,long:2}[m]));const mins={work:+document.getElementById('workMin').value,short:+document.getElementById('shortMin').value,long:+document.getElementById('longMin').value}[m];time=mins*60;total=mins*60;document.getElementById('modeLabel').textContent={work:'Focus',short:'Short Break',long:'Long Break'}[m];updateDisplay()}
function toggle(){if(running){clearInterval(interval);running=false;document.getElementById('startBtn').textContent='Start'}else{interval=setInterval(()=>{time--;updateDisplay();if(time<=0){clearInterval(interval);running=false;playSound();if(mode==='work'){completed++;if(completed%4===0)setMode('long');else setMode('short')}else{setMode('work')}updateSessions()}},1000);running=true;document.getElementById('startBtn').textContent='Pause'}}
function reset(){clearInterval(interval);running=false;const mins={work:+document.getElementById('workMin').value,short:+document.getElementById('shortMin').value,long:+document.getElementById('longMin').value}[mode];time=mins*60;total=mins*60;updateDisplay();document.getElementById('startBtn').textContent='Start'}
function updateDisplay(){const m=Math.floor(time/60);const s=time%60;document.getElementById('display').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;const pct=time/total;document.getElementById('progress').style.strokeDashoffset=circumference*(1-pct);document.title=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} - Pomodoro`}
function updateSessions(){document.getElementById('sessions').innerHTML=Array.from({length:4},(_, i)=>`<div class="dot ${i<completed%4||completed>=4&&i<4?'done':''} ${i===completed%4?'active':''}"></div>`).join('')}
function playSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,0.2,0.4].forEach(delay=>{const o=ctx.createOscillator();o.frequency.value=880;o.connect(ctx.destination);o.start(ctx.currentTime+delay);o.stop(ctx.currentTime+delay+0.15)})}catch(e){}}
updateSessions();updateDisplay();
</script>
</body>
</html>
