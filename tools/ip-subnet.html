<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Subnet Calculator - ProtonFlix Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c0c0c;color:#e5e5e5;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
a{color:#e5e5e5;text-decoration:none;opacity:.6;transition:opacity .2s}
a:hover{opacity:1}
.header{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.header h1{font-size:1.5rem;font-weight:600}
.card{background:#141414;border:1px solid #262626;border-radius:12px;padding:24px;margin-bottom:16px}
label{display:block;font-size:.875rem;color:#737373;margin-bottom:6px}
.row{display:flex;gap:12px;align-items:flex-end}
.row .field{flex:1}
input[type="text"],input[type="number"]{width:100%;background:#1a1a1a;border:1px solid #262626;border-radius:8px;padding:10px 14px;color:#e5e5e5;font-size:.95rem;outline:none;transition:border-color .2s}
input[type="text"]:focus,input[type="number"]:focus{border-color:#555}
.btn{background:#e5e5e5;color:#0c0c0c;border:none;border-radius:8px;padding:10px 24px;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:12px}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.results{display:none}
.field-group{margin-bottom:14px}
.field-label{font-size:.75rem;color:#737373;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.field-value{font-size:.95rem;font-family:monospace}
.field-value.mono{background:#1a1a1a;padding:8px 12px;border-radius:6px;word-break:break-all}
.class-badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:.8rem;font-weight:600;margin-top:4px}
.class-badge.a{background:#1e3a5f;color:#60a5fa}
.class-badge.b{background:#166534;color:#4ade80}
.class-badge.c{background:#78350f;color:#fbbf24}
.class-badge.d{background:#7f1d1d;color:#fca5a5}
.class-badge.e{background:#581c87;color:#c084fc}
.subnet-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.8rem}
.subnet-table th{text-align:left;padding:6px 10px;background:#1a1a1a;color:#737373;font-weight:500;border-bottom:1px solid #262626}
.subnet-table td{padding:6px 10px;border-bottom:1px solid #1a1a1a;font-family:monospace}
.subnet-table tr:hover td{background:#1a1a1a}
.binary-row{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.binary-row .bit{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-family:monospace;border-radius:3px;background:#1a1a1a;border:1px solid #262626}
.binary-row .bit.net{background:#1e3a5f;border-color:#2563eb}
.binary-row .bit.host{background:#166534;border-color:#22c55e}
.subnets-wrap{max-height:400px;overflow-y:auto;border:1px solid #262626;border-radius:8px}
.note{background:#1a1a1a;border:1px solid #262626;border-radius:8px;padding:14px;font-size:.8rem;color:#737373;line-height:1.6;margin-top:16px}
.note strong{color:#e5e5e5}
.empty{text-align:center;color:#737373;padding:40px;font-size:.9rem}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#141414}
::-webkit-scrollbar-thumb{background:#262626;border-radius:3px}
</style>
</head>
<body>
<div class="container">
<a href="index.html" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:16px">&larr; Back</a>
<div class="header"><h1>IP Subnet Calculator</h1></div>
<div class="card">
<div class="row">
<div class="field" style="flex:3">
<label for="ip">IP Address</label>
<input type="text" id="ip" placeholder="e.g. 192.168.1.0">
</div>
<div class="field" style="flex:1">
<label for="cidr">CIDR</label>
<input type="number" id="cidr" min="0" max="32" placeholder="24">
</div>
</div>
<button class="btn" onclick="calculate()">Calculate</button>
</div>
<div class="card results" id="results">
<div id="basicInfo"></div>
<div id="binaryInfo" style="margin-top:16px"></div>
<div id="subnetList" style="margin-top:16px"></div>
</div>
<div class="note"><strong>Note:</strong> For /16 networks, all possible /24 subnets are listed. The binary representation shows network bits in blue and host bits in green.</div>
</div>
<script>
function ip2int(ip){return ip.split(".").reduce((a,b)=>(a<<8)+parseInt(b),0)>>>0}
function int2ip(n){return[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join(".")}
function toBin(ip){return ip.split(".").map(o=>parseInt(o).toString(2).padStart(8,"0")).join(".")}
function calcClass(ip){
const first=parseInt(ip.split(".")[0]);
if(first>=1&&first<=126)return{cls:"A",range:"1.0.0.0 - 126.255.255.255",mask:"255.0.0.0"};
if(first>=128&&first<=191)return{cls:"B",range:"128.0.0.0 - 191.255.255.255",mask:"255.255.0.0"};
if(first>=192&&first<=223)return{cls:"C",range:"192.0.0.0 - 223.255.255.255",mask:"255.255.255.0"};
if(first>=224&&first<=239)return{cls:"D",range:"224.0.0.0 - 239.255.255.255",mask:"Multicast"};
return{cls:"E",range:"240.0.0.0 - 255.255.255.255",mask:"Reserved"};
}
function calculate(){
const ipStr=document.getElementById("ip").value.trim();
const cidr=parseInt(document.getElementById("cidr").value);
if(!ipStr||isNaN(cidr)||cidr<0||cidr>32)return;
const ip=ip2int(ipStr);
const mask=cidr===0?0:(0xFFFFFFFF<<(32-cidr))>>>0;
const network=(ip&mask)>>>0;
const broadcast=(network|~mask)>>>0;
const hosts=Math.pow(2,32-cidr)-2;
const first=network+1;
const last=broadcast-1;
const wildcard=(~mask)>>>0;
const cls=calcClass(ipStr);
const res=document.getElementById("results");
res.style.display="block";
document.getElementById("basicInfo").innerHTML=`
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="field-group"><div class="field-label">Network Address</div><div class="field-value mono">${int2ip(network)}</div></div>
<div class="field-group"><div class="field-label">Broadcast Address</div><div class="field-value mono">${int2ip(broadcast)}</div></div>
<div class="field-group"><div class="field-label">Subnet Mask</div><div class="field-value mono">${int2ip(mask)}</div></div>
<div class="field-group"><div class="field-label">Wildcard Mask</div><div class="field-value mono">${int2ip(wildcard)}</div></div>
<div class="field-group"><div class="field-label">Usable Hosts</div><div class="field-value">${hosts.toLocaleString()}</div></div>
<div class="field-group"><div class="field-label">Host Range</div><div class="field-value mono">${int2ip(first)} - ${int2ip(last)}</div></div>
<div class="field-group"><div class="field-label">CIDR Notation</div><div class="field-value mono">${int2ip(network)}/${cidr}</div></div>
<div class="field-group"><div class="field-label">IP Class</div><span class="class-badge ${cls.cls.toLowerCase()}">Class ${cls.cls}</span><div class="field-value" style="font-size:.8rem;color:#737373;margin-top:4px">${cls.range}</div></div>
</div>`;
const netBin=int2ip(network).split(".");
const hostBin=int2ip(network).split(".").map((_,i)=>{
const bits=parseInt(int2ip(mask).split(".")[i]);
return(255-bits).toString(2).padStart(8,"0");
}).join("");
document.getElementById("binaryInfo").innerHTML=`
<div class="field-label">Binary Representation (Network . Host)</div>
<div class="binary-row">${int2ip(network).split(".").flatMap((oct,i)=>{
const maskBits=parseInt(int2ip(mask).split(".")[i]);
const netBits=maskBits;
const hostBits=8-maskBits;
const parts=[];
for(let b=0;b<netBits;b++)parts.push(`<div class="bit net">${int2ip(network).split(".")[i][b%8]||"0"}</div>`);
for(let b=0;b<hostBits;b++)parts.push(`<div class="bit host">0</div>`);
return parts;
}).join("")}</div>
<div style="margin-top:6px;font-size:.75rem;color:#737373"><span style="color:#60a5fa">■</span> Network bits &nbsp; <span style="color:#4ade80">■</span> Host bits</div>`;
if(cidr>=16&&cidr<=24){
const subnets=[];
const count=Math.pow(2,24-cidr);
for(let i=0;i<count&&i<256;i++){
const subNet=(network+(i<<(24-cidr)))>>>0;
subnets.push({net:int2ip(subNet),bcast:int2ip((subNet|~mask)>>>0),first:int2ip((subNet+1)>>>0),last:int2ip(((subNet|~mask)>>>0)-1)});
}
document.getElementById("subnetList").innerHTML=`
<div class="field-label">Subnets (${subnets.length} shown)</div>
<div class="subnets-wrap"><table class="subnet-table"><thead><tr><th>#</th><th>Network</th><th>Broadcast</th><th>Host Range</th></tr></thead><tbody>
${subnets.map((s,i)=>`<tr><td>${i+1}</td><td>${s.net}</td><td>${s.bcast}</td><td>${s.first} - ${s.last}</td></tr>`).join("")}
</tbody></table></div>`;
}else{
document.getElementById("subnetList").innerHTML="";
}
}
document.getElementById("cidr").addEventListener("keydown",e=>{if(e.key==="Enter")calculate()});
document.getElementById("ip").addEventListener("keydown",e=>{if(e.key==="Enter")calculate()});
</script>
</body>
</html>
