<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#22c55e;--radius:6px;--mono:'SF Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}header h1{font-size:20px;font-weight:500}header a{color:var(--muted);text-decoration:none;font-size:13px}header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:600px;width:100%;margin:0 auto}
.tabs{display:flex;gap:4px;margin-bottom:24px}
.tab{background:var(--surface);color:var(--muted);border:1px solid var(--border);padding:8px 20px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.tab.active{color:var(--text);border-color:var(--accent)}
.input-row{display:flex;gap:12px;margin-bottom:16px}
.input-row input{flex:1;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:var(--mono);font-size:20px;outline:none;text-align:center}
.input-row input:focus{border-color:var(--accent)}
.result{text-align:center;padding:40px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:20px}
.bmi-val{font-size:64px;font-weight:300;font-family:var(--mono)}
.bmi-cat{font-size:18px;margin-top:8px}
.bmi-range{width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,#22c55e,#eab308,#f97316,#ef4444);margin-top:20px;position:relative}
.bmi-marker{width:4px;height:20px;background:#fff;border-radius:2px;position:absolute;top:-6px;transition:left .5s}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px;font-size:13px}
.info div{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.info .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body>
<header><h1>BMI Calculator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="tabs">
<div class="tab active" onclick="setUnit('metric')">Metric</div>
<div class="tab" onclick="setUnit('imperial')">Imperial</div>
</div>
<div id="metricInputs">
<div class="input-row"><label for="height" style="position:absolute;width:1px;height:1px;overflow:hidden">Height in cm</label><input type="number" id="height" placeholder="Height (cm)" value="175" oninput="calc()"></div>
<div class="input-row"><label for="weight" style="position:absolute;width:1px;height:1px;overflow:hidden">Weight in kg</label><input type="number" id="weight" placeholder="Weight (kg)" value="70" oninput="calc()"></div>
</div>
<div id="imperialInputs" style="display:none">
<div class="input-row"><label for="ft" style="position:absolute;width:1px;height:1px;overflow:hidden">Feet</label><input type="number" id="ft" placeholder="Feet" value="5" oninput="calc()"><label for="inch" style="position:absolute;width:1px;height:1px;overflow:hidden">Inches</label><input type="number" id="inch" placeholder="Inches" value="9" oninput="calc()"></div>
<div class="input-row"><label for="lbs" style="position:absolute;width:1px;height:1px;overflow:hidden">Pounds</label><input type="number" id="lbs" placeholder="Pounds" value="154" oninput="calc()"></div>
</div>
<div class="result" id="result"></div>
<div class="info" id="info"></div>
</div>
<script>
let unit='metric';
function setUnit(u){unit=u;document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===(u==='metric'?0:1)));document.getElementById('metricInputs').style.display=u==='metric'?'':'none';document.getElementById('imperialInputs').style.display=u==='imperial'?'':'none';calc()}
function calc(){
let bmi,h,w;
if(unit==='metric'){
h=+document.getElementById('height').value/100;w=+document.getElementById('weight').value;
}else{
const ft=+document.getElementById('ft').value;const inch=+document.getElementById('inch').value;w=+document.getElementById('lbs').value*0.453592;
h=(ft*12+inch)*0.0254;
}
if(!h||!w){document.getElementById('result').innerHTML='<div style="color:var(--muted);padding:20px">Please enter valid height and weight</div>';document.getElementById('info').innerHTML='';return;}
bmi=w/(h*h);
const cats=[{max:18.5,name:'Underweight',color:'#3b82f6'},{max:25,name:'Normal',color:'#22c55e'},{max:30,name:'Overweight',color:'#f59e0b'},{max:Infinity,name:'Obese',color:'#ef4444'}];
const cat=cats.find(c=>bmi<c.max);
const pct=Math.min(100,Math.max(0,(bmi-10)/40*100));
document.getElementById('result').innerHTML=`<div class="bmi-val" style="color:${cat.color}">${bmi.toFixed(1)}</div><div class="bmi-cat" style="color:${cat.color}">${cat.name}</div><div class="bmi-range"><div class="bmi-marker" style="left:${pct}%"></div></div>`;
const idealWmin=(18.5*h*h);const idealWmax=(25*h*h);
document.getElementById('info').innerHTML=`<div><div class="label">BMI Range</div>18.5 - 24.9 Normal</div><div><div class="label">Your Category</div><span style="color:${cat.color}">${cat.name}</span></div><div><div class="label">Ideal Weight</div>${idealWmin.toFixed(1)} - ${idealWmax.toFixed(1)} kg</div><div><div class="label">Weight to ${cat.name==='Normal'?'Maintain':'Normal'}</div>${bmi<18.5?`+${(idealWmin-w).toFixed(1)} kg`:bmi>25?`-${(w-idealWmax).toFixed(1)} kg`:'On target!'}</div>`;
}
calc();
</script>
</body>
</html>
