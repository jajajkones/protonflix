<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Token Generator</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c0c0c;color:#e5e5e5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:2rem;min-height:100vh}
a{color:#737373;text-decoration:none;font-size:.85rem;display:inline-block;margin-bottom:1.5rem}
a:hover{color:#e5e5e5}
h1{font-size:1.5rem;font-weight:600;margin-bottom:.25rem}
.sub{color:#737373;font-size:.85rem;margin-bottom:2rem}
.grid{display:grid;grid-template-columns:340px 1fr;gap:2rem}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
.card{background:#141414;border:1px solid #262626;border-radius:12px;padding:1.5rem}
.card h2{font-size:1rem;font-weight:600;margin-bottom:1rem}
label{display:block;font-size:.75rem;color:#737373;margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em}
input,select{width:100%;padding:.6rem .8rem;background:#1a1a1a;border:1px solid #262626;border-radius:8px;color:#e5e5e5;font-size:.9rem;font-family:inherit;outline:none}
input:focus,select:focus{border-color:#e5e5e5}
.row{display:flex;gap:.75rem;margin-bottom:1rem}
.row>div{flex:1}
button{padding:.5rem 1rem;border:1px solid #262626;border-radius:8px;background:#1a1a1a;color:#e5e5e5;font-size:.85rem;cursor:pointer;font-family:inherit}
button:hover{background:#262626}
button.primary{background:#e5e5e5;color:#0c0c0c;border-color:#e5e5e5}
button.primary:hover{background:#d4d4d4}
.btn-row{display:flex;gap:.5rem;margin-bottom:1rem}
.btn-row button{flex:1}
.color-preview{display:flex;gap:.5rem;margin:1rem 0}
.color-swatch{flex:1;height:50px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:rgba(255,255,255,.8);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.shade-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
.shade-swatch{width:32px;height:24px;border-radius:4px;border:1px solid #262626}
.shade-label{font-size:.75rem;width:50px;color:#737373}
.shade-hex{font-size:.75rem;font-family:monospace;width:70px}
.shade-name{font-size:.8rem;flex:1}
.output-tabs{display:flex;gap:0;margin-bottom:1rem;border:1px solid #262626;border-radius:8px;overflow:hidden}
.tab{flex:1;padding:.5rem;text-align:center;font-size:.8rem;cursor:pointer;background:#1a1a1a;border:none;color:#737373;font-family:inherit}
.tab.active{background:#262626;color:#e5e5e5}
.code-block{background:#1a1a1a;border:1px solid #262626;border-radius:8px;padding:1rem;font-family:'SF Mono',Consolas,monospace;font-size:.75rem;white-space:pre-wrap;max-height:500px;overflow-y:auto;position:relative;line-height:1.6}
.copy-btn{position:sticky;top:0;float:right;padding:.3rem .6rem;font-size:.7rem;background:#262626;border:1px solid #737373;border-radius:4px;color:#e5e5e5;cursor:pointer}
.copy-btn:hover{background:#333}
.gen-group{margin-bottom:1.5rem}
.gen-group h3{font-size:.85rem;font-weight:500;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
.gen-group h3 .dot{width:10px;height:10px;border-radius:50%}
</style>
</head>
<body>
<a href="index.html">&larr; Back</a>
<h1>Color Token Generator</h1>
<p class="sub">Generate design system color tokens from a brand color</p>
<div class="grid">
<div class="card">
<h2>Brand Color</h2>
<div class="row">
<div style="flex:2"><label>Hex Color</label><input type="text" id="brandColor" value="#6366f1" placeholder="#6366f1"></div>
<div style="flex:1"><label>&nbsp;</label><input type="color" id="colorPicker" value="#6366f1" style="height:38px;padding:4px;cursor:pointer"></div>
</div>
<label>Secondary Color (optional)</label>
<div class="row" style="margin-bottom:1.5rem">
<div style="flex:2"><input type="text" id="secColor" value="#8b5cf6" placeholder="#8b5cf6"></div>
<div style="flex:1"><input type="color" id="secPicker" value="#8b5cf6" style="height:38px;padding:4px;cursor:pointer"></div>
</div>
<div class="btn-row">
<button class="primary" id="generateBtn">Generate Tokens</button>
</div>
<h2>Brand Palette</h2>
<div class="color-preview" id="brandPreview"></div>
<h2>Secondary Palette</h2>
<div class="color-preview" id="secPreview"></div>
<h2>Functional Colors</h2>
<div class="color-preview" id="funcPreview"></div>
<div id="shadeList"></div>
</div>
<div class="card">
<h2>Output</h2>
<div class="output-tabs">
<button class="tab active" data-tab="css">CSS Variables</button>
<button class="tab" data-tab="tailwind">Tailwind</button>
<button class="tab" data-tab="json">JSON</button>
</div>
<div class="code-block"><button class="copy-btn" id="copyBtn">Copy</button><pre id="codeOutput"></pre></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const hexToHSL=h=>{let r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h2,s,l=(max+min)/2;if(max===min)h2=s=0;else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h2=((g-b)/d+(g<b?6:0))/6;break;case g:h2=((b-r)/d+2)/6;break;case b:h2=((r-g)/d+4)/6}}return[Math.round(h2*360),Math.round(s*100),Math.round(l*100)]};
const hslToHex=(h,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return`#${f(0)}${f(8)}${f(4)}`};
const genShades=hex=>{const [h,s,l]=hexToHSL(hex);const shades=[50,100,200,300,400,500,600,700,800,900,950];const map={50:95,100:90,200:82,300:70,400:55,500:l,600:Math.max(l-12,15),700:Math.max(l-24,12),800:Math.max(l-34,10),900:Math.max(l-42,8),950:Math.max(l-50,5)};return shades.map(sh=>({shade:sh,color:hslToHex(h,s,map[sh]||l)}))};
let currentTab='css',tokens={};
$('colorPicker').oninput=e=>{$('brandColor').value=e.target.value};
$('brandColor').oninput=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value))$('colorPicker').value=e.target.value};
$('secPicker').oninput=e=>{$('secColor').value=e.target.value};
$('secColor').oninput=e=>{if(/^#[0-9a-f]{6}$/i.test(e.target.value))$('secPicker').value=e.target.value};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');currentTab=t.dataset.tab;renderOutput()});
const renderSwatches=()=>{
  const colors={primary:tokens.primary,secondary:tokens.secondary,success:tokens.success,warning:tokens.warning,error:tokens.error,info:tokens.info};
  ['brand','sec','func'].forEach(g=>{
    const el=$(g+'Preview');el.innerHTML='';
    const list=g==='brand'?['primary']:g==='sec'?['secondary']:['success','warning','error','info'];
    list.forEach(name=>{const s=colors[name];if(!s)return;const mid=s.find(x=>x.shade===500);el.innerHTML+=`<div class="color-swatch" style="background:${mid.color}">${name}</div>`})
  });
  const listEl=$('shadeList');listEl.innerHTML='';
  Object.entries(tokens).forEach(([name,shades])=>{
    listEl.innerHTML+=`<div class="gen-group"><h3><span class="dot" style="background:${shades.find(s=>s.shade===500)?.color}"></span>${name}</h3>${shades.map(s=>`<div class="shade-row"><div class="shade-swatch" style="background:${s.color}"></div><div class="shade-label">${s.shade}</div><div class="shade-hex">${s.color}</div></div>`).join('')}</div>`
  });
};
const renderOutput=()=>{
  let out='';
  if(currentTab==='css'){out=':root {\n';Object.entries(tokens).forEach(([n,sh])=>{sh.forEach(s=>out+=`  --color-${n}-${s.shade}: ${s.color};\n`)});out+='}'}
  else if(currentTab==='tailwind'){out='module.exports = {\n  theme: {\n    extend: {\n      colors: {\n';Object.entries(tokens).forEach(([n,sh])=>{out+=`        '${n}': {\n`;sh.forEach(s=>out+=`          ${s.shade}: '${s.color}',\n`);out+='        },\n'});out+='      }\n    }\n  }\n}'}
  else{const obj={};Object.entries(tokens).forEach(([n,sh])=>{obj[n]={};sh.forEach(s=>obj[n][s.shade]=s.color)});out=JSON.stringify(obj,null,2)}
  $('codeOutput').textContent=out;
};
$('generateBtn').onclick=()=>{
  const brand=$('brandColor').value,sec=$('secColor').value;
  tokens.primary=genShades(brand);tokens.secondary=genShades(sec);
  const [bh]=hexToHSL(brand);
  tokens.success=genShades(hslToHex((bh+120)%360,65,45));
  tokens.warning=genShades(hslToHex((bh+40)%360,80,50));
  tokens.error=genShades(hslToHex(0,72,51));
  tokens.info=genShades(hslToHex((bh+200)%360,65,50));
  renderSwatches();renderOutput();
};
$('copyBtn').onclick=()=>{navigator.clipboard.writeText($('codeOutput').textContent);$('copyBtn').textContent='Copied!';setTimeout(()=>$('copyBtn').textContent='Copy',1500)};
$('generateBtn').click();
</script>
</body>
</html>
