<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to Base64</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#f59e0b;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:900px;width:100%;margin:0 auto}
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:60px;text-align:center;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(245,158,11,0.05)}
.drop-zone p{font-size:16px;color:var(--muted);margin-bottom:12px}
.drop-zone .small{font-size:12px;color:var(--border)}
.preview{margin-top:24px;display:none}
.preview img{max-width:300px;border-radius:var(--radius);border:1px solid var(--border)}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.info-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.info-item .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.info-item .value{font-family:var(--mono);font-size:13px}
.output{margin-top:16px;display:none}
.output textarea{width:100%;height:150px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:var(--mono);font-size:12px;resize:vertical;outline:none}
.output label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:8px}
.actions{display:flex;gap:8px;margin-top:12px}
.btn{background:var(--accent);color:#000;border:none;padding:8px 16px;border-radius:var(--radius);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-outline{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius);font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:#444}
</style>
</head>
<body>
<header><h1>Image to Base64</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="drop-zone" id="dropZone">
<p>Drop an image here or click to select</p>
<div class="small">Supports JPG, PNG, GIF, SVG, WebP</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
</div>
<div class="preview" id="preview"><img id="previewImg"></div>
<div class="info" id="info"></div>
<div class="output" id="outputSection">
<label>Base64 Output</label>
<textarea id="base64Output" readonly></textarea>
<div class="actions">
<button class="btn" onclick="copyB64()">Copy Base64</button>
<button class="btn-outline" onclick="downloadHTML()">Download HTML</button>
<button class="btn-outline" onclick="reset()">Reset</button>
</div>
</div>
</div>
<script>
const dz=document.getElementById('dropZone'),fi=document.getElementById('fileInput');
dz.onclick=()=>fi.click();
dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragover')};
dz.ondragleave=()=>dz.classList.remove('dragover');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragover');handleFile(e.dataTransfer.files[0])};
fi.onchange=()=>handleFile(fi.files[0]);
function handleFile(file){
if(!file||!file.type.startsWith('image/'))return;
const reader=new FileReader();
reader.onload=()=>{
const b64=reader.result;
document.getElementById('base64Output').value=b64;
document.getElementById('previewImg').src=b64;
document.getElementById('preview').style.display='block';
document.getElementById('outputSection').style.display='block';
const img=new Image();
img.onload=()=>{
document.getElementById('info').innerHTML=`
<div class="info-item"><div class="label">File Name</div><div class="value">${file.name}</div></div>
<div class="info-item"><div class="label">File Size</div><div class="value">${formatSize(file.size)}</div></div>
<div class="info-item"><div class="label">Type</div><div class="value">${file.type}</div></div>
<div class="info-item"><div class="label">Dimensions</div><div class="value">${img.width} × ${img.height}</div></div>
<div class="info-item"><div class="label">Base64 Length</div><div class="value">${b64.length.toLocaleString()} chars</div></div>
<div class="info-item"><div class="label">Base64 Size</div><div class="value">${formatSize(b64.length * 0.75)}</div></div>`;
};
img.src=b64;
};
reader.readAsDataURL(file);
}
function formatSize(b){if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB'}
function copyB64(){navigator.clipboard.writeText(document.getElementById('base64Output').value)}
function downloadHTML(){const html=`<img src="${document.getElementById('base64Output').value}" alt="Base64 Image">`;const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='image.html';a.click()}
function reset(){dz.style.display='';document.getElementById('preview').style.display='none';document.getElementById('outputSection').style.display='none';document.getElementById('info').innerHTML='';fi.value=''}
</script>
</body>
</html>
