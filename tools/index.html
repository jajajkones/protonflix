<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevTools Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;--text:#fff;--muted:#737373;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hero{text-align:center;padding:80px 40px 40px}
.hero h1{font-size:48px;font-weight:700;letter-spacing:-1.5px;margin-bottom:12px}
.hero h1 span{background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:16px;color:var(--muted);max-width:500px;margin:0 auto}
.search{max-width:500px;margin:30px auto 0;position:relative}
.search input{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:50px;padding:14px 20px 14px 44px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s}
.search input:focus{border-color:#444}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.categories{max-width:1200px;margin:0 auto;padding:20px 40px 80px}
.category{margin-bottom:40px}
.category h2{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:16px;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tool{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-decoration:none;color:var(--text);transition:all .2s;display:flex;flex-direction:column;gap:8px}
.tool:hover{border-color:#444;transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.tool .icon{font-size:24px;margin-bottom:4px}
.tool .name{font-size:15px;font-weight:500}
.tool .desc{font-size:13px;color:var(--muted);line-height:1.4}
.tool .tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:10px;color:var(--muted);margin-top:4px;width:fit-content}
footer{text-align:center;padding:40px;color:#333;font-size:12px;text-transform:uppercase;letter-spacing:2px;border-top:1px solid var(--border)}
@media(max-width:768px){.hero{padding:60px 20px 20px}.hero h1{font-size:32px}.categories{padding:20px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<h1><span>DevTools</span> Hub</h1>
<p>75+ free, fast, and privacy-first browser tools for developers. No sign-up, no tracking.</p>
<div class="search">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
<input type="text" id="searchInput" placeholder="Search tools..." oninput="filterTools()">

</div>
<div class="categories" id="categories"></div>
<footer>Data never leaves your browser. All tools run locally.</footer>

function render(filter=''){
const cats={};
tools.forEach(t=>{
const match=!filter||t.name.toLowerCase().includes(filter)||t.desc.toLowerCase().includes(filter)||t.tags.some(tag=>tag.includes(filter));
if(!match)return;
if(!cats[t.cat])cats[t.cat]=[];
cats[t.cat].push(t);
});
const el=document.getElementById('categories');
el.innerHTML=Object.entries(cats).map(([cat,items])=>`
<div class="category"><h2>${cat}</h2><div class="grid">
${items.map(t=>`<a class="tool" href="${t.file}"><div class="icon">${t.icon}</div><div class="name">${t.name}</div><div class="desc">${t.desc}</div></a>`).join('')}
</div></div>`).join('');
}
function filterTools(){render(document.getElementById('searchInput').value.toLowerCase())}
render();
