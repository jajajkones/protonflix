<head>
<meta charset="UTF-8">

<title>ProtonFlix Tools — 200+ Developer Utilities</title>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;--surface:#18181b;--surface-2:#27272a;--border:#2e2e32;
  --text:#fafafa;--text-secondary:#a1a1aa;--text-muted:#52525b;
  --accent:#f59e0b;--accent-dim:rgba(245,158,11,.12);
  --radius:8px;
  --font:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono','SF Mono','Fira Code',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--accent);color:#000}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* LAYOUT */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
@media(max-width:768px){.shell{grid-template-columns:1fr}.sidebar{display:none}}

/* SIDEBAR */
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--border);padding:24px 0;
  display:flex;flex-direction:column;
}
.sidebar-brand{padding:0 20px;margin-bottom:32px}
.sidebar-brand h1{font-size:15px;font-weight:700;letter-spacing:-.02em}
.sidebar-brand span{color:var(--accent)}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:1px;padding:0 8px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:var(--radius);font-size:13px;
  color:var(--text-secondary);cursor:pointer;transition:all .15s;
  text-decoration:none;border:none;background:none;width:100%;text-align:left;font-family:inherit;
}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);font-weight:600}
.nav-item .icon{width:18px;text-align:center;font-size:12px;opacity:.7}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--text-muted);font-family:var(--mono)}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);margin-top:auto}
.sidebar-footer p{font-size:11px;color:var(--text-muted);line-height:1.6}

/* MAIN */
.main{padding:32px 40px;max-width:1100px}
@media(max-width:768px){.main{padding:20px 16px}}

/* HEADER */
.page-header{margin-bottom:32px}
.page-header h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.page-header p{font-size:13px;color:var(--text-secondary)}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:28px}
.search-input{
  width:100%;padding:10px 14px 10px 36px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);font-size:13px;font-family:var(--font);
  outline:none;transition:border-color .2s;
}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text-muted)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.search-kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:10px;font-family:var(--mono);color:var(--text-muted);
  background:var(--surface-2);padding:2px 6px;border-radius:4px;border:1px solid var(--border);
}

/* TOOL LIST */
.tool-section{margin-bottom:32px}
.tool-section-title{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-muted);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:8px;
}
.tool-grid{display:flex;flex-direction:column;gap:2px}
.tool-row{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  padding:10px 12px;border-radius:var(--radius);cursor:pointer;
  text-decoration:none;color:inherit;transition:background .15s;
}
.tool-row:hover{background:var(--surface)}
.tool-row-left{display:flex;align-items:center;gap:12px;min-width:0}
.tool-icon{
  width:32px;height:32px;min-width:32px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;font-family:var(--mono);
  background:var(--surface-2);color:var(--text-secondary);
  border:1px solid var(--border);transition:all .15s;
}
.tool-row:hover .tool-icon{border-color:var(--accent);color:var(--accent)}
.tool-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-desc{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool-tag{
  font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500;
  background:var(--surface-2);color:var(--text-muted);white-space:nowrap;
}
.tool-new{
  font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);margin-left:6px;
}
.no-results{text-align:center;padding:60px 0;color:var(--text-muted);font-size:13px;display:none}
.no-results.show{display:block}
.no-results strong{display:block;font-size:16px;color:var(--text);margin-bottom:4px}
@media(max-width:768px){
  .tool-grid{gap:0}
  .tool-desc{display:none}
  .tool-tag{display:none}
}
</style>

const CAT_ICONS = {
  "Text & String":"T","Encoding":"< >","Conversion":"⇄","Design":"◆",
  "Code":"/","API & Auth":"⚡","Developer Tools":"⚙","DevOps & Network":"☁",
  "Media & Utilities":"◎"
};

let activeCat = null;
const search = document.getElementById('search');
const toolList = document.getElementById('toolList');
const noResults = document.getElementById('noResults');
const sidebarNav = document.getElementById('sidebarNav');
const pageTitle = document.getElementById('pageTitle');
const pageDesc = document.getElementById('pageDesc');

function totalCount(){return Object.values(TOOLS).reduce((a,c)=>a+Object.keys(c).length,0)}

function buildSidebar(){
  let html = `<button class="nav-item active" data-cat="all"><span class="icon">◎</span>All Tools<span class="count">${totalCount()}</span></button>`;
  Object.keys(TOOLS).forEach(cat=>{
    html += `<button class="nav-item" data-cat="${cat}"><span class="icon">${CAT_ICONS[cat]||'·'}</span>${cat}<span class="count">${Object.keys(TOOLS[cat]).length}</span></button>`;
  });
  sidebarNav.innerHTML = html;
  sidebarNav.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      sidebarNav.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat === 'all' ? null : btn.dataset.cat;
      renderTools();
    });
  });
}

function renderTools(){
  const q = search.value.toLowerCase().trim();
  let html = '';
  let total = 0;
  const cats = activeCat ? [activeCat] : Object.keys(TOOLS);

  cats.forEach(cat => {
    const tools = TOOLS[cat];
    const entries = Object.entries(tools).filter(([file,t])=>{
      if(!q) return true;
      return t.n.toLowerCase().includes(q) || t.d.toLowerCase().includes(q) || file.includes(q);
    });
    if(!entries.length) return;
    total += entries.length;

    html += `<div class="tool-section"><div class="tool-section-title">${cat} — ${entries.length}</div><div class="tool-grid">`;
    entries.forEach(([file, t])=>{
      html += `<a href="${file}.html" class="tool-row">
        <div class="tool-row-left">
          <div class="tool-icon">${t.i}</div>
          <div><div class="tool-name">${t.n}${t.new?'<span class="tool-new">new</span>':''}</div><div class="tool-desc">${t.d}</div></div>
        </div>
        <span class="tool-tag">${cat.split(' ')[0]}</span>
      </a>`;
    });
    html += '</div></div>';
  });

  toolList.innerHTML = html;
  noResults.classList.toggle('show', total === 0);
  pageTitle.textContent = activeCat || 'All Tools';
  pageDesc.textContent = activeCat ? `${total} tools in this category` : `${totalCount()} tools across ${Object.keys(TOOLS).length} categories`;
}

document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement!==search){e.preventDefault();search.focus()}
  if(e.key==='Escape') search.blur();
});
search.addEventListener('input', renderTools);

buildSidebar();
renderTools();
</script>
