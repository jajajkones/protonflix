<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary / Text Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#06b6d4;--radius:6px;--mono:'SF Mono',Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}header h1{font-size:20px;font-weight:500}header a{color:var(--muted);text-decoration:none;font-size:13px}header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:800px;width:100%;margin:0 auto}
textarea{width:100%;height:100px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:var(--mono);font-size:14px;resize:vertical;outline:none}
.btn-row{display:flex;gap:8px;margin:12px 0}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444}
.output{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:var(--mono);font-size:14px;min-height:60px;white-space:pre-wrap;word-break:break-all;cursor:pointer}
.output:hover{border-color:#444}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.grid .output{min-height:120px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
</style>
</head>
<body>
<header><h1>Binary / Text Converter</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<textarea id="input" placeholder="Enter text or binary (space-separated bytes)..." oninput="convert()">Hello World</textarea>
<div class="btn-row">
<button class="btn" onclick="convert('text2bin')">Text → Binary</button>
<button class="btn" onclick="convert('bin2text')">Binary → Text</button>
<button class="btn" onclick="convert('text2hex')">Text → Hex</button>
<button class="btn" onclick="convert('hex2text')">Hex → Text</button>
<button class="btn" onclick="convert('text2ascii')">Text → ASCII Codes</button>
<button class="btn" onclick="convert('ascii2text')">ASCII → Text</button>
<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('output').textContent)">Copy</button>
</div>
<div class="label">Output</div>
<div class="output" id="output"></div>
<div class="grid">
<div><div class="label">Binary (8-bit)</div><div class="output" id="bin8"></div></div>
<div><div class="label">Hex Dump</div><div class="output" id="hexdump"></div></div>
</div>
</div>
<script>
function convert(mode){
const input=document.getElementById('input').value;let output='';
switch(mode){
case'text2bin':output=[...input].map(c=>c.charCodeAt(0).toString(2).padStart(8,'0')).join(' ');break;
case'bin2text':try{output=input.trim().split(/\s+/).map(b=>String.fromCharCode(parseInt(b,2))).join('')}catch(e){output='Error: '+e.message}break;
case'text2hex':output=[...input].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0').toUpperCase()).join(' ');break;
case'hex2text':try{output=input.trim().replace(/0x/g,'').split(/\s+/).map(h=>String.fromCharCode(parseInt(h,16))).join('')}catch(e){output='Error: '+e.message}break;
case'text2ascii':output=[...input].map(c=>c.charCodeAt(0)).join(' ');break;
case'ascii2text':try{output=input.trim().split(/\s+/).map(n=>String.fromCharCode(+n)).join('')}catch(e){output='Error: '+e.message}break;
default:output=[...input].map(c=>c.charCodeAt(0).toString(2).padStart(8,'0')).join(' ');
}
document.getElementById('output').textContent=output;
document.getElementById('bin8').textContent=[...input].map(c=>`${c}: ${c.charCodeAt(0).toString(2).padStart(8,'0')}`).join('\n');
document.getElementById('hexdump').textContent=[...input].map(c=>`${c.charCodeAt(0).toString(16).padStart(2,'0').toUpperCase()} ${c}`).join('\n');
}
convert('text2bin');
</script>
</body>
</html>
