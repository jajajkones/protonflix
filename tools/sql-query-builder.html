<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Query Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;padding:20px}
.header{max-width:1200px;margin:0 auto 20px;display:flex;align-items:center;gap:15px}
.header a{color:#60a5fa;text-decoration:none;font-size:14px;font-weight:500;transition:color .2s}
.header a:hover{color:#93c5fd}
.header h1{font-size:22px;font-weight:600;color:#fff}
.container{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:#111;border:1px solid #222;border-radius:12px;padding:20px}
.panel h2{font-size:16px;font-weight:600;margin-bottom:15px;color:#fff}
label{display:block;font-size:13px;color:#999;margin-bottom:5px;font-weight:500}
select,input[type="text"],textarea{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px 12px;color:#fff;font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
select:focus,input:focus,textarea:focus{border-color:#60a5fa}
textarea{resize:vertical;min-height:80px;font-family:'Fira Code',monospace;font-size:13px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:500;font-size:13px;cursor:pointer;transition:all .2s}
.btn-primary{background:#60a5fa;color:#000}.btn-primary:hover{background:#93c5fd}
.btn-secondary{background:#333;color:#fff}.btn-secondary:hover{background:#444}
.btn-success{background:#22c55e;color:#000}.btn-success:hover{background:#4ade80}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#f87171}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.form-group{margin-bottom:12px}
.dialect-tabs{display:flex;gap:8px;margin-bottom:15px}
.dialect-tab{padding:6px 14px;background:#1a1a1a;border:1px solid #333;border-radius:20px;color:#ccc;font-size:12px;cursor:pointer;transition:all .2s;font-family:'Outfit',sans-serif}
.dialect-tab:hover,.dialect-tab.active{background:#60a5fa;color:#000;border-color:#60a5fa}
.condition-row{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:8px}
.condition-row select,.condition-row input{width:auto;display:inline-block}
.col-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.col-chip{padding:4px 10px;background:#1a1a1a;border:1px solid #333;border-radius:15px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s}
.col-chip:hover,.col-chip.active{background:#60a5fa;color:#000;border-color:#60a5fa}
.col-chip .remove{cursor:pointer;font-weight:bold;margin-left:2px}
.preview{background:#0d0d0d;border:1px solid #222;border-radius:8px;padding:15px;font-family:'Fira Code',monospace;font-size:13px;white-space:pre-wrap;line-height:1.6;color:#e0e0e0;min-height:300px;overflow:auto}
.join-section{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
@media(max-width:900px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <a href="index.html">← Back</a>
  <h1>SQL Query Builder</h1>
</div>
<div class="container">
  <div class="panel">
    <h2>Query Builder</h2>
    <div class="dialect-tabs" id="dialectTabs">
      <div class="dialect-tab active" data-dialect="mysql">MySQL</div>
      <div class="dialect-tab" data-dialect="postgresql">PostgreSQL</div>
      <div class="dialect-tab" data-dialect="sqlite">SQLite</div>
    </div>
    <div class="form-group">
      <label>Operation</label>
      <select id="operation">
        <option value="SELECT">SELECT</option>
        <option value="INSERT">INSERT</option>
        <option value="UPDATE">UPDATE</option>
        <option value="DELETE">DELETE</option>
      </select>
    </div>
    <div class="form-group">
      <label>Table Name</label>
      <input type="text" id="tableName" placeholder="e.g. users">
    </div>
    <div class="form-group" id="columnsSection">
      <label>Columns</label>
      <div style="display:flex;gap:6px">
        <input type="text" id="colInput" placeholder="Add column and press Enter" style="flex:1">
        <button class="btn btn-secondary btn-sm" onclick="addColumn()">Add</button>
      </div>
      <div class="col-chips" id="columnsChips"></div>
    </div>
    <div class="form-group" id="insertValuesSection" style="display:none">
      <label>Values (one per line: column=value)</label>
      <textarea id="insertValues" rows="4" placeholder="name='John'&#10;email='john@example.com'&#10;age=30"></textarea>
    </div>
    <div class="form-group">
      <label>WHERE Conditions</label>
      <div id="whereConditions"></div>
      <button class="btn btn-secondary btn-sm" onclick="addWhereCondition()" style="margin-top:6px">+ Add Condition</button>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>ORDER BY</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="orderBy" placeholder="e.g. name ASC" style="flex:1">
        </div>
      </div>
      <div class="form-group">
        <label>GROUP BY</label>
        <input type="text" id="groupBy" placeholder="e.g. department">
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>HAVING</label>
        <input type="text" id="having" placeholder="e.g. COUNT(*) > 5">
      </div>
      <div class="form-group">
        <label>LIMIT</label>
        <input type="text" id="limit" placeholder="e.g. 100">
      </div>
    </div>
    <div class="form-group">
      <label>JOINs</label>
      <div id="joinsContainer"></div>
      <button class="btn btn-secondary btn-sm" onclick="addJoin()" style="margin-top:6px">+ Add JOIN</button>
    </div>
    <div class="form-group">
      <label>DISTINCT</label>
      <input type="checkbox" id="distinct" style="accent-color:#60a5fa">
    </div>
  </div>
  <div class="panel">
    <h2>Generated SQL</h2>
    <div class="btn-group" style="margin-bottom:15px">
      <button class="btn btn-success" onclick="copyQuery()">Copy</button>
      <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
    </div>
    <div class="preview" id="preview"></div>
  </div>
</div>
<script>
let columns = [];
let conditions = [];
let joins = [];
let dialect = 'mysql';
let conditionId = 0;
let joinId = 0;

document.querySelectorAll('.dialect-tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.dialect-tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    dialect = this.dataset.dialect;
    generatePreview();
  });
});

document.getElementById('operation').addEventListener('change', function() {
  const op = this.value;
  document.getElementById('columnsSection').style.display = op === 'DELETE' ? 'none' : 'block';
  document.getElementById('insertValuesSection').style.display = op === 'INSERT' ? 'block' : 'none';
  generatePreview();
});

document.querySelectorAll('input, textarea, select').forEach(el => {
  el.addEventListener('input', generatePreview);
  el.addEventListener('change', generatePreview);
});

document.getElementById('colInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); addColumn(); }
});

function addColumn() {
  const input = document.getElementById('colInput');
  const val = input.value.trim();
  if (val && !columns.includes(val)) {
    columns.push(val);
    renderColumns();
    input.value = '';
    generatePreview();
  }
}

function removeColumn(col) {
  columns = columns.filter(c => c !== col);
  renderColumns();
  generatePreview();
}

function renderColumns() {
  const container = document.getElementById('columnsChips');
  container.innerHTML = columns.map(c => `<div class="col-chip active">${c}<span class="remove" onclick="removeColumn('${c}')">&times;</span></div>`).join('');
}

function addWhereCondition() {
  const id = conditionId++;
  conditions.push({ id, column: '', op: '=', value: '', logic: 'AND' });
  renderConditions();
}

function renderConditions() {
  const container = document.getElementById('whereConditions');
  container.innerHTML = conditions.map((c, i) => `
    <div class="condition-row">
      <select onchange="updateCondition(${c.id},'logic',this.value)" style="width:60px;margin-right:6px">
        <option value="AND" ${c.logic==='AND'?'selected':''}>AND</option>
        <option value="OR" ${c.logic==='OR'?'selected':''}>OR</option>
      </select>
      <input type="text" placeholder="Column" value="${c.column}" onchange="updateCondition(${c.id},'column',this.value)" style="width:120px;margin-right:6px">
      <select onchange="updateCondition(${c.id},'op',this.value)" style="width:80px;margin-right:6px">
        <option value="=" ${c.op==='='?'selected':''}>=</option>
        <option value="!=" ${c.op==='!='?'selected':''}>!=</option>
        <option value=">" ${c.op==='>'?'selected':''}>&gt;</option>
        <option value="<" ${c.op==='<'?'selected':''}>&lt;</option>
        <option value=">=" ${c.op==='>='?'selected':''}>&gt;=</option>
        <option value="<=" ${c.op==='<='?'selected':''}>&lt;=</option>
        <option value="LIKE" ${c.op==='LIKE'?'selected':''}>LIKE</option>
        <option value="NOT LIKE" ${c.op==='NOT LIKE'?'selected':''}>NOT LIKE</option>
        <option value="IN" ${c.op==='IN'?'selected':''}>IN</option>
        <option value="NOT IN" ${c.op==='NOT IN'?'selected':''}>NOT IN</option>
        <option value="IS NULL" ${c.op==='IS NULL'?'selected':''}>IS NULL</option>
        <option value="IS NOT NULL" ${c.op==='IS NOT NULL'?'selected':''}>IS NOT NULL</option>
        <option value="BETWEEN" ${c.op==='BETWEEN'?'selected':''}>BETWEEN</option>
      </select>
      <input type="text" placeholder="Value" value="${c.value}" onchange="updateCondition(${c.id},'value',this.value)" style="width:120px;margin-right:6px">
      <button class="btn btn-danger btn-sm" onclick="removeCondition(${c.id})">&times;</button>
    </div>
  `).join('');
}

function updateCondition(id, field, val) {
  const c = conditions.find(x => x.id === id);
  if (c) { c[field] = val; generatePreview(); }
}

function removeCondition(id) {
  conditions = conditions.filter(c => c.id !== id);
  renderConditions();
  generatePreview();
}

function addJoin() {
  const id = joinId++;
  joins.push({ id, type: 'INNER', table: '', on: '' });
  renderJoins();
}

function renderJoins() {
  const container = document.getElementById('joinsContainer');
  container.innerHTML = joins.map(j => `
    <div class="join-section">
      <div style="display:flex;gap:6px;align-items:center">
        <select onchange="updateJoin(${j.id},'type',this.value)" style="width:120px">
          <option value="INNER" ${j.type==='INNER'?'selected':''}>INNER JOIN</option>
          <option value="LEFT" ${j.type==='LEFT'?'selected':''}>LEFT JOIN</option>
          <option value="RIGHT" ${j.type==='RIGHT'?'selected':''}>RIGHT JOIN</option>
          <option value="FULL OUTER" ${j.type==='FULL OUTER'?'selected':''}>FULL OUTER JOIN</option>
          <option value="CROSS" ${j.type==='CROSS'?'selected':''}>CROSS JOIN</option>
          <option value="LEFT OUTER" ${j.type==='LEFT OUTER'?'selected':''}>LEFT OUTER JOIN</option>
        </select>
        <input type="text" placeholder="Table" value="${j.table}" onchange="updateJoin(${j.id},'table',this.value)" style="width:120px">
        <span style="color:#999;font-size:12px">ON</span>
        <input type="text" placeholder="a.id = b.id" value="${j.on}" onchange="updateJoin(${j.id},'on',this.value)" style="flex:1">
        <button class="btn btn-danger btn-sm" onclick="removeJoin(${j.id})">&times;</button>
      </div>
    </div>
  `).join('');
}

function updateJoin(id, field, val) {
  const j = joins.find(x => x.id === id);
  if (j) { j[field] = val; generatePreview(); }
}

function removeJoin(id) {
  joins = joins.filter(j => j.id !== id);
  renderJoins();
  generatePreview();
}

function generatePreview() {
  const op = document.getElementById('operation').value;
  const table = document.getElementById('tableName').value.trim() || 'table_name';
  const orderBy = document.getElementById('orderBy').value.trim();
  const groupBy = document.getElementById('groupBy').value.trim();
  const having = document.getElementById('having').value.trim();
  const limit = document.getElementById('limit').value.trim();
  const distinct = document.getElementById('distinct').checked;
  let sql = '';

  if (op === 'SELECT') {
    const cols = columns.length ? columns.join(', ') : '*';
    sql = `SELECT ${distinct ? 'DISTINCT ' : ''}${cols}\nFROM ${table}`;
  } else if (op === 'INSERT') {
    const vals = document.getElementById('insertValues').value.trim().split('\n').filter(Boolean);
    const cols = vals.map(v => v.split('=')[0].trim()).join(', ');
    const values = vals.map(v => v.split('=').slice(1).join('=').trim()).join(', ');
    sql = `INSERT INTO ${table} (${cols})\nVALUES (${values})`;
  } else if (op === 'UPDATE') {
    const vals = document.getElementById('insertValues').value.trim().split('\n').filter(Boolean);
    const setClauses = vals.map(v => v.trim()).join(',\n  ');
    sql = `UPDATE ${table}\nSET ${setClauses}`;
  } else if (op === 'DELETE') {
    sql = `DELETE FROM ${table}`;
  }

  joins.forEach(j => {
    if (j.table) sql += `\n${j.type} JOIN ${j.table} ON ${j.on || '...'}`;
  });

  const validConds = conditions.filter(c => c.column);
  if (validConds.length) {
    sql += '\nWHERE ';
    validConds.forEach((c, i) => {
      const prefix = i > 0 ? ` ${c.logic} ` : '';
      if (c.op === 'IS NULL' || c.op === 'IS NOT NULL') {
        sql += `${prefix}${c.column} ${c.op}`;
      } else if (c.op === 'BETWEEN') {
        sql += `${prefix}${c.column} BETWEEN ${c.value || '...'} AND ...`;
      } else if (c.op === 'IN' || c.op === 'NOT IN') {
        sql += `${prefix}${c.column} ${c.op} (${c.value || '...'})`;
      } else {
        sql += `${prefix}${c.column} ${c.op} '${c.value || '...'}'`;
      }
    });
  }

  if (groupBy) sql += `\nGROUP BY ${groupBy}`;
  if (having) sql += `\nHAVING ${having}`;
  if (orderBy) sql += `\nORDER BY ${orderBy}`;
  if (limit) sql += `\nLIMIT ${limit}`;

  document.getElementById('preview').textContent = sql;
}

function copyQuery() {
  navigator.clipboard.writeText(document.getElementById('preview').textContent);
  const btn = event.target; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500);
}

function clearAll() {
  columns = []; conditions = []; joins = [];
  document.querySelectorAll('input[type="text"], textarea').forEach(el => el.value = '');
  document.getElementById('operation').value = 'SELECT';
  document.getElementById('distinct').checked = false;
  document.getElementById('columnsSection').style.display = 'block';
  document.getElementById('insertValuesSection').style.display = 'none';
  renderColumns(); renderConditions(); renderJoins();
  generatePreview();
}

addWhereCondition();
generatePreview();
</script>
</body>
</html>
