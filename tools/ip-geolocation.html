<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Geolocation Lookup – ProtonFlix Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:'Outfit',sans-serif;min-height:100vh}
.header{padding:20px 32px;border-bottom:1px solid #222;display:flex;align-items:center;gap:16px}
.header a{color:#8b5cf6;text-decoration:none;font-weight:500;font-size:14px;transition:color .2s}
.header a:hover{color:#a78bfa}
.header h1{font-size:20px;font-weight:600;color:#fff}
.container{max-width:860px;margin:0 auto;padding:32px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:24px;margin-bottom:24px}
.card h2{font-size:16px;font-weight:600;margin-bottom:16px;color:#fff}
label{display:block;font-size:13px;color:#999;margin-bottom:6px;font-weight:500}
input[type=text],textarea{width:100%;padding:12px 14px;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#e0e0e0;font-family:'Outfit',sans-serif;font-size:14px;outline:none;transition:border .2s}
textarea{font-family:monospace;min-height:80px;resize:vertical}
input:focus,textarea:focus{border-color:#8b5cf6}
button{padding:10px 20px;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-primary{background:#8b5cf6;color:#fff}
.btn-primary:hover{background:#7c3aed}
.btn-secondary{background:#222;color:#e0e0e0;border:1px solid #333}
.btn-secondary:hover{background:#333}
.btn-group{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.result-item{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:14px}
.result-item .label{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.result-item .value{font-size:14px;color:#e0e0e0;font-weight:500;word-break:break-all}
.map-container{margin-top:16px;border-radius:8px;overflow:hidden;border:1px solid #222}
.map-container img{width:100%;display:block;height:300px;object-fit:cover}
.result-box{margin-top:16px;padding:16px;border-radius:8px;font-size:14px;font-weight:500}
.result-error{background:rgba(239,68,68,.1);border:1px solid #ef4444;color:#ef4444}
.result-success{background:rgba(34,197,94,.1);border:1px solid #22c55e;color:#22c55e}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preset-btn{padding:6px 12px;background:#1a1a2e;border:1px solid #333;border-radius:6px;color:#a78bfa;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.preset-btn:hover{background:#8b5cf6;color:#fff;border-color:#8b5cf6}
.output-box{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:14px;font-family:monospace;font-size:13px;color:#a78bfa;word-break:break-all;position:relative;margin-top:12px}
.copy-btn{position:absolute;top:8px;right:8px;padding:4px 10px;background:#333;border:1px solid #444;border-radius:4px;color:#ccc;font-size:11px;cursor:pointer;font-family:'Outfit',sans-serif}
.copy-btn:hover{background:#555}
.batch-results{max-height:400px;overflow-y:auto}
.batch-item{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:12px;margin-bottom:8px}
.batch-item .ip-label{color:#8b5cf6;font-weight:600;margin-bottom:6px}
.loading{color:#666;font-style:italic}
</style>
</head>
<body>
<div class="header">
  <a href="index.html">← Back</a>
  <h1>IP Geolocation Lookup</h1>
</div>
<div class="container">
  <div class="card">
    <h2>IP Address</h2>
    <input type="text" id="ipInput" placeholder="Enter IP address (e.g., 8.8.8.8)">
    <div class="presets">
      <button class="preset-btn" onclick="setIP('8.8.8.8')">Google DNS</button>
      <button class="preset-btn" onclick="setIP('1.1.1.1')">Cloudflare DNS</button>
      <button class="preset-btn" onclick="setIP('208.67.222.222')">OpenDNS</button>
      <button class="preset-btn" onclick="setIP('9.9.9.9')">Quad9 DNS</button>
      <button class="preset-btn" onclick="getMyIP()">My IP</button>
    </div>
    <div class="btn-group">
      <button class="btn-primary" onclick="lookupIP()">Lookup</button>
      <button class="btn-secondary" onclick="copyResults()">Copy JSON</button>
    </div>
  </div>

  <div class="card" id="batchCard">
    <h2>Batch Lookup</h2>
    <label>One IP per line</label>
    <textarea id="batchInput" placeholder="8.8.8.8&#10;1.1.1.1&#10;208.67.222.222"></textarea>
    <div class="btn-group">
      <button class="btn-primary" onclick="batchLookup()">Lookup All</button>
    </div>
    <div class="batch-results" id="batchResults"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h2>Results</h2>
    <div class="result-grid" id="resultGrid"></div>
    <div class="map-container" id="mapContainer" style="display:none">
      <img id="mapImage" src="" alt="Map">
    </div>
    <div class="output-box" id="rawJson" style="display:none">
      <button class="copy-btn" onclick="copyRawJson()">Copy</button>
      <span id="rawJsonValue"></span>
    </div>
  </div>

  <div class="result-box" id="statusMsg" style="display:none"></div>
</div>

<script>
let lastResults = null;

function setIP(ip) {
  document.getElementById('ipInput').value = ip;
}

async function getMyIP() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    document.getElementById('ipInput').value = data.ip;
    lookupIP();
  } catch (e) {
    showStatus('Could not determine your IP', 'error');
  }
}

function isValidIP(ip) {
  const v4 = /^(\d{1,3}\.){3}\d{1,3}$/;
  const v6 = /^([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$/;
  if (v4.test(ip)) {
    return ip.split('.').every(p => parseInt(p) <= 255);
  }
  return v6.test(ip);
}

async function lookupIP() {
  const ip = document.getElementById('ipInput').value.trim();
  if (!ip) {
    showStatus('Enter an IP address', 'error');
    return;
  }
  if (!isValidIP(ip)) {
    showStatus('Invalid IP address format', 'error');
    return;
  }

  try {
    const res = await fetch(`https://ipapi.co/${ip}/json/`);
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    if (data.error) throw new Error(data.reason || 'Lookup failed');
    lastResults = data;
    displayResults(data);
  } catch (e) {
    try {
      const res = await fetch(`https://ipwho.is/${ip}`);
      const data = await res.json();
      if (!data.success) throw new Error(data.message || 'Lookup failed');
      const mapped = {
        ip: data.ip,
        country: data.country,
        country_code: data.country_code,
        region: data.region,
        city: data.city,
        latitude: data.latitude,
        longitude: data.longitude,
        timezone: data.timezone?.id || data.timezone,
        org: data.connection?.org || '',
        isp: data.connection?.isp || '',
        asn: data.connection?.asn || '',
        postal: data.postal || ''
      };
      lastResults = mapped;
      displayResults(mapped);
    } catch (e2) {
      showStatus('Lookup failed: ' + e.message, 'error');
    }
  }
}

function displayResults(data) {
  document.getElementById('resultCard').style.display = 'block';
  const grid = document.getElementById('resultGrid');
  const fields = [
    { key: 'ip', label: 'IP Address' },
    { key: 'country', label: 'Country' },
    { key: 'country_code', label: 'Country Code' },
    { key: 'region', label: 'Region' },
    { key: 'city', label: 'City' },
    { key: 'postal', label: 'Postal Code' },
    { key: 'latitude', label: 'Latitude' },
    { key: 'longitude', label: 'Longitude' },
    { key: 'timezone', label: 'Timezone' },
    { key: 'isp', label: 'ISP' },
    { key: 'org', label: 'Organization' },
    { key: 'asn', label: 'ASN' }
  ];

  grid.innerHTML = fields.map(f => `
    <div class="result-item">
      <div class="label">${f.label}</div>
      <div class="value">${data[f.key] || 'N/A'}</div>
    </div>
  `).join('');

  if (data.latitude && data.longitude) {
    const mapContainer = document.getElementById('mapContainer');
    const mapImage = document.getElementById('mapImage');
    mapImage.src = `https://staticmap.openstreetmap.de/staticmap.php?center=${data.latitude},${data.longitude}&zoom=10&size=600x300&markers=${data.latitude},${data.longitude},red-pushpin`;
    mapContainer.style.display = 'block';
  }

  const rawJson = document.getElementById('rawJson');
  document.getElementById('rawJsonValue').textContent = JSON.stringify(data, null, 2);
  rawJson.style.display = 'block';
}

async function batchLookup() {
  const input = document.getElementById('batchInput').value.trim();
  if (!input) return;
  const ips = input.split('\n').map(l => l.trim()).filter(l => l);
  const resultsDiv = document.getElementById('batchResults');
  resultsDiv.innerHTML = ips.map(ip => `
    <div class="batch-item" id="batch-${ip.replace(/\./g, '-')}">
      <div class="ip-label">${ip}</div>
      <div class="loading">Looking up...</div>
    </div>
  `).join('');

  const allResults = [];
  for (const ip of ips) {
    try {
      const res = await fetch(`https://ipapi.co/${ip}/json/`);
      const data = await res.json();
      const el = document.getElementById(`batch-${ip.replace(/\./g, '-')}`);
      if (data.error) {
        el.innerHTML = `<div class="ip-label">${ip}</div><div style="color:#ef4444">Error: ${data.reason || 'Failed'}</div>`;
      } else {
        allResults.push(data);
        el.innerHTML = `
          <div class="ip-label">${ip}</div>
          <div style="font-size:13px;color:#ccc">${data.city || ''}, ${data.region || ''}, ${data.country || ''}</div>
          <div style="font-size:12px;color:#888;margin-top:4px">ISP: ${data.org || 'N/A'} | Timezone: ${data.timezone || 'N/A'}</div>
        `;
      }
    } catch (e) {
      const el = document.getElementById(`batch-${ip.replace(/\./g, '-')}`);
      el.innerHTML = `<div class="ip-label">${ip}</div><div style="color:#ef4444">Error: ${e.message}</div>`;
    }
  }
  lastResults = allResults;
}

function copyResults() {
  if (lastResults) {
    navigator.clipboard.writeText(JSON.stringify(lastResults, null, 2));
    showStatus('Copied to clipboard', 'success');
  }
}

function copyRawJson() {
  const text = document.getElementById('rawJsonValue').textContent;
  navigator.clipboard.writeText(text);
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.style.display = 'block';
  el.className = `result-box result-${type}`;
  el.textContent = msg;
  setTimeout(() => el.style.display = 'none', 3000);
}
</script>
</body>
</html>
