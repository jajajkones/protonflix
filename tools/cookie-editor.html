<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Editor - ProtonFlix Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
header{background:#111;border-bottom:1px solid #222;padding:16px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
header h1{font-size:1.3rem;font-weight:600}
header a{color:#737373;text-decoration:none;font-size:.9rem;transition:color .2s}
header a:hover{color:#fff}
.container{max-width:900px;margin:0 auto;padding:24px}
.btn{padding:8px 16px;border:1px solid #222;background:#111;color:#fff;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.85rem;transition:all .2s}
.btn:hover{background:#222}
.btn-danger{border-color:#ff4444;color:#ff4444}
.btn-danger:hover{background:#ff444420}
.btn-primary{background:#2563eb;border-color:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn-success{border-color:#22c55e;color:#22c55e}
.btn-success:hover{background:#22c55e20}
.warning-box{background:#ff444415;border:1px solid #ff444440;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:.85rem;color:#ff9999}
.warning-box strong{color:#ff4444}
.card{background:#111;border:1px solid #222;border-radius:8px;padding:16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.card-actions{display:flex;gap:6px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;padding:10px 12px;background:#0a0a0a;border-bottom:1px solid #222;color:#737373;font-weight:500}
td{padding:10px 12px;border-bottom:1px solid #1a1a1a;word-break:break-all}
tr:hover td{background:#111}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;background:#2563eb20;color:#60a5fa}
.tag.secure{background:#22c55e20;color:#22c55e}
.tag.http{background:#f59e0b20;color:#f59e0b}
.empty-state{text-align:center;padding:40px;color:#737373}
.modal-overlay{display:none;position:fixed;inset:0;background:#000000cc;z-index:200;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#111;border:1px solid #222;border-radius:12px;padding:24px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
.modal h2{font-size:1.1rem;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.8rem;color:#737373;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 12px;background:#0a0a0a;border:1px solid #222;border-radius:6px;color:#fff;font-family:inherit;font-size:.85rem}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#2563eb}
.checkbox-row{display:flex;align-items:center;gap:8px}
.checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:#2563eb}
.toast{position:fixed;bottom:24px;right:24px;background:#22c55e;color:#fff;padding:12px 20px;border-radius:8px;font-size:.85rem;z-index:300;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.copy-box{background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:12px;font-family:monospace;font-size:.8rem;word-break:break-all;position:relative;margin-top:12px}
.copy-box button{position:absolute;top:8px;right:8px}
pre{white-space:pre-wrap;font-family:monospace;font-size:.8rem}

@media(max-width:768px){header{padding:20px 16px}header h1{font-size:16px}.content{padding:20px 16px}.container{padding:16px}}
</style>
</head>
<body>
<header>
  <a href="index.html">← Back</a>
  <h1>🍪 Cookie Editor</h1>
</header>
<div class="container">
  <div class="warning-box">
    <strong>⚠ Limitation:</strong> JavaScript cannot access cookies marked as <code>httpOnly</code> or <code>secure</code> (when not on HTTPS). Some cookies set by the server may not appear here.
  </div>

  <div class="card">
    <div class="card-header">
      <h2 style="font-size:1rem">Cookies (<span id="cookieCount">0</span>)</h2>
      <div class="card-actions">
        <button class="btn btn-primary" onclick="openModal('add')">+ Add Cookie</button>
        <button class="btn" onclick="copyAllCookies()">📋 Copy String</button>
        <button class="btn btn-danger" onclick="deleteAllCookies()">🗑 Delete All</button>
      </div>
    </div>
    <div id="cookieList"></div>
    <div class="copy-box" id="cookieString" style="display:none">
      <button class="btn" onclick="copyCookieString()">Copy</button>
      <pre id="cookieStringContent"></pre>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add Cookie</h2>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="cookieName" placeholder="cookie_name">
    </div>
    <div class="form-group">
      <label>Value</label>
      <input type="text" id="cookieValue" placeholder="cookie_value">
    </div>
    <div class="form-group">
      <label>Domain</label>
      <input type="text" id="cookieDomain" placeholder="e.g. example.com (leave empty for current)">
    </div>
    <div class="form-group">
      <label>Path</label>
      <input type="text" id="cookiePath" value="/" placeholder="/">
    </div>
    <div class="form-group">
      <label>Expires (date-time)</label>
      <input type="datetime-local" id="cookieExpires">
    </div>
    <div class="form-group checkbox-row">
      <input type="checkbox" id="cookieSecure">
      <label style="margin:0">Secure (HTTPS only)</label>
    </div>
    <div class="form-group checkbox-row">
      <input type="checkbox" id="cookieSameSite" checked>
      <label style="margin:0">SameSite=Lax</label>
    </div>
    <div style="display:flex;gap:8px;margin-top:20px">
      <button class="btn btn-primary" onclick="saveCookie()">Save</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
let editingIndex = -1;

function parseCookies() {
  const raw = document.cookie;
  if (!raw) return [];
  return raw.split(';').map(c => {
    const [name, ...valParts] = c.trim().split('=');
    return { name: name.trim(), value: decodeURIComponent(valParts.join('=')), raw: c.trim() };
  });
}

function renderCookies() {
  const cookies = parseCookies();
  document.getElementById('cookieCount').textContent = cookies.length;
  const container = document.getElementById('cookieList');
  if (!cookies.length) {
    container.innerHTML = '<div class="empty-state">No cookies found for this page</div>';
    return;
  }
  container.innerHTML = `<table>
    <thead><tr><th>Name</th><th>Value</th><th>Actions</th></tr></thead>
    <tbody>${cookies.map((c, i) => `<tr>
      <td><strong>${esc(c.name)}</strong></td>
      <td>${esc(c.value)}</td>
      <td>
        <button class="btn" onclick="editCookie(${i})">Edit</button>
        <button class="btn btn-danger" onclick="deleteCookie(${i})">Delete</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function openModal(mode, idx) {
  editingIndex = idx ?? -1;
  document.getElementById('modalTitle').textContent = mode === 'add' ? 'Add Cookie' : 'Edit Cookie';
  if (mode === 'edit' && idx >= 0) {
    const cookies = parseCookies();
    const c = cookies[idx];
    document.getElementById('cookieName').value = c.name;
    document.getElementById('cookieValue').value = c.value;
    document.getElementById('cookieDomain').value = '';
    document.getElementById('cookiePath').value = '/';
    document.getElementById('cookieExpires').value = '';
    document.getElementById('cookieSecure').checked = false;
    document.getElementById('cookieSameSite').checked = true;
  } else {
    document.getElementById('cookieName').value = '';
    document.getElementById('cookieValue').value = '';
    document.getElementById('cookieDomain').value = '';
    document.getElementById('cookiePath').value = '/';
    document.getElementById('cookieExpires').value = '';
    document.getElementById('cookieSecure').checked = false;
    document.getElementById('cookieSameSite').checked = true;
  }
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function saveCookie() {
  const name = document.getElementById('cookieName').value.trim();
  const value = document.getElementById('cookieValue').value;
  const path = document.getElementById('cookiePath').value || '/';
  const expires = document.getElementById('cookieExpires').value;
  const secure = document.getElementById('cookieSecure').checked;
  const sameSite = document.getElementById('cookieSameSite').checked ? 'Lax' : 'None';

  if (!name) return toast('Name is required');
  let cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}`;
  cookie += `; path=${path}`;
  if (expires) cookie += `; expires=${new Date(expires).toUTCString()}`;
  if (secure) cookie += '; Secure';
  cookie += `; SameSite=${sameSite}`;
  document.cookie = cookie;
  closeModal();
  renderCookies();
  toast(editingIndex >= 0 ? 'Cookie updated' : 'Cookie added');
}

function editCookie(idx) { openModal('edit', idx); }

function deleteCookie(idx) {
  const cookies = parseCookies();
  const c = cookies[idx];
  document.cookie = `${c.name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
  renderCookies();
  toast('Cookie deleted');
}

function deleteAllCookies() {
  if (!confirm('Delete all cookies?')) return;
  parseCookies().forEach(c => {
    document.cookie = `${c.name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
  });
  renderCookies();
  toast('All cookies deleted');
}

function copyAllCookies() {
  const box = document.getElementById('cookieString');
  document.getElementById('cookieStringContent').textContent = document.cookie || '(empty)';
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function copyCookieString() {
  navigator.clipboard.writeText(document.cookie || '');
  toast('Copied to clipboard');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

renderCookies();
</script>
</body>
</html>
