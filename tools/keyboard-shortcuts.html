<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
.header{text-align:center;padding:30px 0;border-bottom:1px solid #222;margin-bottom:30px}
.header h1{font-size:2rem;font-weight:600;margin-bottom:10px}
.header a{color:#737373;text-decoration:none;font-size:0.9rem;transition:color .2s}
.header a:hover{color:#fff}
.search-wrap{max-width:600px;margin:0 auto 30px}
.search{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #222;background:#111;color:#fff;font-family:'Outfit',sans-serif;font-size:1rem;outline:none;transition:border .2s}
.search:focus{border-color:#444}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.tab{padding:8px 16px;border-radius:6px;border:1px solid #222;background:#111;color:#737373;cursor:pointer;font-family:'Outfit',sans-serif;font-size:0.85rem;transition:all .2s}
.tab.active,.tab:hover{background:#222;color:#fff;border-color:#444}
.shortcuts-grid{display:grid;gap:1px;background:#222;border:1px solid #222;border-radius:8px;overflow:hidden;max-width:800px;margin:0 auto}
.shortcut{background:#111;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;cursor:pointer;transition:background .2s}
.shortcut:hover{background:#1a1a1a}
.shortcut.copied{background:#1a3a1a}
.shortcut-action{font-size:0.9rem}
.shortcut-keys{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.key{background:#222;padding:4px 10px;border-radius:4px;font-size:0.8rem;font-family:monospace;border:1px solid #333;white-space:nowrap}
.toast{position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:12px 20px;border-radius:8px;font-size:0.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000}
.toast.show{opacity:1}
@media(max-width:600px){.shortcut{grid-template-columns:1fr}.shortcut-keys{justify-content:flex-start}}
</style>

let activeTab='Chrome';
function renderTabs(){
const t=document.getElementById('tabs');t.innerHTML='';
Object.keys(data).forEach(k=>{const b=document.createElement('button');b.className=`tab ${activeTab===k?'active':''}`;b.textContent=k;b.onclick=()=>{activeTab=k;renderTabs();render()};t.appendChild(b)});
}
function render(filter=''){
const c=document.getElementById('container');c.innerHTML='';
const items=data[activeTab]||[];
const f=items.filter(i=>!filter||i.action.toLowerCase().includes(filter.toLowerCase())||i.keys.join(' ').toLowerCase().includes(filter.toLowerCase()));
const grid=document.createElement('div');grid.className='shortcuts-grid';
f.forEach(s=>{
const el=document.createElement('div');el.className='shortcut';
el.innerHTML=`<span class="shortcut-action">${s.action}</span><span class="shortcut-keys">${s.keys.map(k=>`<span class="key">${k}</span>`).join('')}</span>`;
const text=s.keys.join(' + ');
el.onclick=()=>{navigator.clipboard.writeText(text);el.classList.add('copied');showToast('Copied: '+text);setTimeout(()=>el.classList.remove('copied'),500)};
grid.appendChild(el);
});
c.appendChild(grid);
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
document.getElementById('search').oninput=e=>render(e.target.value);
renderTabs();render();
