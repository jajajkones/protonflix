<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JWT Decoder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#f59e0b;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:900px;width:100%;margin:0 auto}
textarea{width:100%;height:120px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:var(--mono);font-size:13px;line-height:1.6;resize:vertical;outline:none}
textarea:focus{border-color:#444}
.btn{background:var(--accent);color:#000;border:none;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:12px;transition:opacity .2s}
.btn:hover{opacity:.8}
.jwt-parts{display:grid;gap:16px;margin-top:24px}
.jwt-part{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.jwt-part-header{padding:12px 16px;background:var(--surface);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between}
.jwt-part-header .alg{color:var(--accent)}
.jwt-part-body{padding:16px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
.jwt-part-body.header-part{background:rgba(245,158,11,0.05)}
.jwt-part-body.payload-part{background:rgba(59,130,246,0.05)}
.jwt-part-body.signature-part{background:rgba(239,68,68,0.05);color:var(--muted)}
.error{color:#ef4444;font-size:13px;margin-top:8px}
.info{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<header><h1>JWT Decoder</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<textarea id="input" placeholder="Paste a JWT token here..." spellcheck="false" oninput="decode()"></textarea>
<div class="error" id="error"></div>
<div class="jwt-parts" id="output"></div>
<div class="info">This tool only decodes JWT tokens for inspection. It does not verify signatures.</div>
</div>
<script>
function decode(){
const token=document.getElementById('input').value.trim();
const out=document.getElementById('output');
const err=document.getElementById('error');
err.textContent='';out.innerHTML='';
if(!token){return}
const parts=token.split('.');
if(parts.length!==3){err.textContent='Invalid JWT: expected 3 parts, got '+parts.length;return}
try{
const header=JSON.parse(atob(parts[0].replace(/-/g,'+').replace(/_/g,'/')));
const payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
let html=`<div class="jwt-part"><div class="jwt-part-header">Header <span class="alg">${header.alg||'?'}</span></div><div class="jwt-part-body header-part">${syntaxHighlight(JSON.stringify(header,null,2))}</div></div>`;
html+=`<div class="jwt-part"><div class="jwt-part-header">Payload${payload.exp?' — Expires: '+new Date(payload.exp*1000).toLocaleString():''}</div><div class="jwt-part-body payload-part">${syntaxHighlight(JSON.stringify(payload,null,2))}</div></div>`;
html+=`<div class="jwt-part"><div class="jwt-part-header">Signature</div><div class="jwt-part-body signature-part">${parts[2]}</div></div>`;
out.innerHTML=html;
}catch(e){err.textContent='Failed to decode: '+e.message}
}
function syntaxHighlight(json){
return json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
.replace(/"([^"]+)"(?=\s*:)/g,'<span style="color:#3b82f6">"$1"</span>')
.replace(/"([^"]*)"/g,'<span style="color:#22c55e">"$1"</span>')
.replace(/\b(\d+)\b/g,'<span style="color:#f59e0b">$1</span>')
.replace(/\b(true|false|null)\b/g,'<span style="color:#ec4899">$1</span>');
}
</script>
</body>
</html>
