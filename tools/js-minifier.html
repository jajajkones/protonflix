<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Minifier / Beautifier</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#f59e0b;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.toolbar{padding:16px 40px;display:flex;gap:12px;border-bottom:1px solid var(--border)}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000}
.container{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0}
.pane{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.pane:last-child{border-right:none}
.pane-header{padding:12px 20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
textarea{flex:1;background:var(--bg);color:var(--text);border:none;padding:20px;font-family:var(--mono);font-size:13px;line-height:1.6;resize:none;outline:none}
.output{flex:1;padding:20px;font-family:var(--mono);font-size:13px;line-height:1.6;overflow:auto;white-space:pre-wrap;word-break:break-all}
.info{font-size:12px;color:var(--muted)}
@media(max-width:768px){.container{grid-template-columns:1fr}.pane{min-height:40vh}.pane:last-child{border-top:1px solid var(--border)}}
</style>
</head>
<body>
<header><h1>JavaScript Minifier / Beautifier</h1><a href="index.html">← Back to Tools</a></header>
<div class="toolbar">
<button class="btn primary" onclick="minify()">Minify</button>
<button class="btn primary" onclick="beautify()">Beautify</button>
<button class="btn" onclick="copyOutput()">Copy</button>
<button class="btn" onclick="clearAll()">Clear</button>
</div>
<div class="container">
<div class="pane">
<div class="pane-header">Input <span class="info" id="inInfo"></span></div>
<textarea id="input" placeholder="Paste JavaScript here..." spellcheck="false" oninput="updateInfo()"></textarea>
</div>
<div class="pane">
<div class="pane-header">Output <span class="info" id="outInfo"></span></div>
<div class="output" id="output"></div>
</div>
</div>
<script>
function minify(){
const js=document.getElementById('input').value;
let m=js.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'').replace(/\s+/g,' ').replace(/\s*([{}();,=+\-<>!&|?:])\s*/g,'$1').replace(/;}/g,'}').trim();
document.getElementById('output').textContent=m;
document.getElementById('outInfo').textContent=`${m.length} chars (${((1-m.length/js.length)*100).toFixed(1)}% saved)`;
}
function beautify(){
let js=document.getElementById('input').value;
js=js.replace(/\s+/g,' ').replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');
let out='';let indent=0;
for(let i=0;i<js.length;i++){
const c=js[i];const next=js[i+1];
if(c==='{'||c==='}'){
if(c==='{'){out+='\n'+'  '.repeat(indent)+'{\n';indent++}
else{indent--;out+='  '.repeat(indent)+'}\n'}
out+='  '.repeat(indent);
}else if(c===';'){out+=';\n'+'  '.repeat(indent)}
else{out+=c}
}
document.getElementById('output').textContent=out.trim();
document.getElementById('outInfo').textContent=`${out.trim().split('\n').length} lines`;
}
function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').textContent)}
function clearAll(){document.getElementById('input').value='';document.getElementById('output').textContent='';document.getElementById('inInfo').textContent='';document.getElementById('outInfo').textContent=''}
function updateInfo(){const v=document.getElementById('input').value;document.getElementById('inInfo').textContent=v?`${v.length} chars`:''}
</script>
</body>
</html>
