<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON to TypeScript Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
a{color:#fff;text-decoration:none}
.header{background:#111;border-bottom:1px solid #222;padding:16px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:1.2rem;font-weight:600}
.back{padding:6px 12px;border:1px solid #222;border-radius:6px;font-size:.85rem;transition:.2s}
.back:hover{background:#222}
.container{max-width:1100px;margin:24px auto;padding:0 20px}
.panel{background:#111;border:1px solid #222;border-radius:10px;padding:20px;margin-bottom:24px}
.panel h2{font-size:1rem;font-weight:500;margin-bottom:16px;color:#737373}
textarea{width:100%;height:250px;padding:12px;background:#0a0a0a;border:1px solid #222;border-radius:6px;color:#fff;font-family:'Courier New',monospace;font-size:.8rem;resize:vertical;outline:none}
textarea:focus{border-color:#555}
.opts{display:flex;gap:16px;margin:16px 0;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.opts input{accent-color:#fff}
.code-box{position:relative}
.code-box pre{background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:14px;font-size:.8rem;overflow-x:auto;line-height:1.6;max-height:400px;overflow-y:auto}
.copy-btn{padding:8px 16px;background:#fff;color:#0a0a0a;border:none;border-radius:6px;font-family:inherit;font-weight:600;cursor:pointer;font-size:.85rem}
.copy-btn:hover{background:#e0e0e0}
.error{color:#ef4444;font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back">← Back</a>
<h1>JSON to TypeScript Interface</h1>
</div>
<div class="container">
<div class="panel">
<h2>JSON Input</h2>
<textarea id="input" placeholder='{"name": "John", "age": 30, "active": true}'>{
  "id": 1,
  "name": "John Doe",
  "email": "john@example.com",
  "age": 30,
  "active": true,
  "tags": ["admin", "user"],
  "address": {
    "street": "123 Main St",
    "city": "Springfield"
  }
}</textarea>
<div class="opts">
<label><input type="checkbox" id="optOptional"> Optional fields</label>
<label><input type="checkbox" id="optReadonly"> Readonly</label>
<label><input type="checkbox" id="optExport" checked> Export</label>
</div>
<button class="copy-btn" onclick="copyCode()">Copy TypeScript</button>
</div>
<div class="panel">
<h2>TypeScript Interface</h2>
<div class="code-box"><pre id="output"></pre></div>
<div id="error" class="error"></div>
</div>
</div>
<script>
function jsonToTs(obj,name='Root',opts={optional:false,readonly:false,export:true},indent=0){
const pad='  '.repeat(indent);const lines=[];
const exp=opts.export?'export ':'';
lines.push(`${pad}${exp}interface ${name} {`);
for(const[k,v] of Object.entries(obj)){
const opt=opts.optional?'?':'';
const ro=opts.readonly?'readonly ':'';
if(v===null)lines.push(`${pad}  ${ro}${k}${opt}: null;`);
else if(Array.isArray(v)){
if(v.length>0&&typeof v[0]==='object'&&v[0]!==null){
lines.push(`${pad}  ${ro}${k}${opt}: ${jsonToTs(v[0],'',opts,indent+1).replace(/\n\s*\}/,'\n'+pad+'  }').replace(/^.*interface\s*\w*\s*\{/,'Array<{').replace(/\}\s*$/,'}>')}[];`);
}else{
const t=v.length>0?typeof v[0]==='string'?'string':typeof v[0]:'any';
lines.push(`${pad}  ${ro}${k}${opt}: ${t}[];`);
}
}else if(typeof v==='object'){
lines.push(`${pad}  ${ro}${k}${opt}: ${jsonToTs(v,k,opts,indent+1).replace(/\n\s*\}/,pad+'  }').replace(/^.*interface\s*\w*\s*\{/,`{\n${pad}  `)}${pad}  };`);
}else{
const t=typeof v==='string'?'string':typeof v==='number'?'number':typeof v==='boolean'?'boolean':'any';
lines.push(`${pad}  ${ro}${k}${opt}: ${t};`);
}
}
lines.push(`${pad}}`);
return lines.join('\n');
}
function update(){
const input=document.getElementById('input').value;
const errEl=document.getElementById('error');
const outEl=document.getElementById('output');
try{
const obj=JSON.parse(input);
errEl.textContent='';
const opts={
optional:document.getElementById('optOptional').checked,
readonly:document.getElementById('optReadonly').checked,
export:document.getElementById('optExport').checked
};
outEl.textContent=jsonToTs(obj,'Interface',opts);
}catch(e){
errEl.textContent='Invalid JSON: '+e.message;
outEl.textContent='';
}
}
function copyCode(){
navigator.clipboard.writeText(document.getElementById('output').textContent);
const b=document.querySelector('.copy-btn');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy TypeScript',1500);
}
document.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',update));
document.getElementById('input').addEventListener('input',update);
update();
</script>
</body>
</html>
