<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Encoder / Decoder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#8b5cf6;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.toolbar{padding:16px 40px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444;background:#1a1a1a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#7c3aed}
.container{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0}
.pane{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.pane:last-child{border-right:none}
.pane-header{padding:12px 20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
textarea{flex:1;background:var(--bg);color:var(--text);border:none;padding:20px;font-family:var(--mono);font-size:14px;line-height:1.6;resize:none;outline:none}
.output{flex:1;padding:20px;font-family:var(--mono);font-size:14px;line-height:1.6;overflow:auto;white-space:pre-wrap;word-break:break-all}
.file-input{display:none}
.file-label{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s;display:inline-block}
.file-label:hover{border-color:#444;background:#1a1a1a}
@media(max-width:768px){.container{grid-template-columns:1fr}.pane{min-height:40vh}.pane:last-child{border-top:1px solid var(--border)}}
</style>
</head>
<body>
<header>
<h1>Base64 Encoder / Decoder</h1>
<a href="index.html">← Back to Tools</a>
</header>
<div class="toolbar">
<button class="btn primary" onclick="encode()">Encode</button>
<button class="btn primary" onclick="decode()">Decode</button>
<button class="btn" onclick="copyOutput()">Copy</button>
<button class="btn" onclick="clearAll()">Clear</button>
<label class="file-label">Upload File (encode to base64)<input type="file" class="file-input" id="fileInput" onchange="handleFile(this)"></label>
</div>
<div class="container">
<div class="pane">
<div class="pane-header">Input</div>
<textarea id="input" placeholder="Enter text or base64 string..." spellcheck="false"></textarea>
</div>
<div class="pane">
<div class="pane-header">Output</div>
<div class="output" id="output"></div>
</div>
</div>
<script>
const input=document.getElementById('input'),output=document.getElementById('output');
function encode(){try{output.textContent=btoa(unescape(encodeURIComponent(input.value)))}catch(e){output.textContent='Error: '+e.message}}
function decode(){try{output.textContent=decodeURIComponent(escape(atob(input.value.trim())))}catch(e){output.textContent='Error: '+e.message}}
function copyOutput(){navigator.clipboard.writeText(output.textContent)}
function clearAll(){input.value='';output.textContent=''}
function handleFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{output.textContent=r.result;document.querySelector('.pane-header').textContent=f.name+' ('+f.type+', '+f.size+' bytes)'};r.readAsDataURL(f)}
</script>
</body>
</html>
