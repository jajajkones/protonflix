<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorem Ipsum Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#06b6d4;--radius:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:800px;width:100%;margin:0 auto}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:24px}
.control{display:flex;flex-direction:column;gap:6px}
.control label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.control select,.control input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.btn{background:var(--accent);color:#000;border:none;padding:9px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-outline{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:9px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:#444}
.output{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;font-size:15px;line-height:1.8;color:#ccc;white-space:pre-wrap}
.actions{display:flex;gap:8px;margin-top:16px}
</style>
</head>
<body>
<header><h1>Lorem Ipsum Generator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="controls">
<div class="control"><label>Count</label><input type="number" id="count" value="5" min="1" max="100"></div>
<div class="control"><label>Type</label><select id="type"><option value="paragraphs">Paragraphs</option><option value="sentences">Sentences</option><option value="words">Words</option></select></div>
<div class="control"><label>Start with</label><select id="startWith"><option value="yes">Lorem ipsum dolor sit amet</option><option value="no">Random start</option></select></div>
<button class="btn" onclick="generate()">Generate</button>
<button class="btn-outline" onclick="copy()">Copy</button>
</div>
<div class="output" id="output"></div>
</div>
<script>
const words='lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt mollit anim id est laborum'.split(' ');
const w=words.length;
function randWord(){return words[Math.floor(Math.random()*w)]}
function sentence(){let s=randWord();s=s.charAt(0).toUpperCase()+s.slice(1);const len=8+Math.floor(Math.random()*12);for(let i=1;i<len;i++)s+=' '+randWord();return s+'.'}
function paragraph(){const len=4+Math.floor(Math.random()*4);let p='';for(let i=0;i<len;i++)p+=sentence()+' ';return p.trim()}
function generate(){
const count=+document.getElementById('count').value;
const type=document.getElementById('type').value;
const start=document.getElementById('startWith').value;
let result='';
if(type==='words'){
const ws=[];for(let i=0;i<count;i++)ws.push(randWord());
result=ws.join(' ');
if(start==='yes')result='Lorem ipsum dolor sit amet '+result;
}else if(type==='sentences'){
const ss=[];for(let i=0;i<count;i++)ss.push(sentence());
if(start==='yes')ss[0]='Lorem ipsum dolor sit amet, '+ss[0].charAt(0).toLowerCase()+ss[0].slice(1);
result=ss.join(' ');
}else{
const ps=[];for(let i=0;i<count;i++)ps.push(paragraph());
if(start==='yes')ps[0]='Lorem ipsum dolor sit amet, '+ps[0].charAt(0).toLowerCase()+ps[0].slice(1);
result=ps.join('\n\n');
}
document.getElementById('output').textContent=result;
}
function copy(){navigator.clipboard.writeText(document.getElementById('output').textContent)}
generate();
</script>
</body>
</html>
