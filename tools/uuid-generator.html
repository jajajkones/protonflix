<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#06b6d4;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:800px;width:100%;margin:0 auto}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444;background:#1a1a1a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#000}
.setting{display:flex;gap:20px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.setting label{font-size:13px;color:var(--muted)}
.setting select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-family:inherit;outline:none}
.setting input[type=number]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-family:inherit;outline:none;width:80px}
.uuid-list{display:flex;flex-direction:column;gap:8px}
.uuid-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-family:var(--mono);font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s}
.uuid-item:hover{border-color:#444}
.uuid-item .copy-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;opacity:0;transition:opacity .2s}
.uuid-item:hover .copy-label{opacity:1}
.uuid-item.copied{border-color:#22c55e}
</style>
</head>
<body>
<header><h1>UUID Generator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="toolbar">
<button class="btn primary" onclick="generate()">Generate UUIDs</button>
<button class="btn" onclick="copyAll()">Copy All</button>
<button class="btn" onclick="downloadAll()">Download</button>
<button class="btn" onclick="clearAll()">Clear</button>
</div>
<div class="setting">
<label>Format:</label>
<select id="format">
<option value="v4">v4 (Random)</option>
<option value="v4n">v4 (No dashes)</option>
<option value="v1">v1 (Timestamp)</option>
</select>
<label>Count:</label>
<input type="number" id="count" value="10" min="1" max="1000">
</div>
<div class="uuid-list" id="output"></div>
</div>
<script>
function v4(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)})}
function v1(){const t=Date.now().toString(16).padStart(12,'0');const n=Math.random().toString(16).substring(2,14);return`${t.substring(4,12)}-${t.substring(0,4)}-1${n.substring(0,3)}-${n.substring(3,7)}-${n.substring(7,12)}`}
function generate(){const fmt=document.getElementById('format').value;const count=+document.getElementById('count').value;const out=document.getElementById('output');let html='';for(let i=0;i<count;i++){let u=fmt==='v1'?v1():v4();if(fmt==='v4n')u=u.replace(/-/g,'');html+=`<div class="uuid-item" onclick="copyUuid(this)"><span>${u}</span><span class="copy-label">Click to copy</span></div>`}out.innerHTML=html}
function copyUuid(el){navigator.clipboard.writeText(el.querySelector('span').textContent);el.classList.add('copied');setTimeout(()=>el.classList.remove('copied'),1000)}
function copyAll(){const uuids=[...document.querySelectorAll('.uuid-item span:first-child')].map(el=>el.textContent).join('\n');navigator.clipboard.writeText(uuids)}
function downloadAll(){const uuids=[...document.querySelectorAll('.uuid-item span:first-child')].map(el=>el.textContent).join('\n');const blob=new Blob([uuids],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uuids.txt';a.click()}
function clearAll(){document.getElementById('output').innerHTML=''}
generate();
</script>
</body>
</html>
