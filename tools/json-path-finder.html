<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Path Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #222}
.header h1{font-size:1.5rem;font-weight:600}
.header a{color:#737373;text-decoration:none;font-size:.9rem;transition:color .2s}
.header a:hover{color:#fff}
.container{display:flex;gap:20px;height:calc(100vh - 120px)}
.panel{flex:1;display:flex;flex-direction:column;gap:12px}
.panel-header{display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:.85rem;font-weight:500;color:#737373;text-transform:uppercase;letter-spacing:.5px}
textarea{width:100%;flex:1;background:#111;border:1px solid #222;border-radius:8px;padding:16px;color:#fff;font-family:'Outfit',sans-serif;font-size:.9rem;resize:none;outline:none;line-height:1.6}
textarea:focus{border-color:#444}
.path-display{background:#111;border:1px solid #222;border-radius:8px;padding:12px 16px;font-family:monospace;font-size:.9rem;color:#4ade80;word-break:break-all;min-height:48px;display:flex;align-items:center;gap:8px}
.path-display .label{color:#737373;font-family:'Outfit',sans-serif;font-size:.8rem}
.search-box{background:#111;border:1px solid #222;border-radius:8px;padding:10px 14px;color:#fff;font-family:'Outfit',sans-serif;font-size:.9rem;width:100%;outline:none}
.search-box:focus{border-color:#444}
.tree-container{flex:1;overflow:auto;background:#111;border:1px solid #222;border-radius:8px;padding:16px}
.tree-container::-webkit-scrollbar{width:6px;height:6px}
.tree-container::-webkit-scrollbar-track{background:transparent}
.tree-container::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.node{cursor:pointer;padding:2px 0;border-radius:4px;transition:background .15s}
.node:hover{background:rgba(255,255,255,.05)}
.node-key{color:#93c5fd}
.node-string{color:#4ade80}
.node-number{color:#facc15}
.node-boolean{color:#c084fc}
.node-null{color:#737373;font-style:italic}
.node-bracket{color:#737373}
.indent{display:inline-block;width:20px}
.copy-btn{background:#222;border:1px solid #333;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.8rem;transition:all .2s}
.copy-btn:hover{background:#333}
.copy-btn.copied{background:#166534;border-color:#22c55e}
.toast{position:fixed;bottom:20px;right:20px;background:#222;border:1px solid #333;color:#fff;padding:12px 20px;border-radius:8px;font-size:.9rem;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateY(0)}
.highlight{background:rgba(250,204,21,.15);border-radius:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media(max-width:768px){.container{flex-direction:column;height:auto}.panel{min-height:40vh}}
</style>
</head>
<body>
<div class="header">
<h1>JSON Path Finder</h1>
<a href="index.html">← Back to Tools</a>
</div>
<div class="container">
<div class="panel">
<div class="panel-header">
<span class="panel-title">Input JSON</span>
<button class="copy-btn" onclick="copyInput()">Copy Input</button>
</div>
<label class="sr-only" for="jsonInput">JSON input</label>
<textarea id="jsonInput" placeholder='Paste your JSON here...\n\nExample:\n{\n  "store": {\n    "book": [\n      { "title": "Sayings", "price": 8.95 },\n      { "title": "Midnight", "price": 12.99 }\n    ]\n  }\n}'></textarea>
</div>
<div class="panel">
<div class="panel-header">
<span class="panel-title">JSON Tree</span>
<label class="sr-only" for="searchBox">Search values</label>
<input type="text" class="search-box" id="searchBox" placeholder="Search values..." oninput="searchJSON()">
</div>
<div class="path-display">
<span class="label">Path:</span>
<span id="currentPath">$</span>
<button class="copy-btn" onclick="copyPath()">Copy</button>
</div>
<div class="tree-container" id="treeContainer"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
let jsonData=null;
let selectedPath='$';
const jsonInput=document.getElementById('jsonInput');
const treeContainer=document.getElementById('treeContainer');
const currentPathEl=document.getElementById('currentPath');
const searchBox=document.getElementById('searchBox');

jsonInput.addEventListener('input',()=>{
try{jsonData=JSON.parse(jsonInput.value);renderTree()}catch(e){treeContainer.innerHTML='<span style="color:#737373">Invalid JSON</span>'}
});

function renderTree(){
if(!jsonData){treeContainer.innerHTML='';return}
treeContainer.innerHTML=renderNode(jsonData,'$',0);
}

function renderNode(value,path,depth){
if(value===null) return `<span class="node" data-path="${esc(path)}" onclick="selectNode('${esc(path)}',this)"><span class="node-null">null</span></span>`;
if(typeof value==='boolean') return `<span class="node" data-path="${esc(path)}" onclick="selectNode('${esc(path)}',this)"><span class="node-boolean">${value}</span></span>`;
if(typeof value==='number') return `<span class="node" data-path="${esc(path)}" onclick="selectNode('${esc(path)}',this)"><span class="node-number">${value}</span></span>`;
if(typeof value==='string') return `<span class="node" data-path="${esc(path)}" onclick="selectNode('${esc(path)}',this)"><span class="node-string">"${escHtml(value)}"</span></span>`;
if(Array.isArray(value)){
if(value.length===0) return `<span class="node-bracket">[]</span>`;
let html=`<span class="node-bracket">[</span>\n`;
value.forEach((item,i)=>{
const childPath=`${path}[${i}]`;
const indent='  '.repeat(depth+1);
html+=indent+renderNode(item,childPath,depth+1);
if(i<value.length-1) html+=',';
html+='\n';
});
html+='  '.repeat(depth)+`<span class="node-bracket">]</span>`;
return html;
}
if(typeof value==='object'){
const keys=Object.keys(value);
if(keys.length===0) return `<span class="node-bracket">{}</span>`;
let html=`<span class="node-bracket">{</span>\n`;
keys.forEach((key,i)=>{
const childPath=path==='$'?`$.${key}`:`${path}.${key}`;
const indent='  '.repeat(depth+1);
html+=indent+`<span class="node" data-path="${esc(childPath)}" onclick="selectNode('${esc(childPath)}',this)"><span class="node-key">"${escHtml(key)}"</span></span>: `;
html+=renderNode(value[key],childPath,depth+1);
if(i<keys.length-1) html+=',';
html+='\n';
});
html+='  '.repeat(depth)+`<span class="node-bracket">}</span>`;
return html;
}
return String(value);
}

function esc(s){return s.replace(/'/g,"\\'").replace(/\$/g,'$').replace(/\./g,'\\.').replace(/\[/g,'\\[').replace(/\]/g,'\\]')}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function selectNode(path,el){
selectedPath=path;
currentPathEl.textContent=path;
document.querySelectorAll('.node').forEach(n=>n.style.background='');
el.style.background='rgba(255,255,255,.08)';
}

function copyPath(){
navigator.clipboard.writeText(selectedPath);
showToast('Path copied!');
}

function copyInput(){
navigator.clipboard.writeText(jsonInput.value);
showToast('Input copied!');
}

function showToast(msg){
const t=document.getElementById('toast');
t.textContent=msg;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2000);
}

function searchJSON(){
const q=searchBox.value.toLowerCase();
document.querySelectorAll('.node').forEach(n=>{
if(!q){n.classList.remove('highlight');return}
const text=n.textContent.toLowerCase();
n.classList.toggle('highlight',text.includes(q));
});
}
</script>
</body>
</html>
