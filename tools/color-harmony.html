<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Harmony Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
a{color:#fff;text-decoration:none}
.header{background:#111;border-bottom:1px solid #222;padding:16px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:1.2rem;font-weight:600}
.back{padding:6px 12px;border:1px solid #222;border-radius:6px;font-size:.85rem;transition:.2s}
.back:hover{background:#222}
.container{max-width:900px;margin:24px auto;padding:0 20px}
.panel{background:#111;border:1px solid #222;border-radius:10px;padding:20px;margin-bottom:24px}
.panel h2{font-size:1rem;font-weight:500;margin-bottom:16px;color:#737373}
.base-picker{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.base-picker input[type="color"]{width:80px;height:80px;border:2px solid #222;border-radius:10px;cursor:pointer;background:none;padding:2px}
.base-picker input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
.base-picker input[type="color"]::-webkit-color-swatch{border:none;border-radius:8px}
.base-info{font-size:.9rem;color:#737373}
.base-info strong{color:#fff;font-size:1.1rem}
.harmony-section{margin-bottom:24px}
.harmony-section h3{font-size:.9rem;font-weight:500;margin-bottom:10px;color:#aaa}
.palette{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:70px;text-align:center;border-radius:8px;overflow:hidden;border:1px solid #222;cursor:pointer;transition:.2s}
.swatch:hover{transform:scale(1.05);border-color:#555}
.swatch-color{height:60px}
.swatch-label{font-size:.65rem;padding:4px;background:#111;word-break:break-all}
.code-box{position:relative}
.code-box pre{background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:14px;font-size:.75rem;overflow-x:auto;line-height:1.6;max-height:300px;overflow-y:auto}
.copy-btn{padding:5px 10px;background:#222;border:1px solid #333;border-radius:4px;color:#fff;font-size:.7rem;cursor:pointer;font-family:inherit}
.copy-btn:hover{background:#333}
.toast{position:fixed;bottom:20px;right:20px;background:#222;border:1px solid #444;padding:10px 20px;border-radius:8px;font-size:.85rem;display:none;z-index:100}

@media(max-width:768px){header{padding:20px 16px}header h1{font-size:16px}.content{padding:20px 16px}.container{padding:16px}}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back">← Back</a>
<h1>Color Harmony Generator</h1>
</div>
<div class="container">
<div class="panel">
<div class="base-picker">
<input type="color" id="base" value="#7c3aed" oninput="update()">
<div class="base-info"><strong id="baseHex">#7c3aed</strong><br>Base Color</div>
</div>
</div>
<div id="harmonies"></div>
<div class="panel">
<h2>CSS Variables</h2>
<div style="display:flex;gap:8px;align-items:flex-start">
<div class="code-box" style="flex:1"><pre id="cssCode"></pre></div>
<button class="copy-btn" onclick="copyCSS()">Copy</button>
</div>
</div>
</div>
<div class="toast" id="toast">Copied!</div>
<script>
function hexToHsl(h){let r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h2,s,l=(max+min)/2;if(max===min){h2=s=0}else{s=d/(1-Math.abs(2*l-1)));switch(max){case r:h2=((g-b)/d+(g<b?6:0))/6;break;case g:h2=((b-r)/d+2)/6;break;case b:h2=((r-g)/d+4)/6;break}}return[h2*360,s*100,l*100]}
function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return`#${f(0)}${f(8)}${f(4)}`}
function hslStr(h,s,l){return`hsl(${Math.round(h)},${Math.round(s)}%,${Math.round(l)}%)`}
function shiftHue(h,s,l,d){return hslToHex((h+d)%360,s,l)}
function makePalette(name,fn){
const hex=document.getElementById('base').value;
const[h,s,l]=hexToHsl(hex);
const colors=fn(h,s,l);
return{name,colors};
}
function update(){
const hex=document.getElementById('base').value;
document.getElementById('baseHex').textContent=hex;
const[h,s,l]=hexToHsl(hex);
const palettes=[
makePalette('Complementary',()=>[[h,s,l],[h+180,s,l]]),
makePalette('Analogous',()=>[[h-30,s,l],[h,s,l],[h+30,s,l]]),
makePalette('Triadic',()=>[[h,s,l],[h+120,s,l],[h+240,s,l]]),
makePalette('Split-Complementary',()=>[[h,s,l],[h+150,s,l],[h+210,s,l]]),
makePalette('Tetradic',()=>[[h,s,l],[h+90,s,l],[h+180,s,l],[h+270,s,l]]),
makePalette('Square',()=>[[h,s,l],[h+90,s,l],[h+180,s,l],[h+270,s,l]])
];
const el=document.getElementById('harmonies');
el.innerHTML=palettes.map(p=>`
<div class="panel">
<h2>${p.name}</h2>
<div class="palette">
${p.colors.map(c=>`<div class="swatch" onclick="copyColor('${c[3]}')"><div class="swatch-color" style="background:${hslStr(c[0],c[1],c[2])}"></div><div class="swatch-label">${c[3]}</div></div>`).join('')}
</div>
</div>`).join('');
let css=`:root {\n`;
palettes.forEach(p=>{
p.colors.forEach((c,i)=>{
css+=`  --${p.name.toLowerCase().replace(/[^a-z]/g,'')}-${i+1}: ${c[3]};\n`;
});
});
css+=`}`;
document.getElementById('cssCode').textContent=css;
}
function copyColor(c){navigator.clipboard.writeText(c);showToast(`Copied ${c}`)}
function copyCSS(){navigator.clipboard.writeText(document.getElementById('cssCode').textContent);showToast('CSS copied!')}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1500)}
// Fix: store hex in color array
const origMakePalette=makePalette;
makePalette=function(name,fn){
const hex=document.getElementById('base').value;
const[h,s,l]=hexToHsl(hex);
const coords=fn(h,s,l);
const colors=coords.map(c=>[...c,hslToHex(c[0],c[1],c[2])]);
return{name,colors};
};
update();
</script>
</body>
</html>
