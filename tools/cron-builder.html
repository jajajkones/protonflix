<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Expression Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid #222}
h1{font-size:1.8rem;font-weight:600}
.back{color:#737373;text-decoration:none;font-size:0.9rem;transition:color .2s}
.back:hover{color:#fff}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:24px;margin-bottom:20px}
label{display:block;font-weight:500;margin-bottom:8px;color:#e0e0e0;font-size:0.9rem}
select,input[type=number],input[type=text]{background:#0a0a0a;border:1px solid #222;color:#fff;font-family:'Outfit',sans-serif;padding:10px 12px;border-radius:8px;font-size:0.9rem;width:100%}
select{height:42px;cursor:pointer}
input[type=number]{height:42px;width:80px}
.field-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px}
.field-box{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:14px}
.field-box h4{font-size:0.8rem;color:#737373;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.field-box select{margin-bottom:8px}
.sub-options{margin-top:8px}
.sub-options input{margin-top:4px}
.btn-row{display:flex;gap:12px;margin:16px 0}
button{background:#2563eb;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:500;font-size:0.9rem;cursor:pointer;transition:background .2s}
button:hover{background:#1d4ed8}
.btn-sm{padding:8px 16px;font-size:0.8rem}
.btn-outline{background:transparent;border:1px solid #222;color:#fff}
.btn-outline:hover{background:#222}
.cron-display{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:16px;font-family:'Courier New',monospace;font-size:1.3rem;text-align:center;letter-spacing:3px;color:#34d399;margin:16px 0}
.human-readable{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:16px;color:#e0e0e0;margin:16px 0;line-height:1.6}
.exec-list{list-style:none;padding:0}
.exec-list li{padding:8px 12px;border-bottom:1px solid #222;font-size:0.88rem;color:#a0a0a0}
.exec-list li:last-child{border:none}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.preset-btn{background:#0a0a0a;border:1px solid #222;color:#fff;padding:10px;border-radius:8px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:0.82rem;text-align:left;transition:border-color .2s}
.preset-btn:hover{border-color:#2563eb}
.preset-btn strong{display:block;color:#e0e0e0;margin-bottom:2px}
.preset-btn span{color:#737373;font-size:0.78rem}

@media(max-width:768px){header{padding:20px 16px}header h1{font-size:16px}.content{padding:20px 16px}.container{padding:16px}}
</style>
</head>
<body>
<div class="container">
<header>
<a href="index.html" class="back">← Back</a>
<h1>Cron Expression Builder</h1>
</header>

<div class="card">
<label>Quick Presets</label>
<div class="preset-grid">
<button class="preset-btn" onclick="setPreset('* * * * *')"><strong>Every Minute</strong><span>* * * * *</span></button>
<button class="preset-btn" onclick="setPreset('0 * * * *')"><strong>Every Hour</strong><span>0 * * * *</span></button>
<button class="preset-btn" onclick="setPreset('0 9 * * *')"><strong>Daily at 9 AM</strong><span>0 9 * * *</span></button>
<button class="preset-btn" onclick="setPreset('0 9 * * 1')"><strong>Weekly Mon 9 AM</strong><span>0 9 * * 1</span></button>
<button class="preset-btn" onclick="setPreset('0 9 1 * *')"><strong>Monthly 1st 9 AM</strong><span>0 9 1 * *</span></button>
<button class="preset-btn" onclick="setPreset('*/5 * * * *')"><strong>Every 5 Minutes</strong><span>*/5 * * * *</span></button>
<button class="preset-btn" onclick="setPreset('0 */2 * * *')"><strong>Every 2 Hours</strong><span>0 */2 * * *</span></button>
<button class="preset-btn" onclick="setPreset('0 0 * * 0')"><strong>Sunday Midnight</strong><span>0 0 * * 0</span></button>
</div>
</div>

<div class="card">
<label>Build Your Cron Expression</label>
<div class="field-row">
<div class="field-box">
<h4>Minute (0-59)</h4>
<select id="minType" onchange="updateSub('min')">
<option value="*">Every minute (*)</option>
<option value="specific">Specific value</option>
<option value="every">Every N minutes</option>
<option value="range">Range</option>
<option value="list">List</option>
</select>
<div class="sub-options" id="minSub"></div>
</div>
<div class="field-box">
<h4>Hour (0-23)</h4>
<select id="hourType" onchange="updateSub('hour')">
<option value="*">Every hour (*)</option>
<option value="specific">Specific value</option>
<option value="every">Every N hours</option>
<option value="range">Range</option>
<option value="list">List</option>
</select>
<div class="sub-options" id="hourSub"></div>
</div>
<div class="field-box">
<h4>Day of Month (1-31)</h4>
<select id="domType" onchange="updateSub('dom')">
<option value="*">Every day (*)</option>
<option value="specific">Specific value</option>
<option value="range">Range</option>
<option value="list">List</option>
</select>
<div class="sub-options" id="domSub"></div>
</div>
<div class="field-box">
<h4>Month (1-12)</h4>
<select id="monType" onchange="updateSub('mon')">
<option value="*">Every month (*)</option>
<option value="specific">Specific value</option>
<option value="range">Range</option>
<option value="list">List</option>
</select>
<div class="sub-options" id="monSub"></div>
</div>
<div class="field-box">
<h4>Day of Week (0-6)</h4>
<select id="dowType" onchange="updateSub('dow')">
<option value="*">Every day (*)</option>
<option value="specific">Specific value</option>
<option value="range">Range</option>
<option value="list">List</option>
</select>
<div class="sub-options" id="dowSub"></div>
</div>
</div>
</div>

<div class="card">
<div class="cron-display" id="cronExpr">* * * * *</div>
<div class="human-readable" id="humanDesc">Runs every minute.</div>
</div>

<div class="card">
<label>Next 10 Execution Times</label>
<ul class="exec-list" id="execList"></ul>
</div>
</div>

<script>
function updateSub(field){
const type=document.getElementById(field+'Type').value;
const sub=document.getElementById(field+'Sub');
let html='';
if(type==='specific'){
html='<input type="number" id="'+field+'Val" value="0" min="0" max="59" onchange="buildCron()">';
if(field==='hour')html='<input type="number" id="'+field+'Val" value="0" min="0" max="23" onchange="buildCron()">';
if(field==='dom')html='<input type="number" id="'+field+'Val" value="1" min="1" max="31" onchange="buildCron()">';
if(field==='mon')html='<input type="number" id="'+field+'Val" value="1" min="1" max="12" onchange="buildCron()">';
if(field==='dow')html='<input type="number" id="'+field+'Val" value="0" min="0" max="6" onchange="buildCron()">';
}else if(type==='every'){
html='<input type="number" id="'+field+'Every" value="5" min="1" onchange="buildCron()">';
}else if(type==='range'){
html='<input type="number" id="'+field+'From" value="0" min="0" max="59" style="width:60px" onchange="buildCron()"> to <input type="number" id="'+field+'To" value="5" min="0" max="59" style="width:60px" onchange="buildCron()">';
}else if(type==='list'){
html='<input type="text" id="'+field+'List" value="1,5,10" placeholder="e.g. 1,5,10" onchange="buildCron()">';
}
sub.innerHTML=html;
buildCron();
}

function getFieldVal(field){
const type=document.getElementById(field+'Type').value;
if(type==='specific'){
const el=document.getElementById(field+'Val');
return el?el.value:'*';
}else if(type==='every'){
const el=document.getElementById(field+'Every');
return '*/'+(el?el.value:'1');
}else if(type==='range'){
const f=document.getElementById(field+'From');
const t=document.getElementById(field+'To');
return(f?f.value:'0')+'-'+(t?t.value:'5');
}else if(type==='list'){
const el=document.getElementById(field+'List');
return el?el.value:'*';
}
return '*';
}

function buildCron(){
const expr=[getFieldVal('min'),getFieldVal('hour'),getFieldVal('dom'),getFieldVal('mon'),getFieldVal('dow')].join(' ');
document.getElementById('cronExpr').textContent=expr;
document.getElementById('humanDesc').textContent=describeCron(expr);
showNextExecutions(expr);
}

function describeCron(expr){
const parts=expr.split(' ');
const min=parts[0],hour=parts[1],dom=parts[2],mon=parts[3],dow=parts[4];
let desc='Runs ';
if(min==='*'&&hour==='*')desc+='every minute';
else if(min==='0'&&hour==='*')desc+='every hour at :00';
else if(min==='0'&&hour!=='*'&&!hour.includes('/'))desc+='at '+hour.padStart(2,'0')+':00';
else if(min.includes('*/'))desc+='every '+min.split('/')[1]+' minutes';
else desc+='at minute '+min;

if(hour.includes('/'))desc+=' of every '+hour.split('/')[1]+' hours';
else if(hour!=='*'&&hour!=='0'&&desc.includes('every minute'))desc+=' of every hour';

if(dom!=='*')desc+=', on day '+dom+' of the month';
if(mon!=='*')desc+=', in month '+mon;
if(dow!=='*'){
const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
if(dow.includes('-')){
const s=dow.split('-');
desc+=', '+days[s[0]]+' through '+days[s[1]];
}else if(dow.includes(',')){
desc+=', on '+dow.split(',').map(d=>days[d]||d).join(', ');
}else{
desc+=', on '+(days[dow]||dow);
}
}
return desc+'.';
}

function showNextExecutions(expr){
const parts=expr.split(' ');
const list=document.getElementById('execList');
list.innerHTML='';
const now=new Date();
let count=0;
let check=new Date(now);
check.setSeconds(0);check.setMilliseconds(0);
check.setMinutes(check.getMinutes()+1);
while(count<10&&check.getTime()-now.getTime()<365*24*60*60*1000){
if(matchesCron(check,parts)){
const li=document.createElement('li');
li.textContent=check.toLocaleString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
list.appendChild(li);
count++;
}
check.setMinutes(check.getMinutes()+1);
}
}

function matchesCron(d,parts){
return matchField(d.getMinutes(),parts[0],0,59)&&matchField(d.getHours(),parts[1],0,23)&&matchField(d.getDate(),parts[2],1,31)&&matchField(d.getMonth()+1,parts[3],1,12)&&matchField(d.getDay(),parts[4],0,6);
}

function matchField(val,expr,min,max){
if(expr==='*')return true;
if(expr.includes(','))return expr.split(',').some(e=>matchField(val,e.trim(),min,max));
if(expr.includes('-')){
const[a,b]=expr.split('-').map(Number);
return val>=a&&val<=b;
}
if(expr.startsWith('*/'))return(val-min)%(parseInt(expr.split('/')[1]))===0;
return parseInt(expr)===val;
}

function setPreset(expr){
const parts=expr.split(' ');
const types=['min','hour','dom','mon','dow'];
types.forEach((t,i)=>{
const el=document.getElementById(t+'Type');
if(parts[i]==='*')el.value='*';
else if(parts[i].includes('*/'))el.value='every';
else if(parts[i].includes('-'))el.value='range';
else if(parts[i].includes(','))el.value='list';
else el.value='specific';
updateSub(t);
const sub=document.getElementById(t+'Sub');
const input=sub.querySelector('input');
if(input){
if(parts[i].includes('*/'))input.value=parts[i].split('/')[1];
else if(parts[i].includes('-')){const[r1,r2]=parts[i].split('-');input.value=r1;if(input.nextElementSibling)input.nextElementSibling.value=r2}
else if(parts[i].includes(','))input.value=parts[i];
else input.value=parts[i];
}
});
buildCron();
}

// Init
['min','hour','dom','mon','dow'].forEach(f=>updateSub(f));
showNextExecutions('* * * * *');
</script>
</body>
</html>
