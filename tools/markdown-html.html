<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown to HTML</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#3b82f6;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.toolbar{padding:16px 40px;display:flex;gap:12px;border-bottom:1px solid var(--border)}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.container{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0}
.pane{display:flex;flex-direction:column;border-right:1px solid var(--border)}
.pane:last-child{border-right:none}
.pane-header{padding:12px 20px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
textarea{flex:1;background:var(--bg);color:var(--text);border:none;padding:20px;font-family:var(--mono);font-size:13px;line-height:1.6;resize:none;outline:none}
.output{flex:1;padding:20px;font-size:13px;line-height:1.6;overflow:auto;white-space:pre-wrap;word-break:break-all;font-family:var(--mono)}
.preview{flex:1;padding:20px;overflow:auto;line-height:1.7}
.preview h1,.preview h2,.preview h3{margin:12px 0 8px}
.preview h1{font-size:24px} .preview h2{font-size:20px} .preview h3{font-size:16px}
.preview p{margin:8px 0;color:#ccc}
.preview code{background:var(--surface);padding:2px 6px;border-radius:3px;font-family:var(--mono);font-size:12px}
.preview pre{background:var(--surface);padding:12px;border-radius:var(--radius);overflow-x:auto}
.preview pre code{background:none;padding:0}
.preview blockquote{border-left:3px solid var(--border);padding-left:12px;color:var(--muted)}
.preview a{color:#3b82f6}
@media(max-width:768px){.container{grid-template-columns:1fr}.pane{min-height:40vh}.pane:last-child{border-top:1px solid var(--border)}}
</style>
</head>
<body>
<header><h1>Markdown to HTML</h1><a href="index.html">← Back to Tools</a></header>
<div class="toolbar">
<button class="btn primary" onclick="convert()">Convert</button>
<button class="btn" onclick="copyHtml()">Copy HTML</button>
<button class="btn" onclick="copyStyled()">Copy Styled HTML</button>
</div>
<div class="container">
<div class="pane">
<div class="pane-header">Markdown</div>
<textarea id="input" oninput="convert()" placeholder="Type markdown..."># Hello World

This is **bold** and *italic* text.

## Features
- Item one
- Item two
- Item three

```javascript
console.log("Hello");
```

> This is a blockquote

[Link](https://example.com)</textarea>
</div>
<div class="pane" style="border-right:none">
<div class="pane-header" id="viewTab">
<span style="cursor:pointer" onclick="showView('preview')" id="tabPreview">Preview</span> | 
<span style="cursor:pointer" onclick="showView('html')" id="tabHtml">HTML</span>
</div>
<div class="preview" id="previewView"></div>
<div class="output" id="htmlView" style="display:none"></div>
</div>
</div>
<script>
function convert(){
const md=document.getElementById('input').value;
let html=md
.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
.replace(/^###### (.+)$/gm,'<h6>$1</h6>')
.replace(/^##### (.+)$/gm,'<h5>$1</h5>')
.replace(/^#### (.+)$/gm,'<h4>$1</h4>')
.replace(/^### (.+)$/gm,'<h3>$1</h3>')
.replace(/^## (.+)$/gm,'<h2>$1</h2>')
.replace(/^# (.+)$/gm,'<h1>$1</h1>')
.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
.replace(/\*(.+?)\*/g,'<em>$1</em>')
.replace(/`([^`]+)`/g,'<code>$1</code>')
.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
.replace(/^- (.+)$/gm,'<li>$1</li>')
.replace(/\n\n/g,'</p><p>');
html='<p>'+html+'</p>';
document.getElementById('previewView').innerHTML=html;
document.getElementById('htmlView').textContent=html.replace(/<\/p><p>/g,'\n\n').replace(/<p>/g,'').replace(/<\/p>/g,'');
}
function showView(v){document.getElementById('previewView').style.display=v==='preview'?'block':'none';document.getElementById('htmlView').style.display=v==='html'?'block':'none'}
function copyHtml(){navigator.clipboard.writeText(document.getElementById('htmlView').textContent)}
function copyStyled(){navigator.clipboard.writeText(document.getElementById('htmlView').textContent)}
convert();
</script>
</body>
</html>
