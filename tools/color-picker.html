<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Picker & Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:900px;width:100%;margin:0 auto}
.preview{width:100%;height:200px;border-radius:12px;border:1px solid var(--border);margin-bottom:24px;transition:background .3s}
.picker-row{display:flex;gap:20px;align-items:center;margin-bottom:24px}
.picker-row input[type=color]{width:60px;height:60px;border:none;border-radius:var(--radius);cursor:pointer;background:none}
.picker-row input[type=text]{flex:1;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-family:var(--mono);font-size:16px;outline:none}
.picker-row input[type=text]:focus{border-color:#444}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:var(--radius);font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#444;background:#1a1a1a}
.formats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.format-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s}
.format-card:hover{border-color:#444}
.format-card .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
.format-card .value{font-family:var(--mono);font-size:13px;word-break:break-all}
.format-card .value.copied{color:#22c55e}
.shades{margin-top:24px}
.shades h3{font-size:14px;font-weight:500;margin-bottom:12px;color:var(--muted)}
.shade-row{display:flex;gap:0;border-radius:8px;overflow:hidden}
.shade{flex:1;height:60px;cursor:pointer;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10px;font-family:var(--mono);opacity:0;transition:opacity .2s}
.shade:hover{opacity:1}

@media(max-width:768px){header{padding:20px 16px}header h1{font-size:16px}.content{padding:20px 16px}.container{padding:16px}}
</style>
</head>
<body>
<header>
<h1>Color Picker</h1>
<a href="index.html">← Back to Tools</a>
</header>
<div class="content">
<div class="preview" id="preview"></div>
<div class="picker-row">
<input type="color" id="picker" value="#3b82f6" oninput="update(this.value)">
<input type="text" id="hexInput" value="#3b82f6" oninput="fromHex(this.value)" placeholder="#000000">
<button class="btn" onclick="randomColor()">Random</button>
</div>
<div class="formats" id="formats"></div>
<div class="shades"><h3>Shades & Tints</h3><div class="shade-row" id="shades"></div></div>
</div>
<script>
const picker=document.getElementById('picker'),preview=document.getElementById('preview'),hexInput=document.getElementById('hexInput'),formats=document.getElementById('formats'),shadesEl=document.getElementById('shades');
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b}}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),l=(max+min)/2;let h,s;if(max===min){h=s=0}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)}}
function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)};const toHex=x=>Math.round(x*255).toString(16).padStart(2,'0');return`#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`}
function update(hex){if(!/^#[0-9a-f]{6}$/i.test(hex))return;preview.style.background=hex;picker.value=hex;hexInput.value=hex.toUpperCase();const{r,g,b}=hexToRgb(hex);const{h,s,l}=rgbToHsl(r,g,b);formats.innerHTML=[
{l:'HEV',v:hex.toUpperCase()},{l:'RGB',v:`rgb(${r}, ${g}, ${b})`},{l:'HSL',v:`hsl(${h}, ${s}%, ${l}%)`},{l:'RGBA',v:`rgba(${r}, ${g}, ${b}, 1)`},
{l:'HEX 8',v:hex+'ff'},{l:'CMYK',v:`cmyk(${Math.round((1-r/255)*100)}%, ${Math.round((1-g/255)*100)}%, ${Math.round((1-b/255)*100)}%, 0%)`}
].map(f=>`<div class="format-card" onclick="copyVal(this)"><div class="label">${f.l}</div><div class="value">${f.v}</div></div>`).join('');let shades='';for(let i=900;i>=100;i-=100){const sh=hslToHex(h,Math.min(100,s+i>100?100:s),l>50?Math.min(95,l+(100-i)/10):Math.max(5,l-(i/15)));shades+=`<div class="shade" style="background:${sh}" onclick="update('${sh}')">${sh}</div>`}shadesEl.innerHTML=shades}
function fromHex(v){if(/^#[0-9a-f]{6}$/i.test(v))update(v)}
function copyVal(el){const v=el.querySelector('.value').textContent;navigator.clipboard.writeText(v);el.querySelector('.value').classList.add('copied');setTimeout(()=>el.querySelector('.value').classList.remove('copied'),1000)}
function randomColor(){update('#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'))}
update('#3b82f6');
</script>
</body>
</html>
