<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Text Shadow Generator - ProtonFlix Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;padding:20px}
a{color:#fff;text-decoration:none}
.container{max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#111;border:1px solid #222;border-radius:12px;margin-bottom:24px}
header h1{font-size:1.3rem;font-weight:600}
header a{font-size:.9rem;color:#737373;transition:color .2s}
header a:hover{color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:768px){.grid{grid-template-columns:1fr}}
.panel{background:#111;border:1px solid #222;border-radius:12px;padding:24px}
.panel h2{font-size:1.1rem;font-weight:500;margin-bottom:20px;color:#737373}
.preview-box{background:#000;border:1px solid #222;border-radius:12px;padding:60px 40px;text-align:center;min-height:200px;display:flex;align-items:center;justify-content:center}
.preview-text{font-size:3rem;font-weight:700;font-family:'Outfit',sans-serif}
.control-group{margin-bottom:16px}
.control-group label{display:block;font-size:.85rem;color:#737373;margin-bottom:6px}
.control-group input[type="range"]{width:100%;accent-color:#fff;height:4px;background:#222;border-radius:2px;outline:none;-webkit-appearance:none}
.control-group input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#fff;border-radius:50%;cursor:pointer}
.control-group input[type="color"]{width:100%;height:36px;border:1px solid #222;border-radius:6px;background:#111;cursor:pointer;padding:2px}
.control-group input[type="text"]{width:100%;padding:10px 12px;background:#0a0a0a;border:1px solid #222;border-radius:6px;color:#fff;font-family:'Outfit',sans-serif;font-size:.9rem;outline:none}
.control-group input[type="text"]:focus{border-color:#444}
.row{display:flex;gap:12px;align-items:flex-end}
.row .control-group{flex:1}
.shadow-item{background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:16px;margin-bottom:12px;position:relative}
.shadow-item .remove-btn{position:absolute;top:8px;right:8px;background:none;border:none;color:#737373;cursor:pointer;font-size:1.1rem;line-height:1}
.shadow-item .remove-btn:hover{color:#ff4444}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.preset-btn{padding:8px 14px;background:#1a1a1a;border:1px solid #222;border-radius:6px;color:#fff;font-family:'Outfit',sans-serif;font-size:.8rem;cursor:pointer;transition:all .2s}
.preset-btn:hover{background:#222;border-color:#444}
.add-shadow-btn{width:100%;padding:10px;background:#1a1a1a;border:1px dashed #333;border-radius:8px;color:#737373;font-family:'Outfit',sans-serif;font-size:.9rem;cursor:pointer;transition:all .2s;margin-bottom:16px}
.add-shadow-btn:hover{background:#222;color:#fff;border-color:#555}
.css-output{position:relative;background:#0a0a0a;border:1px solid #222;border-radius:8px;padding:16px;font-family:'Courier New',monospace;font-size:.85rem;color:#a8ff60;white-space:pre-wrap;word-break:break-all;min-height:60px;cursor:pointer;transition:border-color .2s}
.css-output:hover{border-color:#444}
.css-output .copy-hint{position:absolute;top:8px;right:12px;font-size:.7rem;color:#737373;font-family:'Outfit',sans-serif}
.css-output.copied{border-color:#a8ff60}
.css-output.copied .copy-hint{color:#a8ff60}
.text-input-area{margin-bottom:16px}
</style>
</head>
<body>
<div class="container">
<header>
<h1>CSS Text Shadow Generator</h1>
<a href="index.html">← Back to Tools</a>
</header>
<div class="grid">
<div class="panel">
<h2>Controls</h2>
<div class="text-input-area">
<label style="display:block;font-size:.85rem;color:#737373;margin-bottom:6px">Preview Text</label>
<input type="text" id="previewText" value="ProtonFlix" style="width:100%;padding:10px 12px;background:#0a0a0a;border:1px solid #222;border-radius:6px;color:#fff;font-family:'Outfit',sans-serif;font-size:.9rem;outline:none">
</div>
<h2 style="margin-top:8px">Presets</h2>
<div class="presets">
<button class="preset-btn" onclick="applyPreset('neon')">Neon Glow</button>
<button class="preset-btn" onclick="applyPreset('3d')">3D Text</button>
<button class="preset-btn" onclick="applyPreset('retro')">Retro Shadow</button>
<button class="preset-btn" onclick="applyPreset('subtle')">Subtle</button>
<button class="preset-btn" onclick="applyPreset('outline')">Outline</button>
</div>
<div id="shadows-container"></div>
<button class="add-shadow-btn" onclick="addShadow()">+ Add Shadow Layer</button>
</div>
<div>
<div class="panel" style="margin-bottom:24px">
<h2>Live Preview</h2>
<div class="preview-box">
<div class="preview-text" id="preview">ProtonFlix</div>
</div>
</div>
<div class="panel">
<h2>CSS Output</h2>
<div class="css-output" id="cssOutput" onclick="copyCSS()"><span class="copy-hint">Click to copy</span></div>
</div>
</div>
</div>
</div>
<script>
let shadows=[];
let shadowId=0;

const presets={
neon:[{h:0,v:0,blur:10,spread:0,color:'#ff00ff',opacity:1},{h:0,v:0,blur:20,spread:0,color:'#ff00ff',opacity:.7},{h:0,v:0,blur:40,spread:0,color:'#ff00ff',opacity:.4},{h:0,v:0,blur:80,spread:0,color:'#ff00ff',opacity:.2}],
'3d':[{h:-1,v:-1,blur:0,spread:0,color:'#333',opacity:1},{h:2,v:2,blur:0,spread:0,color:'#222',opacity:1},{h:3,v:3,blur:0,spread:0,color:'#111',opacity:1},{h:4,v:4,blur:0,spread:0,color:'#000',opacity:1}],
retro:[{h:4,v:4,blur:0,spread:0,color:'#ff6b35',opacity:1}],
subtle:[{h:1,v:1,blur:3,spread:0,color:'#000',opacity:.5}],
outline:[{h:0,v:0,blur:0,spread:0,color:'#fff',opacity:1}]
};

function addShadow(data){
const id=shadowId++;
const s=data||{h:0,v:0,blur:5,spread:0,color:'#000000',opacity:1};
shadows.push({id,...s});
renderShadows();
update();
}

function removeShadow(id){
shadows=shadows.filter(s=>s.id!==id);
renderShadows();
update();
}

function renderShadows(){
const c=document.getElementById('shadows-container');
c.innerHTML=shadows.map((s,i)=>`
<div class="shadow-item">
<button class="remove-btn" onclick="removeShadow(${s.id})">×</button>
<div style="font-size:.8rem;color:#737373;margin-bottom:12px">Shadow ${i+1}</div>
<div class="row">
<div class="control-group">
<label>H-Offset: <span id="h-val-${s.id}">${s.h}</span></label>
<input type="range" min="-50" max="50" value="${s.h}" oninput="updateShadow(${s.id},'h',this.value)">
</div>
<div class="control-group">
<label>V-Offset: <span id="v-val-${s.id}">${s.v}</span></label>
<input type="range" min="-50" max="50" value="${s.v}" oninput="updateShadow(${s.id},'v',this.value)">
</div>
</div>
<div class="row">
<div class="control-group">
<label>Blur: <span id="blur-val-${s.id}">${s.blur}</span></label>
<input type="range" min="0" max="100" value="${s.blur}" oninput="updateShadow(${s.id},'blur',this.value)">
</div>
<div class="control-group">
<label>Spread: <span id="spread-val-${s.id}">${s.spread}</span></label>
<input type="range" min="-50" max="50" value="${s.spread}" oninput="updateShadow(${s.id},'spread',this.value)">
</div>
</div>
<div class="row">
<div class="control-group">
<label>Color</label>
<input type="color" value="${s.color}" oninput="updateShadow(${s.id},'color',this.value)">
</div>
<div class="control-group">
<label>Opacity: <span id="opacity-val-${s.id}">${s.opacity}</span></label>
<input type="range" min="0" max="1" step="0.01" value="${s.opacity}" oninput="updateShadow(${s.id},'opacity',this.value)">
</div>
</div>
</div>
`).join('');
}

function updateShadow(id,prop,val){
const s=shadows.find(s=>s.id===id);
if(!s)return;
s[prop]=prop==='color'?val:parseFloat(val);
const el=document.getElementById(`${prop}-val-${id}`);
if(el)el.textContent=val;
update();
}

function hexToRgba(hex,a){
const r=parseInt(hex.slice(1,3),16);
const g=parseInt(hex.slice(3,5),16);
const b=parseInt(hex.slice(5,7),16);
return`rgba(${r},${g},${b},${a})`;
}

function buildCSS(){
if(!shadows.length)return'none';
return shadows.map(s=>{
const color=hexToRgba(s.color,s.opacity);
return`${s.h}px ${s.v}px ${s.blur}px ${s.spread}px ${color}`;
}).join(',\n    ');
}

function update(){
const css=buildCSS();
const preview=document.getElementById('preview');
const output=document.getElementById('cssOutput');
preview.style.textShadow=css;
output.innerHTML=`<span class="copy-hint">Click to copy</span>text-shadow: ${css};`;
}

function copyCSS(){
const css=`text-shadow: ${buildCSS()};`;
navigator.clipboard.writeText(css).then(()=>{
const el=document.getElementById('cssOutput');
el.classList.add('copied');
el.querySelector('.copy-hint').textContent='Copied!';
setTimeout(()=>{el.classList.remove('copied');el.querySelector('.copy-hint').textContent='Click to copy';},1500);
});
}

function applyPreset(name){
shadows=[];
shadowId=0;
const p=presets[name];
p.forEach(s=>addShadow(s));
}

document.getElementById('previewText').addEventListener('input',function(){
document.getElementById('preview').textContent=this.value;
});

addShadow({h:0,v:0,blur:10,spread:0,color:'#ff00ff',opacity:0.8});
</script>
</body>
</html>
