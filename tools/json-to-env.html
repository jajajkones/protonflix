<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON to .env Converter</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c0c0c;color:#e5e5e5;min-height:100vh;padding:20px}
a{color:#e5e5e5;text-decoration:none}
a:hover{text-decoration:underline}
.header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #262626}
.header h1{font-size:1.4rem;font-weight:600}
.back{color:#737373;font-size:.875rem}
.back:hover{color:#e5e5e5}
.container{max-width:1000px;margin:0 auto}
.panel{background:#141414;border:1px solid #262626;border-radius:8px;padding:20px;margin-bottom:16px}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{background:#1a1a1a;border:1px solid #262626;border-radius:6px 6px 0 0;padding:8px 16px;color:#737373;font-size:.8rem;cursor:pointer;border-bottom:none}
.tab.active{background:#141414;color:#e5e5e5;border-color:#262626}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:#737373;margin-bottom:8px;font-weight:600}
textarea{width:100%;background:#1a1a1a;border:1px solid #262626;border-radius:6px;padding:10px;color:#e5e5e5;font-family:monospace;font-size:.85rem;resize:vertical;height:250px}
textarea:focus{outline:none;border-color:#555}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{background:#1a1a1a;border:1px solid #262626;border-radius:6px;padding:8px 16px;color:#e5e5e5;font-size:.8rem;cursor:pointer;font-family:inherit}
button:hover{background:#262626}
button.primary{background:#e5e5e5;color:#0c0c0c;border-color:#e5e5e5}
button.primary:hover{background:#d4d4d4}
.error{color:#ef4444;font-size:.8rem;margin-top:8px}
.toast{position:fixed;bottom:20px;right:20px;background:#262626;color:#e5e5e5;padding:10px 20px;border-radius:6px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.arrow{text-align:center;color:#737373;font-size:1.2rem;padding:8px 0}
</style>
</head>
<body>
<div class="container">
<div class="header">
<a href="index.html" class="back">&larr; Back</a>
<h1>JSON &harr; .env Converter</h1>
</div>
<div class="panel">
<div class="tabs">
<div class="tab active" onclick="switchTab('j2e',this)">JSON &rarr; .env</div>
<div class="tab" onclick="switchTab('e2j',this)">.env &rarr; JSON</div>
</div>
<div id="j2e">
<div class="label">Paste JSON Object</div>
<textarea id="jsonInput" placeholder='{"DB_HOST":"localhost","DB_PORT":5432,"APP":{"NAME":"MyApp","DEBUG":true},"COLORS":["red","blue"]}'></textarea>
<div class="btn-row">
<button class="primary" onclick="jsonToEnv()">Convert to .env</button>
<button onclick="loadSampleJSON()">Load Sample</button>
</div>
<div class="arrow">&darr;</div>
<div class="label">Generated .env File</div>
<textarea id="envOutput" readonly placeholder=".env output will appear here..."></textarea>
<div class="btn-row">
<button onclick="copyOutput('envOutput')">Copy</button>
<button onclick="downloadFile('envOutput','.env')">Download .env</button>
</div>
</div>
<div id="e2j" style="display:none">
<div class="label">Paste .env Content</div>
<textarea id="envInput" placeholder="DB_HOST=localhost&#10;DB_PORT=5432&#10;APP_NAME=MyApp"></textarea>
<div class="btn-row">
<button class="primary" onclick="envToJson()">Convert to JSON</button>
<button onclick="loadSampleEnv()">Load Sample</button>
</div>
<div class="arrow">&darr;</div>
<div class="label">Generated JSON</div>
<textarea id="jsonOutput" readonly placeholder="JSON output will appear here..."></textarea>
<div class="btn-row">
<button onclick="copyOutput('jsonOutput')">Copy</button>
<button onclick="downloadFile('jsonOutput','.json')">Download .json</button>
</div>
</div>
<div class="error" id="error"></div>
</div>
</div>
<div class="toast" id="toast">Copied!</div>
<script>
function switchTab(id,el){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
document.getElementById('j2e').style.display=id==='j2e'?'block':'none';
document.getElementById('e2j').style.display=id==='e2j'?'block':'none';
document.getElementById('error').textContent='';
}
function setError(msg){document.getElementById('error').textContent=msg}
function jsonToEnv(){
setError('');
try{
const obj=JSON.parse(document.getElementById('jsonInput').value);
if(typeof obj!=='object'||Array.isArray(obj)){setError('Input must be a JSON object');return}
const lines=[];
flatten(obj,'',lines);
document.getElementById('envOutput').value=lines.join('\n');
}catch(e){setError('Invalid JSON: '+e.message)}
}
function flatten(obj,prefix,lines){
Object.entries(obj).forEach(([k,v])=>{
const key=prefix?`${prefix}_${k.toUpperCase()}`:k.toUpperCase();
if(v&&typeof v==='object'&&!Array.isArray(v)){
flatten(v,key,lines);
}else if(Array.isArray(v)){
lines.push(`${key}=${v.join(',')}`);
}else{
lines.push(`${key}=${formatVal(v)}`);
}
});
}
function formatVal(v){
if(typeof v==='boolean')return v.toString();
if(typeof v==='number')return v.toString();
if(typeof v==='string'){
if(v.includes(' ')||v.includes('#')||v.includes('"'))return `"${v.replace(/"/g,'\\"')}"`;
return v;
}
return String(v);
}
function envToJson(){
setError('');
try{
const text=document.getElementById('envInput').value;
const lines=text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
const result={};
lines.forEach(line=>{
const eq=line.indexOf('=');
if(eq===-1)return;
const key=line.substring(0,eq).trim();
let val=line.substring(eq+1).trim();
if(val.startsWith('"')&&val.endsWith('"'))val=val.slice(1,-1);
else if(val.startsWith("'")&&val.endsWith("'"))val=val.slice(1,-1);
else if(val==='true')val=true;
else if(val==='false')val=false;
else if(!isNaN(val)&&val!=='')val=Number(val);
const parts=key.split('_');
let current=result;
parts.forEach((p,i)=>{
if(i===parts.length-1){current[p]=val;}
else{
if(!current[p]||typeof current[p]!=='object')current[p]={};
current=current[p];
}
});
});
document.getElementById('jsonOutput').value=JSON.stringify(result,null,2);
}catch(e){setError('Error: '+e.message)}
}
function loadSampleJSON(){
document.getElementById('jsonInput').value=JSON.stringify({
"DB_HOST":"localhost",
"DB_PORT":5432,
"DB_NAME":"myapp",
"APP":{"NAME":"MyApp","DEBUG":true,"VERSION":"1.0.0"},
"REDIS_URL":"redis://localhost:6379",
"CORS_ORIGINS":["http://localhost:3000","https://example.com"],
"API_KEY":"sk-1234567890abcdef"
},null,2);
}
function loadSampleEnv(){
document.getElementById('envInput').value=`# Database
DB_HOST=localhost
DB_PORT=5432
DB_NAME=myapp

# App
APP_NAME=MyApp
APP_DEBUG=true
APP_VERSION=1.0.0

# Redis
REDIS_URL=redis://localhost:6379

# CORS
CORS_ORIGINS=http://localhost:3000,https://example.com

# Keys
API_KEY=sk-1234567890abcdef`;
}
function copyOutput(id){
navigator.clipboard.writeText(document.getElementById(id).value).then(()=>{showToast()});
}
function downloadFile(id,ext){
const blob=new Blob([document.getElementById(id).value],{type:'text/plain'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='output'+ext;a.click();
}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
</script>
</body>
</html>
