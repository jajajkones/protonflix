<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Web App Manifest Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 2rem;
        }
        .header {
            max-width: 900px;
            margin: 0 auto 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #222;
        }
        .header h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; }
        .header a { color: #737373; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
        .header a:hover { color: #fff; }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .panel {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 1.5rem;
        }
        .panel h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 1.2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.85rem; color: #737373; margin-bottom: 0.4rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 6px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #444; }
        .form-group select option { background: #111; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group input[type="color"] { height: 38px; padding: 4px; cursor: pointer; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .toggle-group:last-child { border-bottom: none; }
        .toggle-group span { font-size: 0.85rem; color: #737373; }
        .toggle {
            position: relative;
            width: 40px;
            height: 22px;
            cursor: pointer;
        }
        .toggle input { display: none; }
        .toggle .slider {
            position: absolute;
            inset: 0;
            background: #222;
            border-radius: 11px;
            transition: background 0.2s;
        }
        .toggle .slider::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            left: 3px;
            top: 3px;
            background: #737373;
            border-radius: 50%;
            transition: transform 0.2s, background 0.2s;
        }
        .toggle input:checked + .slider { background: #333; }
        .toggle input:checked + .slider::before { transform: translateX(18px); background: #fff; }
        .icon-preview {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #737373;
            text-align: center;
            padding: 0.5rem;
        }
        .btn {
            padding: 0.7rem 1.2rem;
            border: 1px solid #222;
            border-radius: 6px;
            background: #111;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #1a1a1a; border-color: #333; }
        .btn-primary { background: #fff; color: #0a0a0a; border-color: #fff; }
        .btn-primary:hover { background: #e0e0e0; }
        .btn-group { display: flex; gap: 0.5rem; margin-top: 1.5rem; }
        pre {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            font-size: 0.8rem;
            line-height: 1.5;
            max-height: 500px;
            overflow-y: auto;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        pre:hover { border-color: #444; }
        .copy-toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #222;
            color: #fff;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 100;
        }
        .copy-toast.show { opacity: 1; transform: translateY(0); }
        .html-snippet {
            margin-top: 1rem;
            padding: 1rem;
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            font-size: 0.8rem;
            color: #737373;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .html-snippet:hover { border-color: #444; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>PWA Web App Manifest Generator</h1>
        <a href="index.html">← Back to ProtonFlix Tools</a>
    </div>

    <div class="container">
        <div class="panel">
            <h2>App Info</h2>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" value="My App" oninput="generate()">
            </div>
            <div class="form-group">
                <label>Short Name</label>
                <input type="text" id="shortName" value="App" oninput="generate()">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" oninput="generate()">A progressive web app</textarea>
            </div>
            <div class="form-group">
                <label>Start URL</label>
                <input type="text" id="startUrl" value="/" oninput="generate()">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Theme Color</label>
                    <input type="color" id="themeColor" value="#0a0a0a" oninput="generate()">
                </div>
                <div class="form-group">
                    <label>Background Color</label>
                    <input type="color" id="bgColor" value="#0a0a0a" oninput="generate()">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Display</label>
                    <select id="display" onchange="generate()">
                        <option value="standalone" selected>standalone</option>
                        <option value="fullscreen">fullscreen</option>
                        <option value="minimal-ui">minimal-ui</option>
                        <option value="browser">browser</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Orientation</label>
                    <select id="orientation" onchange="generate()">
                        <option value="any" selected>any</option>
                        <option value="natural">natural</option>
                        <option value="landscape">landscape</option>
                        <option value="portrait">portrait</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Scope</label>
                <input type="text" id="scope" placeholder="/" oninput="generate()">
            </div>
            <div class="form-group">
                <label>Categories</label>
                <input type="text" id="categories" placeholder="education, productivity" oninput="generate()">
            </div>
        </div>

        <div class="panel">
            <h2>Icons</h2>
            <div class="form-group">
                <label>Icon 192x192 URL</label>
                <input type="text" id="icon192" placeholder="/icons/icon-192.png" oninput="generate()">
            </div>
            <div class="form-group">
                <label>Icon 512x512 URL</label>
                <input type="text" id="icon512" placeholder="/icons/icon-512.png" oninput="generate()">
            </div>
            <div class="icon-preview">
                <div class="icon-box">192×192<br>icon</div>
                <div class="icon-box">512×512<br>icon</div>
            </div>

            <h2 style="margin-top:1.5rem;">Shortcuts</h2>
            <div class="toggle-group">
                <span>Include shortcuts array</span>
                <label class="toggle"><input type="checkbox" id="includeShortcuts" onchange="generate()"><span class="slider"></span></label>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="copyOutput()">Copy manifest.json</button>
                <button class="btn" onclick="downloadOutput()">Download</button>
            </div>

            <div class="html-snippet" id="htmlSnippet" onclick="copySnippet()" title="Click to copy">
                &lt;!-- Add to your &lt;head&gt; --&gt;<br>
                <span id="snippetContent"></span>
            </div>
        </div>
    </div>

    <div style="max-width:900px;margin:2rem auto 0;">
        <div class="panel">
            <h2>Preview</h2>
            <pre id="output" onclick="copyOutput()"></pre>
        </div>
    </div>

    <div class="copy-toast" id="toast">Copied to clipboard!</div>

    <script>
        function generate() {
            const manifest = {};
            manifest.name = document.getElementById('name').value || 'My App';
            manifest.short_name = document.getElementById('shortName').value || 'App';
            const desc = document.getElementById('description').value;
            if (desc) manifest.description = desc;
            manifest.start_url = document.getElementById('startUrl').value || '/';
            manifest.display = document.getElementById('display').value;
            manifest.orientation = document.getElementById('orientation').value;
            manifest.theme_color = document.getElementById('themeColor').value;
            manifest.background_color = document.getElementById('bgColor').value;

            const scope = document.getElementById('scope').value;
            if (scope) manifest.scope = scope;

            const cats = document.getElementById('categories').value.trim();
            if (cats) manifest.categories = cats.split(',').map(c => c.trim());

            manifest.icons = [];
            const i192 = document.getElementById('icon192').value;
            const i512 = document.getElementById('icon512').value;
            if (i192) manifest.icons.push({ src: i192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' });
            if (i512) manifest.icons.push({ src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' });

            if (document.getElementById('includeShortcuts').checked) {
                manifest.shortcuts = [
                    { name: 'Home', url: '/', icons: [{ src: i192 || '/icon.png', sizes: '192x192' }] }
                ];
            }

            const json = JSON.stringify(manifest, null, 2);
            document.getElementById('output').textContent = json;

            const snippet = `<link rel="manifest" href="/manifest.json">\n<meta name="theme-color" content="${manifest.theme_color}">`;
            document.getElementById('snippetContent').textContent = snippet;
        }

        function copyOutput() {
            const text = document.getElementById('output').textContent;
            navigator.clipboard.writeText(text).then(() => showToast());
        }

        function copySnippet() {
            const text = document.getElementById('snippetContent').textContent;
            navigator.clipboard.writeText(text).then(() => showToast());
        }

        function downloadOutput() {
            const text = document.getElementById('output').textContent;
            const blob = new Blob([text], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'manifest.json';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        generate();
    </script>
</body>
</html>
