<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center}
a{color:#fff;text-decoration:none}
.header{width:100%;background:#111;border-bottom:1px solid #222;padding:16px 24px;display:flex;align-items:center;gap:16px}
.header h1{font-size:1.2rem;font-weight:600}
.back{padding:6px 12px;border:1px solid #222;border-radius:6px;font-size:.85rem;transition:.2s}
.back:hover{background:#222}
.container{width:100%;max-width:500px;margin:40px auto;padding:0 20px}
.panel{background:#111;border:1px solid #222;border-radius:12px;padding:28px}
.field{margin-bottom:20px}
.field label{display:block;font-size:.85rem;color:#737373;margin-bottom:8px}
.field input{width:100%;padding:14px 16px;background:#0a0a0a;border:1px solid #222;border-radius:8px;color:#fff;font-family:inherit;font-size:1.3rem;outline:none;text-align:center}
.field input:focus{border-color:#555}
.results{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0a0a0a;border:1px solid #222;border-radius:8px}
.result-label{font-size:.85rem;color:#737373}
.result-value{font-size:1.3rem;font-weight:600}
.formula{margin-top:16px;padding:12px 16px;background:#0a0a0a;border:1px solid #222;border-radius:8px;font-size:.75rem;color:#737373;line-height:1.6}
.formula strong{color:#fff}
</style>
</head>
<body>
<div class="header">
<a href="index.html" class="back">← Back</a>
<h1>Temperature Converter</h1>
</div>
<div class="container">
<div class="panel">
<div class="field">
<label>Celsius (°C)</label>
<input id="celsius" type="number" placeholder="0" oninput="fromC(this.value,'c')">
</div>
<div class="field">
<label>Fahrenheit (°F)</label>
<input id="fahrenheit" type="number" placeholder="32" oninput="fromC(this.value,'f')">
</div>
<div class="field">
<label>Kelvin (K)</label>
<input id="kelvin" type="number" placeholder="273.15" oninput="fromC(this.value,'k')">
</div>
<div class="results">
<div class="result-row">
<span class="result-label">Celsius</span>
<span class="result-value" id="outC">0 °C</span>
</div>
<div class="result-row">
<span class="result-label">Fahrenheit</span>
<span class="result-value" id="outF">32 °F</span>
</div>
<div class="result-row">
<span class="result-label">Kelvin</span>
<span class="result-value" id="outK">273.15 K</span>
</div>
</div>
<div class="formula" id="formula"></div>
</div>
</div>
<script>
function fromC(val,src){
let c;
if(src==='c')c=parseFloat(val);
else if(src==='f')c=(parseFloat(val)-32)*5/9;
else c=parseFloat(val)-273.15;
if(isNaN(c)){document.getElementById('formula').innerHTML='<strong style="color:#ef4444">Please enter a valid number</strong>';return;}
if(src!=='c')document.getElementById('celsius').value=c.toFixed(2);
if(src!=='f')document.getElementById('fahrenheit').value=(c*9/5+32).toFixed(2);
if(src!=='k')document.getElementById('kelvin').value=(c+273.15).toFixed(2);
document.getElementById('outC').textContent=c.toFixed(2)+' °C';
document.getElementById('outF').textContent=(c*9/5+32).toFixed(2)+' °F';
document.getElementById('outK').textContent=(c+273.15).toFixed(2)+' K';
document.getElementById('formula').innerHTML=
`<strong>Formulas:</strong><br>`+
`°F = °C × 9/5 + 32<br>`+
`K = °C + 273.15<br><br>`+
`<strong>Current:</strong> ${c.toFixed(2)}°C = ${(c*9/5+32).toFixed(2)}°F = ${(c+273.15).toFixed(2)}K`;
}
fromC(0,'c');
</script>
</body>
</html>
