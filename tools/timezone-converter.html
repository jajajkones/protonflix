<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timezone Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #222;
        }
        .header h1 { font-size: 1.8rem; font-weight: 600; }
        .header a {
            color: #737373;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .header a:hover { color: #fff; }
        .container { max-width: 1000px; margin: 0 auto; }
        .input-section {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .input-row {
            display: flex;
            gap: 16px;
            align-items: end;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            color: #737373;
            font-size: 0.85rem;
        }
        input, select {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #444;
        }
        select { cursor: pointer; min-width: 200px; }
        button {
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 24px;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #333; }
        .toggle-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .toggle-btn {
            padding: 8px 16px;
            font-size: 0.85rem;
        }
        .toggle-btn.active {
            background: #fff;
            color: #0a0a0a;
        }
        .world-clock {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .clock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .clock-card {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .clock-card:hover {
            border-color: #444;
        }
        .clock-label {
            font-size: 0.8rem;
            color: #737373;
            margin-bottom: 4px;
        }
        .clock-time {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .clock-date {
            font-size: 0.75rem;
            color: #737373;
        }
        .copied-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            border: 1px solid #333;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .copied-toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Timezone Converter</h1>
            <a href="index.html">&larr; Back to Tools</a>
        </div>

        <div class="input-section">
            <div class="input-row">
                <div class="input-group">
                    <label>Date & Time</label>
                    <input type="datetime-local" id="inputDateTime">
                </div>
                <div class="input-group">
                    <label>From Timezone</label>
                    <select id="sourceTimezone"></select>
                </div>
                <button onclick="convertTime()">Convert</button>
            </div>
        </div>

        <div class="toggle-section">
            <button class="toggle-btn active" id="btn24h" onclick="setFormat('24h')">24 Hour</button>
            <button class="toggle-btn" id="btn12h" onclick="setFormat('12h')">12 Hour</button>
        </div>

        <div class="world-clock">
            <div class="clock-grid" id="clockGrid"></div>
        </div>
    </div>

    <div class="copied-toast" id="toast">Copied!</div>

    <script>
        const timezones = [
            { name: 'UTC', offset: 0, label: 'UTC' },
            { name: 'US Eastern', offset: -5, label: 'US Eastern (EST)' },
            { name: 'US Central', offset: -6, label: 'US Central (CST)' },
            { name: 'US Mountain', offset: -7, label: 'US Mountain (MST)' },
            { name: 'US Pacific', offset: -8, label: 'US Pacific (PST)' },
            { name: 'UK', offset: 0, label: 'UK (GMT)' },
            { name: 'CET', offset: 1, label: 'CET (Central Europe)' },
            { name: 'IST', offset: 5.5, label: 'IST (India)' },
            { name: 'JST', offset: 9, label: 'JST (Japan)' },
            { name: 'AEST', offset: 10, label: 'AEST (Australia East)' },
            { name: 'New Zealand', offset: 12, label: 'New Zealand (NZST)' },
            { name: 'Hawaii', offset: -10, label: 'Hawaii (HST)' },
            { name: 'Alaska', offset: -9, label: 'Alaska (AKST)' },
            { name: 'Brazil', offset: -3, label: 'Brazil (BRT)' },
            { name: 'Western Europe', offset: 1, label: 'Western Europe (WET)' },
            { name: 'Eastern Europe', offset: 2, label: 'Eastern Europe (EET)' },
            { name: 'Moscow', offset: 3, label: 'Moscow (MSK)' },
            { name: 'Dubai', offset: 4, label: 'Dubai (GST)' },
            { name: 'Singapore', offset: 8, label: 'Singapore (SGT)' },
            { name: 'Hong Kong', offset: 8, label: 'Hong Kong (HKT)' },
            { name: 'Korea', offset: 9, label: 'Korea (KST)' },
            { name: 'China', offset: 8, label: 'China (CST)' }
        ];

        const sourceTimezone = document.getElementById('sourceTimezone');
        const inputDateTime = document.getElementById('inputDateTime');
        const clockGrid = document.getElementById('clockGrid');
        const toast = document.getElementById('toast');
        let timeFormat = '24h';

        timezones.forEach((tz, i) => {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = tz.label;
            sourceTimezone.appendChild(option);
        });

        const now = new Date();
        inputDateTime.value = formatDateTimeLocal(now);

        function formatDateTimeLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function formatTime(date, format) {
            if (format === '24h') {
                return date.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit' });
            }
        }

        function convertTime() {
            const inputDate = new Date(inputDateTime.value);
            if (isNaN(inputDate.getTime())) return;

            const sourceIdx = parseInt(sourceTimezone.value);
            const sourceOffset = timezones[sourceIdx].offset;

            const utcTime = new Date(inputDate.getTime() - (sourceOffset * 60 * 60 * 1000));

            clockGrid.innerHTML = '';

            timezones.forEach((tz, i) => {
                const localTime = new Date(utcTime.getTime() + (tz.offset * 60 * 60 * 1000));

                const card = document.createElement('div');
                card.className = 'clock-card';
                card.onclick = () => copyToClipboard(formatTime(localTime, timeFormat));
                card.innerHTML = `
                    <div class="clock-label">${tz.label}</div>
                    <div class="clock-time">${formatTime(localTime, timeFormat)}</div>
                    <div class="clock-date">${localTime.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</div>
                `;
                clockGrid.appendChild(card);
            });
        }

        function setFormat(format) {
            timeFormat = format;
            document.getElementById('btn24h').classList.toggle('active', format === '24h');
            document.getElementById('btn12h').classList.toggle('active', format === '12h');
            convertTime();
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1500);
            });
        }

        convertTime();
        setInterval(convertTime, 60000);
    </script>
</body>
</html>
