<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#22c55e;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:700px;width:100%;margin:0 auto}
.output-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px;position:relative}
.password-display{font-family:var(--mono);font-size:24px;letter-spacing:1px;word-break:break-all;min-height:40px;display:flex;align-items:center}
.copy-btn{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:var(--accent);color:#000;border:none;padding:8px 16px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s}
.copy-btn:hover{opacity:.8}
.strength-bar{height:4px;background:var(--border);border-radius:2px;margin-top:16px;overflow:hidden}
.strength-fill{height:100%;border-radius:2px;transition:all .3s}
.strength-label{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.setting:last-child{border:none}
.setting label{font-size:14px}
.setting input[type=range]{width:120px;accent-color:var(--accent)}
.range-val{font-family:var(--mono);font-size:14px;color:var(--accent);min-width:30px;text-align:right}
.toggle{width:44px;height:24px;background:var(--border);border-radius:12px;position:relative;cursor:pointer;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.btn{background:var(--accent);color:#000;border:none;padding:12px 24px;border-radius:var(--radius);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;width:100%;margin-top:20px;transition:opacity .2s}
.btn:hover{opacity:.8}
.batch{margin-top:20px}
.batch h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.batch-item{font-family:var(--mono);font-size:13px;padding:8px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;display:flex;justify-content:space-between;transition:color .2s}
.batch-item:hover{color:var(--accent)}
</style>
</head>
<body>
<header><h1>Password Generator</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="output-box">
<div class="password-display" id="password"></div>
<button class="copy-btn" onclick="copyPwd()">Copy</button>
<div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
<div class="strength-label"><span id="strengthText">—</span><span id="entropy"></span></div>
</div>
<div class="setting"><label>Length</label><input type="range" id="length" min="4" max="128" value="24" oninput="updateLength()"><span class="range-val" id="lengthVal">24</span></div>
<div class="setting"><label>Uppercase (A-Z)</label><div class="toggle on" id="t_upper" onclick="toggleSetting(this)"></div></div>
<div class="setting"><label>Lowercase (a-z)</label><div class="toggle on" id="t_lower" onclick="toggleSetting(this)"></div></div>
<div class="setting"><label>Numbers (0-9)</label><div class="toggle on" id="t_numbers" onclick="toggleSetting(this)"></div></div>
<div class="setting"><label>Symbols (!@#$...)</label><div class="toggle on" id="t_symbols" onclick="toggleSetting(this)"></div></div>
<div class="setting"><label>Exclude Ambiguous (l1Io0O)</label><div class="toggle" id="t_ambiguous" onclick="toggleSetting(this)"></div></div>
<button class="btn" onclick="generate()">Generate</button>
<div class="batch" id="batch"></div>
</div>
<script>
const UPPER='ABCDEFGHIJKLMNOPQRSTUVWXYZ',LOWER='abcdefghijklmnopqrstuvwxyz',NUMBERS='0123456789',SYMBOLS='!@#$%^&*()_+-=[]{}|;:,.<>?',AMBIGUOUS='l1Io0O';
function getChars(){let c='';if(document.getElementById('t_upper').classList.contains('on'))c+=UPPER;if(document.getElementById('t_lower').classList.contains('on'))c+=LOWER;if(document.getElementById('t_numbers').classList.contains('on'))c+=NUMBERS;if(document.getElementById('t_symbols').classList.contains('on'))c+=SYMBOLS;if(!c)c=LOWER;if(document.getElementById('t_ambiguous').classList.contains('on'))c=[...c].filter(x=>!AMBIGUOUS.includes(x)).join('');return c}
function generateOne(len){const c=getChars();const a=new Uint32Array(len);crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join('')}
function generate(){const len=+document.getElementById('length').value;const pwd=generateOne(len);document.getElementById('password').textContent=pwd;updateStrength(pwd);generateBatch(len)}
function updateLength(){document.getElementById('lengthVal').textContent=document.getElementById('length').value;generate()}
function toggleSetting(el){el.classList.toggle('on');generate()}
function updateStrength(pwd){let s=0;const c=getChars();s=Math.log2(Math.pow(c.length,pwd.length));const pct=Math.min(100,s/128*100);const fill=document.getElementById('strengthFill');const txt=document.getElementById('strengthText');const ent=document.getElementById('entropy');fill.style.width=pct+'%';ent.textContent=Math.round(s)+' bits';if(s<28){fill.style.background='#ef4444';txt.textContent='Very Weak'}else if(s<36){fill.style.background='#f97316';txt.textContent='Weak'}else if(s<60){fill.style.background='#eab308';txt.textContent='Fair'}else if(s<80){fill.style.background='#22c55e';txt.textContent='Strong'}else{fill.style.background='#06b6d4';txt.textContent='Very Strong'}}
function generateBatch(len){const el=document.getElementById('batch');let html='<h3>Click to copy</h3>';for(let i=0;i<5;i++){const p=generateOne(len);html+=`<div class="batch-item" onclick="copyBatch(this,'${p.replace(/'/g,"\\'")}')">${p}</div>`}el.innerHTML=html}
function copyPwd(){navigator.clipboard.writeText(document.getElementById('password').textContent)}
function copyBatch(el,pwd){navigator.clipboard.writeText(pwd);el.style.color='#22c55e';setTimeout(()=>el.style.color='',1000)}
generate();
</script>
</body>
</html>
