<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Outfit',sans-serif;min-height:100vh;padding:20px}
.header{display:flex;align-items:center;gap:20px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #222}
.header h1{font-size:1.8rem;font-weight:600}
.header a{color:#737373;text-decoration:none;font-size:0.9rem;transition:color .2s}
.header a:hover{color:#fff}
.search-wrap{margin-bottom:20px}
.search{width:100%;padding:12px 16px;background:#111;border:1px solid #222;border-radius:8px;color:#fff;font-family:'Outfit',sans-serif;font-size:1rem;outline:none;transition:border-color .2s}
.search:focus{border-color:#555}
.search::placeholder{color:#737373}
.stats{color:#737373;font-size:0.85rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#111;border:1px solid #222;border-radius:8px;padding:16px;cursor:pointer;transition:all .2s}
.card:hover{border-color:#555;background:#161616}
.card.copied{border-color:#4ade80;box-shadow:0 0 12px rgba(74,222,128,0.15)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.entity-name{font-weight:600;font-size:1rem;color:#e5e5e5}
.entity-char{font-size:2rem;line-height:1;min-width:48px;text-align:center;background:#0a0a0a;border:1px solid #222;border-radius:6px;padding:6px 10px}
.codes{display:flex;flex-direction:column;gap:4px}
.code-row{font-family:'Courier New',monospace;font-size:0.8rem;color:#737373}
.code-row span{color:#a5a5a5}
.copied-toast{position:fixed;bottom:24px;right:24px;background:#222;color:#4ade80;padding:10px 18px;border-radius:8px;font-size:0.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.copied-toast.show{opacity:1}
</style>
</head>

const grid=document.getElementById('grid');
const searchInput=document.getElementById('searchInput');
const stats=document.getElementById('stats');
const toast=document.getElementById('toast');
let toastTimer;
function showToast(msg){
toast.textContent=msg;
toast.classList.add('show');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>toast.classList.remove('show'),1500);
}
function copyText(text){
navigator.clipboard.writeText(text).then(()=>showToast('Copied: '+text));
}

const f=filter.toLowerCase();
const filtered=entities.filter(e=>!f||e.name.toLowerCase().includes(f)||e.char.includes(f)||e.hex.toLowerCase().includes(f)||e.dec.toLowerCase().includes(f));

const card=document.createElement('div');
card.className='card';
card.innerHTML=`
<div class="card-top">
