<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Expression Parser</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--border:#222;--text:#fff;--muted:#737373;--accent:#a855f7;--radius:6px;--mono:'SF Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{padding:30px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px}
header h1{font-size:20px;font-weight:500}
header a{color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s}
header a:hover{color:var(--text)}
.content{flex:1;padding:40px;max-width:800px;width:100%;margin:0 auto}
.input-row{display:flex;gap:12px;margin-bottom:24px}
.input-row input{flex:1;background:var(--surface);color:var(--accent);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-family:var(--mono);font-size:18px;outline:none}
.input-row input:focus{border-color:var(--accent)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.preset{background:var(--surface);color:var(--muted);border:1px solid var(--border);padding:6px 12px;border-radius:var(--radius);font-size:11px;font-family:var(--mono);cursor:pointer;transition:all .2s}
.preset:hover{color:var(--text);border-color:#444}
.description{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;font-size:15px;line-height:1.6}
.description .highlight{color:var(--accent);font-weight:500}
.fields{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}
.field{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;text-align:center}
.field .label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px}
.field .value{font-family:var(--mono);font-size:13px}
.next-runs h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}
.next-run{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;font-family:var(--mono);font-size:13px;display:flex;justify-content:space-between}
.next-run .time{color:var(--accent)}
.error{color:#ef4444;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header><h1>Cron Expression Parser</h1><a href="index.html">← Back to Tools</a></header>
<div class="content">
<div class="input-row">
<input type="text" id="cron" value="*/5 * * * *" placeholder="* * * * *" oninput="parse()">
</div>
<div class="presets">
<button class="preset" onclick="setCron('* * * * *')">Every minute</button>
<button class="preset" onclick="setCron('*/5 * * * *')">Every 5 min</button>
<button class="preset" onclick="setCron('0 * * * *')">Every hour</button>
<button class="preset" onclick="setCron('0 0 * * *')">Daily</button>
<button class="preset" onclick="setCron('0 0 * * 0')">Weekly</button>
<button class="preset" onclick="setCron('0 0 1 * *')">Monthly</button>
<button class="preset" onclick="setCron('0 9 * * 1-5')">Weekdays 9am</button>
<button class="preset" onclick="setCron('0 0 * * 1')">Mondays</button>
</div>
<div class="description" id="desc"></div>
<div class="fields" id="fields"></div>
<div id="error" class="error"></div>
<div class="next-runs" id="nextRuns"></div>
</div>
<script>
const fieldNames=['Minute','Hour','Day of Month','Month','Day of Week'];
function setCron(v){document.getElementById('cron').value=v;parse()}
function parse(){
const expr=document.getElementById('cron').value.trim();
const parts=expr.split(/\s+/);
const desc=document.getElementById('desc');
const fields=document.getElementById('fields');
const err=document.getElementById('error');
const nextEl=document.getElementById('nextRuns');
err.textContent='';
if(parts.length!==5){desc.innerHTML='Invalid: expected 5 fields, got '+parts.length;fields.innerHTML='';nextEl.innerHTML='';return}
try{
const parsed=parts.map((p,i)=>({field:fieldNames[i],value:p,tokens:expand(p,i)}));
fields.innerHTML=parsed.map(f=>`<div class="field"><div class="label">${f.field}</div><div class="value">${f.value}</div></div>`).join('');
const readable=describeCron(parts);
desc.innerHTML=readable;
const nextRuns=getNextRuns(parts,5);
nextEl.innerHTML='<h3>Next 5 Runs</h3>'+nextRuns.map((r,i)=>`<div class="next-run"><span>#${i+1}</span><span class="time">${r}</span></div>`).join('');
}catch(e){desc.innerHTML='';fields.innerHTML='';err.textContent='Error: '+e.message;nextEl.innerHTML=''}
}
function expand(field,type){
if(field==='*')return'*';
if(field.includes(','))return field.split(',').flatMap(f=>expand(f,type));
if(field.includes('-')){const[a,b]=field.split('-').map(Number);return Array.from({length:b-a+1},(_,i)=>a+i)}
if(field.includes('/')){const[step]=field.split('/').map(Number);const max=type===0?59:type===1?23:type===2?31:type===3?12:6;return Array.from({length:Math.floor(max/step)+1},(_,i)=>i*step)}
return[Number(field)];
}
function describeCron(p){
let d='Runs ';
if(p[0]==='*'&&p[1]==='*')d+='<span class="highlight">every minute</span>';
else if(p[0].includes('/'))d+=`every <span class="highlight">${p[0].split('/')[1]} minutes</span>`;
else if(p[1].includes('/'))d+=`every <span class="highlight">${p[1].split('/')[1]} hours</span>`;
else if(p[0]!=='*'&&p[1]!=='*')d+=`at <span class="highlight">${p[1].padStart(2,'0')}:${p[0].padStart(2,'0')}</span>`;
else if(p[1]!=='*')d+=`every hour at minute <span class="highlight">${p[0]}</span>`;
else d+=`at minute <span class="highlight">${p[0]}</span>`;
if(p[2]!=='*')d+=`, on day <span class="highlight">${p[2]}</span>`;
if(p[3]!=='*')d+=`, in month <span class="highlight">${p[3]}</span>`;
if(p[4]!=='*'){const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];d+=`, on <span class="highlight">${p[4].split(',').map(d=>days[d]||d).join(', ')}</span>`}
return d+'.';
}
function getNextRuns(p,count){
const runs=[];const now=new Date();let d=new Date(now);d.setSeconds(0);d.setMilliseconds(0);d.setMinutes(d.getMinutes()+1);
const maxIter=525960;
for(let i=0;i<maxIter&&runs.length<count;i++){
if(matchesCron(d,p))runs.push(d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}));
d.setMinutes(d.getMinutes()+1);
}
return runs;
}
function matchesCron(d,p){
const min=d.getMinutes(),hr=d.getHours(),day=d.getDate(),mon=d.getMonth()+1,dow=d.getDay();
return matchField(p[0],min,0,59)&&matchField(p[1],hr,0,23)&&matchField(p[2],day,1,31)&&matchField(p[3],mon,1,12)&&matchField(p[4],dow,0,6);
}
function matchField(field,val,min,max){
if(field==='*')return true;
return field.split(',').some(part=>{
if(part.includes('-')){const[a,b]=part.split('-').map(Number);return val>=a&&val<=b}
if(part.includes('/')){const[_,step]=part.split('/').map(Number);return val%step===0}
return Number(part)===val;
});
}
parse();
</script>
</body>
</html>
